openapi: 3.2.0
info:
  title: Minds Public Agent Runs API
  version: v1
  description: 'OpenAPI 3.1.0 spec for the Minds public API (https://getminds.ai/api/v1 / https://api.getminds.ai/v1). Generate a typed TypeScript client by running an OpenAPI generator (e.g. `openapi-typescript`) against `/_openapi.json`. Auth: send `Authorization: Bearer minds_…_key`; create keys in Settings → API Keys.'
servers:
- url: https://api.getminds.ai
  description: Production (api subdomain)
- url: https://getminds.ai
  description: Production (apex)
security:
- ApiKeyAuth: []
tags:
- name: Agent Runs
paths:
  /api/v1/runs/{runId}/cancel:
    post:
      responses:
        '200':
          description: Cancellation state.
        '404':
          description: Run not found.
      operationId: cancelAgentRun
      summary: Cancel a durable run
      tags:
      - Agent Runs
      security:
      - ApiKeyAuth: []
      parameters:
      - in: path
        name: runId
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/runs/{runId}/events:
    get:
      responses:
        '200':
          description: Events ordered by monotonically increasing sequence.
      operationId: listAgentRunEvents
      summary: Replay ordered durable run events
      tags:
      - Agent Runs
      security:
      - ApiKeyAuth: []
      parameters:
      - in: path
        name: runId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: after
        required: false
        schema:
          type: integer
          minimum: -1
          default: -1
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
  /api/v1/runs/{runId}:
    get:
      responses:
        '200':
          description: 'Authoritative run status. `readinessWait` (`waitingFor`, `notReadyCount`, `waitingSince`, `budgetMs`, `updatedAt`) is present while the run is queued waiting for Minds to finish training, and null otherwise. `budgetMs` is the alert threshold, not a deadline: the run keeps waiting for as long as the Minds are being trained. `error.code: minds_not_ready` is reported only for a run in which no Mind can answer and none can be retrained, naming them.'
        '404':
          description: Run not found.
      operationId: getAgentRun
      summary: Get durable run status
      tags:
      - Agent Runs
      security:
      - ApiKeyAuth: []
      parameters:
      - in: path
        name: runId
        required: true
        schema:
          type: string
          format: uuid
components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: 'Personal API key. Format: `Bearer minds_…_key`. Create one at https://getminds.ai/settings/api-keys.'
x-provenance:
  method: harvested
  publisher: Minds
  source: https://api.getminds.ai/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
