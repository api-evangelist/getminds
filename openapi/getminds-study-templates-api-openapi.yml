openapi: 3.2.0
info:
  title: Minds Public Study Templates API
  version: v1
  description: 'OpenAPI 3.1.0 spec for the Minds public API (https://getminds.ai/api/v1 / https://api.getminds.ai/v1). Generate a typed TypeScript client by running an OpenAPI generator (e.g. `openapi-typescript`) against `/_openapi.json`. Auth: send `Authorization: Bearer minds_…_key`; create keys in Settings → API Keys.'
servers:
- url: https://api.getminds.ai
  description: Production (api subdomain)
- url: https://getminds.ai
  description: Production (apex)
security:
- ApiKeyAuth: []
tags:
- name: Study Templates
paths:
  /api/v1/study-templates/{id}:
    delete:
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - success
                    properties:
                      success:
                        type: boolean
        '400':
          description: Invalid template configuration or request.
        '401':
          description: Unauthorized.
        '404':
          description: Template not found or not owned by the caller.
        '409':
          description: Revision changed or a saved Audience/file is unavailable.
        '500':
          description: Internal server error. Responses are private and non-cacheable.
      operationId: deleteStudyTemplate
      summary: Delete a personal Study template
      description: 'Templates are private by default. Owners may share one with their current team, or by email with specific people; current teammates and accepted invitees can read and use it. Only owners may update, delete, change sharing or manage who has access. The questionnaire is copied into an independent draft on use; using a template never starts research. Predefined templates are adapted in the app to the Study''s goal, context and selected Audiences: contextual questions name the product, task, price or compared options the context states, in the language of the brief; standardized instrument items (SUS, SEQ) keep their wording, in a published validated translation where one exists and otherwise in their original language; and when adaptation fails or would change the template structure, the saved questions are used as written. Custom templates retain their saved wording unless adaptation is requested. Uploaded assets are copied on save and use. A template also carries the research method it was built with: a calculator-backed method that designs its own tasks at execution (Van Westendorp, Gabor-Granger, MaxDiff, conjoint, Kano, NPS, top-box, key drivers, TURF) writes those questions when the Study runs, and the saved questions are asked alongside them.'
      tags:
      - Study Templates
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/StudyTemplate'
        '400':
          description: Invalid template configuration or request.
        '401':
          description: Unauthorized.
        '404':
          description: Template not found or not owned by the caller.
        '409':
          description: Revision changed or a saved Audience/file is unavailable.
        '500':
          description: Internal server error. Responses are private and non-cacheable.
      operationId: getStudyTemplate
      summary: Get a personal Study template
      description: 'Templates are private by default. Owners may share one with their current team, or by email with specific people; current teammates and accepted invitees can read and use it. Only owners may update, delete, change sharing or manage who has access. The questionnaire is copied into an independent draft on use; using a template never starts research. Predefined templates are adapted in the app to the Study''s goal, context and selected Audiences: contextual questions name the product, task, price or compared options the context states, in the language of the brief; standardized instrument items (SUS, SEQ) keep their wording, in a published validated translation where one exists and otherwise in their original language; and when adaptation fails or would change the template structure, the saved questions are used as written. Custom templates retain their saved wording unless adaptation is requested. Uploaded assets are copied on save and use. A template also carries the research method it was built with: a calculator-backed method that designs its own tasks at execution (Van Westendorp, Gabor-Granger, MaxDiff, conjoint, Kano, NPS, top-box, key drivers, TURF) writes those questions when the Study runs, and the saved questions are asked alongside them.'
      tags:
      - Study Templates
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/StudyTemplate'
        '400':
          description: Malformed JSON or invalid template configuration or request.
        '401':
          description: Unauthorized.
        '404':
          description: Template not found or not owned by the caller.
        '409':
          description: Revision changed or a saved Audience/file is unavailable.
        '413':
          description: Request exceeds 1 MiB.
        '500':
          description: Internal server error. Responses are private and non-cacheable.
      operationId: updateStudyTemplate
      summary: Rename or replace a Study template
      description: 'Templates are private by default. Owners may share one with their current team, or by email with specific people; current teammates and accepted invitees can read and use it. Only owners may update, delete, change sharing or manage who has access. The questionnaire is copied into an independent draft on use; using a template never starts research. Predefined templates are adapted in the app to the Study''s goal, context and selected Audiences: contextual questions name the product, task, price or compared options the context states, in the language of the brief; standardized instrument items (SUS, SEQ) keep their wording, in a published validated translation where one exists and otherwise in their original language; and when adaptation fails or would change the template structure, the saved questions are used as written. Custom templates retain their saved wording unless adaptation is requested. Uploaded assets are copied on save and use. A template also carries the research method it was built with: a calculator-backed method that designs its own tasks at execution (Van Westendorp, Gabor-Granger, MaxDiff, conjoint, Kano, NPS, top-box, key drivers, TURF) writes those questions when the Study runs, and the saved questions are asked alongside them.'
      tags:
      - Study Templates
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudyTemplateUpdateInput'
  /api/v1/study-templates/{id}/invitations/{invitationId}:
    delete:
      responses:
        '200':
          description: Cancelled; the invitation link no longer works. Revoking a cancelled invitation succeeds again.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - success
                    properties:
                      success:
                        type: boolean
        '401':
          description: Unauthorized.
        '404':
          description: Template or invitation not found, or the template is not owned by the caller.
        '409':
          description: The invitation is no longer pending.
        '500':
          description: Internal server error. Responses are private and non-cacheable.
      operationId: revokeStudyTemplateInvitation
      summary: Revoke a pending Study template invitation (owner only)
      description: 'Templates are private by default. Owners may share one with their current team, or by email with specific people; current teammates and accepted invitees can read and use it. Only owners may update, delete, change sharing or manage who has access. The questionnaire is copied into an independent draft on use; using a template never starts research. Predefined templates are adapted in the app to the Study''s goal, context and selected Audiences: contextual questions name the product, task, price or compared options the context states, in the language of the brief; standardized instrument items (SUS, SEQ) keep their wording, in a published validated translation where one exists and otherwise in their original language; and when adaptation fails or would change the template structure, the saved questions are used as written. Custom templates retain their saved wording unless adaptation is requested. Uploaded assets are copied on save and use. A template also carries the research method it was built with: a calculator-backed method that designs its own tasks at execution (Van Westendorp, Gabor-Granger, MaxDiff, conjoint, Kano, NPS, top-box, key drivers, TURF) writes those questions when the Study runs, and the saved questions are asked alongside them.'
      tags:
      - Study Templates
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/study-templates/{id}/invitations:
    get:
      responses:
        '200':
          description: 'Accepted members (`kind: member`, `id` is their user id, removable with DELETE …/members/{userId}) and pending, unexpired invitations (`kind: invitation`, revocable with DELETE …/invitations/{invitationId}). Team access is the template''s `isSharedWithTeam`.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StudyTemplateAccessEntry'
        '401':
          description: Unauthorized.
        '404':
          description: Template not found or not owned by the caller.
        '500':
          description: Internal server error. Responses are private and non-cacheable.
      operationId: listStudyTemplateAccess
      summary: List who has email access to a Study template (owner only)
      description: 'Templates are private by default. Owners may share one with their current team, or by email with specific people; current teammates and accepted invitees can read and use it. Only owners may update, delete, change sharing or manage who has access. The questionnaire is copied into an independent draft on use; using a template never starts research. Predefined templates are adapted in the app to the Study''s goal, context and selected Audiences: contextual questions name the product, task, price or compared options the context states, in the language of the brief; standardized instrument items (SUS, SEQ) keep their wording, in a published validated translation where one exists and otherwise in their original language; and when adaptation fails or would change the template structure, the saved questions are used as written. Custom templates retain their saved wording unless adaptation is requested. Uploaded assets are copied on save and use. A template also carries the research method it was built with: a calculator-backed method that designs its own tasks at execution (Van Westendorp, Gabor-Granger, MaxDiff, conjoint, Kano, NPS, top-box, key drivers, TURF) writes those questions when the Study runs, and the saved questions are asked alongside them.'
      tags:
      - Study Templates
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      responses:
        '200':
          description: Invitations created. Each address gets an invitation email valid for seven days; re-inviting refreshes the link. An accepted invitee can read and use the template but not change, delete or share it. Addresses in `emailFailures` were invited but their email was not delivered.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/StudyTemplateInvitationResult'
        '400':
          description: Malformed JSON, invalid email or only your own address.
        '401':
          description: Unauthorized.
        '404':
          description: Template not found or not owned by the caller.
        '413':
          description: Request exceeds 16 KiB.
        '500':
          description: Internal server error. Responses are private and non-cacheable.
      operationId: inviteToStudyTemplate
      summary: Share a Study template by email (owner only)
      description: 'Templates are private by default. Owners may share one with their current team, or by email with specific people; current teammates and accepted invitees can read and use it. Only owners may update, delete, change sharing or manage who has access. The questionnaire is copied into an independent draft on use; using a template never starts research. Predefined templates are adapted in the app to the Study''s goal, context and selected Audiences: contextual questions name the product, task, price or compared options the context states, in the language of the brief; standardized instrument items (SUS, SEQ) keep their wording, in a published validated translation where one exists and otherwise in their original language; and when adaptation fails or would change the template structure, the saved questions are used as written. Custom templates retain their saved wording unless adaptation is requested. Uploaded assets are copied on save and use. A template also carries the research method it was built with: a calculator-backed method that designs its own tasks at execution (Van Westendorp, Gabor-Granger, MaxDiff, conjoint, Kano, NPS, top-box, key drivers, TURF) writes those questions when the Study runs, and the saved questions are asked alongside them.'
      tags:
      - Study Templates
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudyTemplateInviteInput'
  /api/v1/study-templates/{id}/members/{userId}:
    delete:
      responses:
        '200':
          description: Removed. The person can no longer list, read or use the template, and the invitations they accepted are revoked; drafts they already created stay theirs. File links already handed out (template attachments) follow the same signed-URL rules as Study files and are not revoked.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - success
                    properties:
                      success:
                        type: boolean
        '401':
          description: Unauthorized.
        '404':
          description: Template or member not found, or the template is not owned by the caller.
        '500':
          description: Internal server error. Responses are private and non-cacheable.
      operationId: removeStudyTemplateMember
      summary: Remove a person's email access to a Study template (owner only)
      description: 'Templates are private by default. Owners may share one with their current team, or by email with specific people; current teammates and accepted invitees can read and use it. Only owners may update, delete, change sharing or manage who has access. The questionnaire is copied into an independent draft on use; using a template never starts research. Predefined templates are adapted in the app to the Study''s goal, context and selected Audiences: contextual questions name the product, task, price or compared options the context states, in the language of the brief; standardized instrument items (SUS, SEQ) keep their wording, in a published validated translation where one exists and otherwise in their original language; and when adaptation fails or would change the template structure, the saved questions are used as written. Custom templates retain their saved wording unless adaptation is requested. Uploaded assets are copied on save and use. A template also carries the research method it was built with: a calculator-backed method that designs its own tasks at execution (Van Westendorp, Gabor-Granger, MaxDiff, conjoint, Kano, NPS, top-box, key drivers, TURF) writes those questions when the Study runs, and the saved questions are asked alongside them.'
      tags:
      - Study Templates
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/study-templates/{id}/use:
    post:
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/StudyDraft'
        '400':
          description: Malformed JSON or invalid template configuration or request.
        '401':
          description: Unauthorized.
        '404':
          description: Template not found or not owned by the caller.
        '409':
          description: Revision changed or a saved Audience/file is unavailable.
        '413':
          description: Request exceeds 4 KiB.
        '500':
          description: Internal server error. Responses are private and non-cacheable.
      operationId: instantiateStudyTemplate
      summary: Create an independent draft from a Study template
      description: 'Templates are private by default. Owners may share one with their current team, or by email with specific people; current teammates and accepted invitees can read and use it. Only owners may update, delete, change sharing or manage who has access. The questionnaire is copied into an independent draft on use; using a template never starts research. Predefined templates are adapted in the app to the Study''s goal, context and selected Audiences: contextual questions name the product, task, price or compared options the context states, in the language of the brief; standardized instrument items (SUS, SEQ) keep their wording, in a published validated translation where one exists and otherwise in their original language; and when adaptation fails or would change the template structure, the saved questions are used as written. Custom templates retain their saved wording unless adaptation is requested. Uploaded assets are copied on save and use. A template also carries the research method it was built with: a calculator-backed method that designs its own tasks at execution (Van Westendorp, Gabor-Granger, MaxDiff, conjoint, Kano, NPS, top-box, key drivers, TURF) writes those questions when the Study runs, and the saved questions are asked alongside them.'
      tags:
      - Study Templates
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudyTemplateUseInput'
  /api/v1/study-templates:
    get:
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StudyTemplate'
                  pagination:
                    type: object
                    required:
                    - total
                    - limit
                    - offset
                    properties:
                      total:
                        type: integer
                        description: Templates matching the search.
                      limit:
                        type:
                        - integer
                        - 'null'
                        description: Page size requested; null when every match is returned.
                      offset:
                        type: integer
                        description: Number of matching templates skipped.
        '400':
          description: Invalid template configuration or request.
        '401':
          description: Unauthorized.
        '404':
          description: Template not found or not owned by the caller.
        '409':
          description: Revision changed or a saved Audience/file is unavailable.
        '500':
          description: Internal server error. Responses are private and non-cacheable.
      operationId: listStudyTemplates
      summary: List your personal Study templates
      description: 'Templates are private by default. Owners may share one with their current team, or by email with specific people; current teammates and accepted invitees can read and use it. Only owners may update, delete, change sharing or manage who has access. The questionnaire is copied into an independent draft on use; using a template never starts research. Predefined templates are adapted in the app to the Study''s goal, context and selected Audiences: contextual questions name the product, task, price or compared options the context states, in the language of the brief; standardized instrument items (SUS, SEQ) keep their wording, in a published validated translation where one exists and otherwise in their original language; and when adaptation fails or would change the template structure, the saved questions are used as written. Custom templates retain their saved wording unless adaptation is requested. Uploaded assets are copied on save and use. A template also carries the research method it was built with: a calculator-backed method that designs its own tasks at execution (Van Westendorp, Gabor-Granger, MaxDiff, conjoint, Kano, NPS, top-box, key drivers, TURF) writes those questions when the Study runs, and the saved questions are asked alongside them.'
      tags:
      - Study Templates
      security:
      - ApiKeyAuth: []
      parameters:
      - in: query
        name: search
        required: false
        description: Case-insensitive substring of the template name (at most 200 characters).
        schema:
          type: string
          maxLength: 200
      - in: query
        name: limit
        required: false
        description: Templates per page. Omit to list every visible template.
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - in: query
        name: offset
        required: false
        description: Number of matching templates to skip.
        schema:
          type: integer
          minimum: 0
          default: 0
    post:
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/StudyTemplate'
        '400':
          description: Malformed JSON or invalid template configuration or request.
        '401':
          description: Unauthorized.
        '404':
          description: Template not found or not owned by the caller.
        '409':
          description: Revision changed or a saved file is unavailable.
        '413':
          description: Request exceeds 1 MiB.
        '500':
          description: Internal server error. Responses are private and non-cacheable.
      operationId: saveStudyTemplate
      summary: Save a personal Custom Study template
      description: 'Templates are private by default. Owners may share one with their current team, or by email with specific people; current teammates and accepted invitees can read and use it. Only owners may update, delete, change sharing or manage who has access. The questionnaire is copied into an independent draft on use; using a template never starts research. Predefined templates are adapted in the app to the Study''s goal, context and selected Audiences: contextual questions name the product, task, price or compared options the context states, in the language of the brief; standardized instrument items (SUS, SEQ) keep their wording, in a published validated translation where one exists and otherwise in their original language; and when adaptation fails or would change the template structure, the saved questions are used as written. Custom templates retain their saved wording unless adaptation is requested. Uploaded assets are copied on save and use. A template also carries the research method it was built with: a calculator-backed method that designs its own tasks at execution (Van Westendorp, Gabor-Granger, MaxDiff, conjoint, Kano, NPS, top-box, key drivers, TURF) writes those questions when the Study runs, and the saved questions are asked alongside them.'
      tags:
      - Study Templates
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudyTemplateCreateInput'
      parameters: []
components:
  schemas:
    StudyDraft:
      type: object
      required:
      - id
      - userId
      - name
      - mode
      - currentStep
      - revision
      - status
      - payload
      - studyId
      - startRequestId
      - startLeaseExpiresAt
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
        mode:
          type: string
          enum:
          - quick
          - custom
        currentStep:
          type: string
        revision:
          type: integer
          minimum: 1
        sourceState:
          type: string
          enum:
          - none
          - ready
          - required
          description: Server assessment on creation, saving and reopening; ready does not replace verification of the submitted rows.
        status:
          type: string
          enum:
          - draft
          - starting
          - consumed
        payload:
          $ref: '#/components/schemas/StudyDraftPayload'
        studyId:
          type:
          - string
          - 'null'
          format: uuid
        startRequestId:
          type:
          - string
          - 'null'
          format: uuid
        startLeaseExpiresAt:
          type:
          - string
          - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    StudyTemplateUpdateInput:
      type: object
      additionalProperties: false
      required:
      - expectedRevision
      anyOf:
      - required:
        - name
      - required:
        - configuration
      - required:
        - isSharedWithTeam
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        configuration:
          $ref: '#/components/schemas/StudyTemplateConfiguration'
        expectedRevision:
          type: integer
          minimum: 1
        isSharedWithTeam:
          type: boolean
          description: Owner only. Share with the authenticated owner’s current team, or turn sharing off.
    StudyTemplateInviteInput:
      type: object
      additionalProperties: false
      required:
      - emails
      properties:
        emails:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            format: email
            maxLength: 320
    StudyTemplate:
      type: object
      required:
      - id
      - name
      - revision
      - configuration
      - createdAt
      - updatedAt
      - isSharedWithTeam
      - canManage
      - canShareWithTeam
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        revision:
          type: integer
          minimum: 1
        isSharedWithTeam:
          type: boolean
        canManage:
          type: boolean
          description: Only the owner may update, delete or share this template.
        canShareWithTeam:
          type: boolean
          description: The owner has a team, or can turn off existing sharing.
        configuration:
          $ref: '#/components/schemas/StudyTemplateConfiguration'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    StudyTemplateConfiguration:
      type: object
      additionalProperties: false
      required:
      - version
      - goal
      - studyLocale
      - questions
      - methodId
      properties:
        version:
          type: integer
          enum:
          - 1
        goal:
          type: string
          enum:
          - concept
          - comparison
          - website
          - pricing
          - market
          - explore
        studyLocale:
          type: string
          enum:
          - ar
          - de
          - en
          - es
          - fr
          - ja
          - ko
          - tr
          - zh
        methodId:
          type: string
          description: A registered research method that is currently available. Methods that design their own tasks at execution (Van Westendorp, MaxDiff, Kano, NPS, …) keep only the qualitative questions in `questions`.
        questions:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - text
            - response
            properties:
              text:
                type: string
              response:
                $ref: '#/components/schemas/StudyTemplateQuestionResponse'
              attachments:
                type: array
                items:
                  $ref: '#/components/schemas/StudyTemplateAsset'
                default: []
    StudyTemplateInvitationResult:
      type: object
      required:
      - invitations
      - emailFailures
      - message
      properties:
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/StudyTemplateInvitation'
        emailFailures:
          type: array
          items:
            type: string
            format: email
          description: Invited, but the email was not delivered. Share the link another way.
        message:
          type: string
    StudyDraftPayload:
      type: object
      required:
      - version
      - state
      additionalProperties: true
      properties:
        version:
          type: integer
          enum:
          - 1
        state:
          type: object
          additionalProperties: true
    StudyTemplateCreateInput:
      type: object
      additionalProperties: false
      required:
      - name
      - configuration
      properties:
        requestId:
          type: string
          format: uuid
          description: Reuse only for retries of the same save.
        name:
          type: string
          minLength: 1
          maxLength: 200
        configuration:
          $ref: '#/components/schemas/StudyTemplateConfiguration'
    StudyTemplateQuestionResponse:
      type: object
      properties:
        type:
          type: string
          enum:
