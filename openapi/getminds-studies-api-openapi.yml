        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        messageCount:
          type: integer
        isLinkSharingEnabled:
          type: boolean
        publicShareId:
          type:
          - string
          - 'null'
          format: uuid
        audiences:
          type: array
