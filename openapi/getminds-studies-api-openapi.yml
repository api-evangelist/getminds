        version:
          type: integer
          enum:
          - 1
        executionPolicy:
          type: object
          additionalProperties: false
          required:
          - sourcePolicy
          properties:
            sourcePolicy:
              type: string
              enum:
              - request_only
              - auto
              description: Frozen evidence policy for the confirmed run. Ordinary Studies use relevant Mind knowledge alongside the assigned stimulus. Historical and internal evaluation runs may carry a closed policy.
            videoAnalysisStyle:
              type: string
              enum:
              - record
              - analyst
              description: Register of the one video summary every Mind of this run reads. record (default) writes down the spoken script, the visible scenes and the on-screen text; analyst deliberately reproduces the pre-2026-09 prompt, which reads tone and intent and raises the panel's positive rating bias.
            mindSourcePolicyOverrides:
              type: array
              maxItems: 2000
              description: Deterministically ordered, checksum-lockable per-Mind experiment assignments. Unlisted Minds use sourcePolicy.
              items:
                type: object
                additionalProperties: false
                required:
                - mindId
                - sourcePolicy
                properties:
                  mindId:
                    type: string
                    format: uuid
                  sourcePolicy:
                    type: string
                    enum:
                    - request_only
                    - auto
        modules:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              questions:
                type: array
                items:
                  type: object
                  additionalProperties: true
                  properties:
                    id:
                      type: string
                    text:
                      type: string
                    response:
                      oneOf:
                      - type: object
                        required:
                        - type
                        additionalProperties: false
                        properties:
                          type:
                            type: string
                            enum:
                            - qualitative
                      - type: object
                        required:
                        - type
                        - categoricalOptions
                        additionalProperties: false
                        properties:
                          type:
                            type: string
                            enum:
                            - categorical
                          categoricalOptions:
                            type: array
                            minItems: 2
                            maxItems: 100
                            uniqueItems: true
                            items:
                              type: string
                              minLength: 1
                            description: Predefined answer choices shown to every Mind.
                      - type: object
                        required:
                        - type
                        - categoricalOptions
                        additionalProperties: false
                        properties:
                          type:
                            type: string
                            enum:
                            - multiselect
                          categoricalOptions:
                            type: array
                            minItems: 2
                            maxItems: 100
                            uniqueItems: true
                            items:
                              type: string
                              minLength: 1
                            description: Predefined answers from which each Mind may select multiple choices.
                          maxSelections:
                            type: integer
                            minimum: 1
                            maximum: 100
                            description: Maximum choices each respondent may select.
                      - type: object
                        required:
                        - type
                        - categoricalOptions
                        additionalProperties: false
                        properties:
                          type:
                            type: string
                            enum:
                            - ranking
                          categoricalOptions:
                            type: array
                            minItems: 2
                            maxItems: 100
                            uniqueItems: true
                            items:
                              type: string
                              minLength: 1
                            description: Predefined answers every Mind puts in order, first to last. Results report first places as the distribution plus each option's mean rank.
                      - type: object
                        required:
                        - type
                        additionalProperties: false
                        properties:
                          type:
                            type: string
                            enum:
                            - scale
                          unit:
                            type: object
                            properties:
                              kind:
                                type: string
                                enum:
                                - currency
                                - percentage
                                - duration
                                - length
                                - mass
                                - volume
                                - custom
                              code:
                                type: string
                                minLength: 1
                                maxLength: 80
                                description: ISO 4217 currency code (EUR, USD); % for percentage; singular Intl unit identifier (hour, meter, kilogram, liter) for measurements; or a label of up to 80 characters for custom. Selecting a unit does not convert numbers or impose a range.
                            required:
                            - kind
                            - code
                            additionalProperties: false
                            description: Unit of a numeric (scale) answer. Values stay plain numbers; result surfaces display them in this unit.
                          scalePoints:
                            type: array
                            minItems: 2
                            maxItems: 100
                            description: Exhaustive allowed numeric scale answers in authored order. Preserve literal labels and values; do not add intermediate points.
                            items:
                              type: object
                              additionalProperties: false
                              required:
                              - label
                              - value
                              properties:
                                label:
                                  type: string
                                  minLength: 1
                                value:
                                  type: number
                          scaleRange:
                            type: array
                            minItems: 2
                            maxItems: 2
                            items:
                              type: number
                            description: Optional inclusive finite numeric response bounds as [minimum, maximum]. Omit when the numeric response has no authored bounds.
                      description: Confirmed response contract for a planned question.
                    askIf:
                      type: object
                      additionalProperties: false
                      required:
                      - questionId
                      oneOf:
                      - required:
                        - answerIn
                      - required:
                        - answerNotIn
                      - required:
                        - categoryIn
                      - required:
                        - categoryNotIn
                      description: 'Ask this question only of respondents whose own answer to an earlier question matched. Give exactly one of: answerIn (asked when the respondent chose any of these options) or answerNotIn (asked when it chose none of them) for an earlier categorical or multiselect question, using its option labels exactly; or categoryIn / categoryNotIn for an earlier open (qualitative) question, which codes each respondent''s own answer into one of the categories named for that question (one coding frame per question, at most 12 categories) after it has been answered and before this question runs. An answer that fits none of the categories counts as none of them. Scale and ranking questions cannot gate. Respondents not asked are recorded as not asked and excluded from this question''s results.'
                      properties:
                        questionId:
                          type: string
                          minLength: 1
                          maxLength: 80
                          description: Id of the earlier question whose answer decides.
                        answerIn:
                          type: array
                          minItems: 1
                          maxItems: 100
                          items:
                            type: string
                            minLength: 1
                            maxLength: 500
                        answerNotIn:
                          type: array
                          minItems: 1
                          maxItems: 100
                          items:
                            type: string
                            minLength: 1
                            maxLength: 500
                        categoryIn:
                          type: array
                          minItems: 1
                          maxItems: 100
                          items:
                            type: string
                            minLength: 1
                            maxLength: 500
                        categoryNotIn:
                          type: array
                          minItems: 1
                          maxItems: 100
                          items:
                            type: string
                            minLength: 1
                            maxLength: 500
                    attachmentIds:
                      type: array
                      uniqueItems: true
                      items:
                        type: string
                      description: Durable Study-asset IDs assigned only to this question; [] means no assets. A question without attachmentIds receives every asset, and an asset no question lists is shown with every question instead of refusing the run.
    StudyAnalytics:
      type: object
      additionalProperties: true
      required:
      - studyName
      - totalAudiences
      - totalMinds
      - totalQuestions
      - totalDataPoints
      - questions
      properties:
        studyName:
          type: string
        locale:
          type: string
          description: 'Study display locale used to format values: the language of the Study''s confirmed research plan (studyLocale), else the stored Study locale, else en.'
        totalAudiences:
          type: integer
          minimum: 0
        totalMinds:
          type: integer
          minimum: 0
          description: Total Minds across the Study's Audiences (legacy wire name).
        totalQuestions:
          type: integer
          minimum: 0
        totalDataPoints:
          type: integer
          minimum: 0
        questions:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              index:
                type: integer
                minimum: 1
              title:
                type: string
              type:
                type: string
                enum:
                - scale
                - categorical
                - multiselect
                - qualitative
              classification:
                $ref: '#/components/schemas/StudyQuestionClassification'
              stats:
                type: object
                additionalProperties: true
        scaleQuestionRankings:
          type: array
          description: Scale questions ranked by overall mean, only among questions that share one scale (authored points, else range) and one unit. A missing unit and a missing range each form their own audience. A question alone on its measure has no ranking position and appears in no audience. Replaces the former single scaleQuestionRanking list, which compared means on different scales and units.
          items:
            type: object
            required:
            - scale
            - questions
            properties:
              scale:
                type: object
                description: The shared scale. Empty for open numeric questions without authored bounds.
                properties:
                  range:
                    type: array
                    minItems: 2
                    maxItems: 2
                    items:
                      type: number
                  points:
                    type: array
                    items:
                      type: object
                      required:
                      - label
                      - value
                      properties:
                        label:
                          type: string
                        value:
                          type: number
              unit:
                $ref: '#/components/schemas/NumericUnit'
              questions:
                type: array
                minItems: 2
                description: Highest mean first.
                items:
                  type: object
                  required:
                  - title
                  - mean
                  - sigma
                  - signalStrength
                  properties:
                    title:
                      type: string
                    mean:
                      type: number
                    sigma:
                      type: number
                    signalStrength:
                      type: string
                      enum:
                      - strong
                      - moderate
                      - weak
