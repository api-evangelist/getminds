    StudyAskRequest:
      type: object
      required:
      - question
      properties:
        question:
          type: string
          minLength: 1
          description: Research question to ask the study.
        sourcePolicy:
          type: string
          enum:
          - auto
          - knowledge_only
          default: auto
          description: knowledge_only forbids live/request sources, requires each Mind's processed knowledge, and fails closed when retrieval is empty.
        historyMode:
          type: string
          enum:
          - last5
          - followup_only
          - none
          default: none
          description: How much of each Mind's own prior answers this question carries. Defaults to none. Use last5 when a respondent's coherence across items is the deliverable.
        audienceIds:
          type: array
          description: Optional subset of attached audience UUIDs to ask. Defaults to all audiences on the study.
          items:
            type: string
            format: uuid
        textAttachments:
          type: array
          description: 'Pasted material the question is about (a newsletter, an email, a concept text), sent beside the question instead of inside it. Each entry is stored as a Markdown file in your uploads and processed like an entry of `attachments`; on a queued ask, respondents read the documents the run reads as material to react to. Counts toward the attachment limit. Rejected with `sourcePolicy: knowledge_only`.'
          items:
            type: object
            required:
            - text
            additionalProperties: false
            properties:
              name:
                type: string
                maxLength: 200
                description: File name for the stored Markdown file.
              text:
                type: string
                minLength: 1
                description: The pasted material, verbatim.
        attachments:
          type: array
          description: Files or images to process once and include as context for every Mind in the Study. Workspace uploads require ownership, a valid chat-file signature or shared Study context access. Remote HTTP(S) URLs are fetched with their own access token; knowing a storage path does not authorize renewal.
          items:
            $ref: '#/components/schemas/StudyAttachment'
        links:
          type: array
          description: Web links to fetch and summarize for context.
          items:
            $ref: '#/components/schemas/StudyContextLink'
        keywords:
          type: array
          description: Keyword/source pairs to fetch and summarize for context.
          items:
            $ref: '#/components/schemas/StudyKeywordContext'
        model:
          type: string
          description: Optional per-request model override. Must be sent together with `provider`.
        provider:
          type: string
          enum:
          - openai
          - anthropic
          - google
          description: Provider for the model override. Must be sent together with `model`.
        disableQuestionClassifier:
          type: boolean
          default: false
          description: Skip automatic scale/categorical/multiselect/qualitative classification.
        responseMode:
          type: string
          enum:
          - stream
          - queued
          description: Use queued to persist the question and return immediately while durable workers generate the answers. Queued asks support sourcePolicy auto; use the durable runs endpoint for knowledge_only or model connections. When omitted, the ask streams; while Minds of the Study are still training it is queued instead and answers 202 with the queued receipt (sourcePolicy auto). An explicit `stream` always streams, waiting with the stream open (up to 9 minutes) until those Minds are ready.
        responseForm:
          type: string
          enum:
          - concise
          - standard
          - expanded
          description: 'How long and how shaped each answer should be, for qualitative questions: `concise` one short message (5-20 words), `standard` 1-3 sentences (25-90 words), `expanded` 2-5 sentences (70-180 words). Omit to let the question decide, which is the existing behaviour. An authored form outranks the phrasing of the question, so a fixed instrument keeps its exact wording. Ignored for scale, categorical and multiselect questions, which are shaped by their answer space.'
        clientRequestId:
          type: string
          format: uuid
          description: Optional idempotency key for queued submissions.
    StudyOutputAnswer:
      type: object
      required:
      - value
      - persona
      - message
      properties:
        value:
          type: string
        rawValue:
          type: string
        rankedValues:
