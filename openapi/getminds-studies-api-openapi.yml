            type: object
            required:
            - id
            - name
            - mindCount
            - minds
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              mindCount:
                type: integer
              minds:
                type: array
                items:
                  type: object
                  required:
                  - id
                  - name
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
                    discipline:
                      type:
                      - string
                      - 'null'
                    profileImageUrl:
                      type:
                      - string
                      - 'null'
                      format: uri
    StudyDetail:
      type: object
      required:
      - id
      - name
      - flowMode
      - createdAt
      - updatedAt
      - isLinkSharingEnabled
      - publicShareId
      - audiences
      - messages
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        studyMode:
          type: string
          enum:
          - study
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        isLinkSharingEnabled:
          type: boolean
        publicShareId:
          type:
          - string
          - 'null'
          format: uuid
        audiences:
          type: array
          items:
            $ref: '#/components/schemas/StudyAudience'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/StudyMessage'
    StudyKeywordContext:
      type: object
      properties:
        label:
          type: string
          description: Keyword or topic label.
        url:
          type: string
          description: Optional source URL for the keyword.
        id:
          type: string
    StudyOutputAnswer:
      type: object
      required:
      - value
      - persona
      - message
      properties:
        value:
          type: string
        rawValue:
          type: string
        persona:
          type: string
        discipline:
          type:
          - string
          - 'null'
        message:
          type: string
        imageUrl:
          type:
          - string
          - 'null'
        reliabilityScore:
          type: integer
          minimum: 0
          maximum: 100
        citationSources:
          type: array
          description: Claim-level sources referenced by zero-based [N] markers in message.
          items:
            $ref: '#/components/schemas/StudyCitationSource'
        citationProvenance:
          $ref: '#/components/schemas/StudyCitationProvenance'
        answerProvenance:
          $ref: '#/components/schemas/StudyAnswerProvenance'
    StudyMessage:
      type: object
      required:
      - id
      - role
      - content
      - metadata
      - createdAt
      properties:
        id:
          type: string
        role:
          type: string
        content:
          type: string
        metadata: {}
        createdAt:
          type: string
          format: date-time
    StudyAudience:
      type: object
      required:
      - id
      - name
      - minds
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        minds:
          type: array
          items:
            $ref: '#/components/schemas/StudyMind'
    StudyOutputAudience:
      type: object
      required:
      - audience
      - value
      - answers
      properties:
        audience:
          type: string
          deprecated: true
          description: Deprecated alias for audience.
        value:
          type: string
        alignmentScore:
          type: integer
          minimum: 0
          maximum: 100
        answers:
          type: array
          items:
            $ref: '#/components/schemas/StudyOutputAnswer'
    StudyCategoryCodebookEntry:
      type: object
      required:
      - label
      - originalLabels
      - count
      properties:
        label:
          type: string
        originalLabels:
          type: array
          items:
            type: string
        count:
          type: integer
          minimum: 0
    StudyAskClassificationEvent:
      type: object
      required:
      - type
      - classification
      properties:
        type:
          type: string
          enum:
          - classification
        classification:
          $ref: '#/components/schemas/StudyQuestionClassification'
    StudyAskDoneEvent:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - done
    StudyAskRequest:
      type: object
      required:
      - question
      properties:
        question:
          type: string
          minLength: 1
          description: Research question to ask the study.
        sourcePolicy:
          type: string
          enum:
          - auto
          - knowledge_only
          default: auto
          description: knowledge_only forbids live/request sources, requires each Mind's processed knowledge, and fails closed when retrieval is empty.
        historyMode:
          type: string
          enum:
          - last5
          - followup_only
          - none
          default: none
          description: How much of each Mind's own prior answers this question carries. Defaults to none. Use last5 when a respondent's coherence across items is the deliverable.
        audienceIds:
          type: array
          description: Optional subset of attached audience UUIDs to ask. Defaults to all audiences on the study.
          items:
            type: string
            format: uuid
        attachments:
          type: array
          description: Files or images to process once and include as context for every Mind in the Study.
          items:
            $ref: '#/components/schemas/StudyAttachment'
        links:
          type: array
          description: Web links to fetch and summarize for context.
          items:
            $ref: '#/components/schemas/StudyContextLink'
        keywords:
          type: array
          description: Keyword/source pairs to fetch and summarize for context.
          items:
            $ref: '#/components/schemas/StudyKeywordContext'
        model:
          type: string
          description: Optional per-request model override. Must be sent together with `provider`.
        provider:
          type: string
          enum:
          - openai
          - anthropic
          - google
          description: Provider for the model override. Must be sent together with `model`.
        disableQuestionClassifier:
          type: boolean
          default: false
          description: Skip automatic scale/categorical/multiselect/qualitative classification.
        responseMode:
          type: string
          enum:
          - stream
          - queued
          default: stream
          description: Use queued to persist the question and return immediately while durable workers generate the answers.
        responseForm:
          type: string
          enum:
          - concise
          - standard
          - expanded
          description: 'How long and how shaped each answer should be, for qualitative questions: `concise` one short message (5-20 words), `standard` 1-3 sentences (25-90 words), `expanded` 2-5 sentences (70-180 words). Omit to let the question decide, which is the existing behaviour. An authored form outranks the phrasing of the question, so a fixed instrument keeps its exact wording. Ignored for scale, categorical and multiselect questions, which are shaped by their answer space.'
        clientRequestId:
          type: string
          format: uuid
          description: Optional idempotency key for queued submissions.
    StudyAskAnswerEvent:
      type: object
      required:
      - type
      - mindId
      - mindName
      - audienceId
      - audienceName
      - answer
      properties:
        type:
          type: string
          enum:
          - answer
        mindId:
          type: string
          format: uuid
        mindName:
          type: string
        discipline:
          type:
          - string
          - 'null'
        profileImageUrl:
          type:
          - string
          - 'null'
        audienceId:
          type: string
          format: uuid
        audienceName:
          type: string
        answer:
          type: string
    StudyQuestionClassification:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - scale
          - categorical
          - multiselect
          - qualitative
        scaleRange:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: number
        options:
          type: array
          items:
            type: string
        responseMode:
          type: string
          enum:
          - everyday
          - standard_qualitative
          - deliberative_values
          - scale
          - categorical
          - factual_research
          description: Answer-depth and grounding policy, orthogonal to the structured response type.
    StudyAttachment:
      type: object
      properties:
        url:
          type: string
          description: External URL for the uploaded or remote file.
        path:
          type: string
          description: Storage path for an uploaded file.
        name:
          type: string
        type:
          type: string
          description: MIME type when known.
    Pagination:
      type: object
      required:
      - total
      - limit
      - offset
      properties:
        total:
          type: integer
          description: Total matching rows.
        limit:
          type: integer
          description: Page size requested.
        offset:
          type: integer
          description: Number of rows skipped.
    StudyExportRequest:
      type: object
      properties:
        kind:
          type: string
          enum:
          - executive_brief
          - full_report
          - raw_data
          default: full_report
        format:
          type: string
          enum:
          - pdf
          - md
          - docx
          - pptx
          - csv
          - xls
          - sav
          default: md
        length:
          type: string
          enum:
          - short
          - standard
          - detailed
          default: standard
        force:
          type: boolean
          default: false
        scheduledRunId:
          type: string
          format: uuid
    StudyAskResultEvent:
      type: object
      required:
      - type
      - outputData
      - outputType
      properties:
        type:
          type: string
          enum:
          - result
        outputData:
          $ref: '#/components/schemas/StudyOutputData'
        outputType:
          type: string
          enum:
          - bar
    StudyCitationSource:
      type: object
      required:
      - id
      - title
      - sourceType
      properties:
        id:
          type: string
        title:
          type: string
        url:
          type: string
          format: uri
        domain:
          type: string
        sourceType:
          type: string
          enum:
          - mind_knowledge
          - web
        similarity:
          type: number
    StudyCreated:
      type: object
      required:
      - id
      - name
      - flowMode
      - createdAt
      - isLinkSharingEnabled
      - publicShareId
      - audiences
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        studyMode:
          type: string
          enum:
          - study
        createdAt:
          type: string
          format: date-time
        isLinkSharingEnabled:
          type: boolean
        publicShareId:
          type:
          - string
          - 'null'
          format: uuid
        audiences:
          type: array
          items:
            $ref: '#/components/schemas/StudyAudience'
    StudyAnswerProvenance:
      type: object
      required:
      - origin
      - sourcePolicy
      - retrievalAttempted
      - retrievalChunksFound
      - retrievalChunksUsed
      - evidenceSourceTypes
      - fallbackStatus
      - unsupported
      - sharedEmbeddingReuse
      - recordedAt
      - verifier
      properties:
        origin:
          type: string
          description: Canonical answer origin. `group_grounding` was renamed to `audience_grounding`; it is still listed so a response recorded before the rename validates.
          enum:
          - cited_sources
          - mind_knowledge
          - mind_personality
          - request_evidence
          - audience_grounding
          - group_grounding
          - unsupported
        originLegacy:
          type: string
          deprecated: true
          description: Pre-rename spelling of `origin`, present only when one exists. Switch to `origin`; this field will be removed.
          enum:
          - group_grounding
        sourcePolicy:
          type: string
          enum:
          - auto
          - knowledge_only
        retrievalAttempted:
          type: boolean
        retrievalChunksFound:
          type: integer
          minimum: 0
        retrievalChunksUsed:
          type: integer
          minimum: 0
        evidenceSourceTypes:
          type: array
          items:
            type: string
        fallbackStatus:
          type: string
          enum:
          - grounded
          - persona_profile
          - uncertainty_required
        unsupported:
          type: boolean
        sharedEmbeddingReuse:
          type: boolean
        recordedAt:
          type: string
          format: date-time
        verifier:
          type: string
          enum:
          - study-answer-provenance-v1
    StudyAskSseEvent:
      oneOf:
      - $ref: '#/components/schemas/StudyAskStartEvent'
      - $ref: '#/components/schemas/StudyAskClassificationEvent'
      - $ref: '#/components/schemas/StudyAskAnswerEvent'
      - $ref: '#/components/schemas/StudyAskAggregatingEvent'
      - $ref: '#/components/schemas/StudyAskResultEvent'
      - $ref: '#/components/schemas/StudyAskDoneEvent'
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: 'Personal API key. Format: `Bearer minds_…_key`. Create one at https://getminds.ai/settings/api-keys.'
