  /api/v1/audiences/{audienceId}/validations/{validationId}:
    get:
      responses:
        '200':
          description: Validation.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '401':
          description: Unauthorized.
        '404':
          description: Audience or validation not found.
      operationId: getAudienceValidation
      summary: Get an Audience validation with scores (experimental)
      description: 'Experimental. Returns stored validation scores. Older results without question ranges derive them once from the original saved answers and store them; saved scores are not changed. How to read the headline: each question''s error (`questions[].metrics.mae_pp`) is the mean over all of its options of |human share − Minds'' share|, in percentage points; `scores.headline.maePp` is the mean of those over the scored questions (a question whose respondent count is not stated counts half, an item split from one printed question counts its share), and the score is `scores.headline.approximation.score` = 100 − `maePp`, clamped to 0 to 100. A score of 88 therefore means the Minds'' shares were 12 points off per option on average, not that 88% of answers matched; questions with many options have smaller per-option gaps. `approximation.range` is its 95% range from a clustered bootstrap (Minds resampled as clusters, survey sampling redrawn from each question''s base), widened by any re-weighting to the Audience''s composition (`band` has the parts; `outerRange` adds population differences that could not be checked). `scores.headline.noiseFloorMaePp` is the error sampling alone would produce with this many Minds and respondents, so no Audience is expected to score above about 100 minus it; each question has its own `noiseFloorMaePp`. Each question lists `options[]` with `human` and `synthetic` shares (and `humanUnadjusted` before re-weighting), so `synthetic − human` gives the direction of every gap. Validation runs ask with no retrieved documents and no live web search: Minds answer from their trained profiles and prompts, not by looking up their knowledge files. `scores.kpis` lists every KPI of the experiments methodology catalog, each with its value, a 95% interval and the number of questions it covers: MAE, RMSE, distribution overlap (%), total variation distance, Jensen-Shannon divergence and distance, ordinal Wasserstein distance, expected set-size error, top-choice agreement, Pearson and Spearman correlation within questions and pooled across options, and the expected Brier and log scores. `distribution_overlap_pct` is 100 times the shared probability mass for single-choice and ordered questions (100 identical, 0 disjoint); invalid answers retain their denominator and multiselect questions are excluded. Its question-weighted macro value reports covered questions and effective `questionWeight`; its 95% interval covers sampling only. Historical overlap values are derived on read from saved per-option shares with a null interval; saved MAE and headline results are unchanged. `scores.validity` counts invalid answers by reason (unknown option, too many selections, an exclusive option combined with others, empty); they stay in the denominator. Each question lists human and synthetic shares per option and its own 95% match-score range, using the same sampling and measured population-shift method as the headline. When a scored question has no stated respondent count (`baseSource: assumed`), its point comparison and existing weight are retained, but its range and noise floor are null. Headline and combined ranges, band bounds and level, and affected KPI intervals are also null when their contributors include such a question. This applies to saved results as well as new scores; a legacy placeholder n is never treated as observed sample size.'
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      parameters:
      - in: path
        name: audienceId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: validationId
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/audiences/{audienceId}/validations/batches/{batchId}/cancel:
    post:
      responses:
        '200':
          description: The batch, stopping or already ended.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '401':
          description: Unauthorized.
        '404':
          description: Audience or batch not found.
        '409':
          description: The surveys are already being asked.
      operationId: cancelAudienceValidationBatch
      summary: Stop a validation before its surveys are asked
      description: 'Stops a batch while `canCancel` is true: it is still queued or its surveys are still being read. Nothing has been asked of the Minds yet, so no synthetic responses have been used. Once the surveys are being asked the answers are already being generated and the batch can no longer be stopped (409). Stopping a batch that already ended returns it unchanged.'
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      parameters:
      - in: path
        name: audienceId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: batchId
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/audiences/{audienceId}/validations/batches/{batchId}:
    get:
      responses:
        '200':
          description: The batch.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '401':
          description: Unauthorized.
        '404':
          description: Audience or batch not found.
      operationId: getAudienceValidationBatch
      summary: Get one validation of an Audience, with its progress and results
      description: '`provenance` records what produced the validation, for explaining and reproducing a result: the build commit, the scoring method, how many questions were judged, kept and left out and why, engine and extraction-contract versions, every validation prompt by content hash with the provider and model it resolved to, the version of the Audience that was asked (ready Minds, grounding snapshot id, hash and revision), what was requested, the limits in force, every chosen study with its relation, fit tier and the questions available and asked, the web search (id, queries, counts), and, once the runs settle, per study the models that answered by stage, token usage, execution, estimation and surface-treatment versions, and answer coverage. `outcome.fitted` is set when the chosen studies were trimmed to the responses left. The batch a `POST /audiences/{audienceId}/validations` returned. `status`: `queued` and `preparing` (the surveys are being read and compared with the Audience), `running` (`progress.questionsAnswered` of `progress.questionsTotal`), then `completed`, `failed` (`failure.code` and `failure.reason`; `NOT_ENOUGH_RESPONSES` means the whole validation did not fit the synthetic responses left, `NOT_ENOUGH_QUESTIONS` that fewer than 8 questions fit this Audience; in both nothing was spent) or `cancelled`. `outcome.questionSelection` says how many questions the chosen studies held (`questionsJudged`), how many the judge ruled a fair target for this Audience (`questionsKept`), how many were actually asked once the studies kept, the wider-population cap, the question budget and the responses left had taken their cut (`questionsAsked`; `questionsKept` minus it is what a budget dropped rather than the judge), and every question left out by the judge with its reason: `not_applicable` (the Audience''s people cannot answer it), `answer_differs` (its published answers are no fair target for this Audience), `asked_in_another_study`, `off_topic` (from a survey of other or broader people and not about what defines this Audience, or fewer than half that survey''s usable questions were) or `no_eligible_minds` (its shares are of people who do something, such as play a sport, and fewer than 10 Minds evidence doing it; with enough, it is asked only of them as its own survey, named `(asked of …)`). `outcome.groundingHoldout` lists questions not asked because they are distributions the Audience was built from. `surveys` are the ones asked, each with `score` and `range` once scored and `people`, how far the Audience could be checked against the survey''s respondents (`same`, `similar`, `unknown` when the survey publishes nothing about them, `related` when it asked a broader audience). `outcome.surveysDiscarded` names every survey that was found for this Audience and then not asked, with the reason: `different_people` (the people it asked tell nothing about these people), `population_mismatch` (its published composition and the Audience do not overlap) `ranked_lower` (it fits, but better-fitting studies filled the validation) or `grounding_source` (it is one of the sources the Audience was built from, by URL, DOI, title or survey identity, so it cannot test it). `notComparable` names the surveys that described different people, with the reason, including the ones discarded before they were read. Each asked survey carries `fieldPeriod`, the source-authored fieldwork or publication period when verified, otherwise null, and `caveats`: what its number does not mean, including shares of organisations rather than people, unverified reporting units (`relation.reportedPer: unknown`), and unverified residence. `relation.reviewStatus: needs_review` marks an unjudged population relation. Organisation-weighted results are evidence about these people but are not a like-for-like target.'
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      parameters:
      - in: path
        name: audienceId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: batchId
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/audiences/{audienceId}/validations/file-check:
    post:
      responses:
        '200':
          description: '`{ status: reading }`, `{ status: done, failure, questionsFound, questionsScored }`, or null.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    nullable: true
                    additionalProperties: true
        '400':
          description: Invalid request.
        '401':
          description: Unauthorized.
        '404':
          description: Audience not found or not editable by the caller.
      operationId: checkAudienceValidationFiles
      summary: Check survey files before validating an Audience against them
      description: Reads the survey files the way a validation reads them, together as one survey, and says whether they hold questions and published results to compare against, before any validation starts. The first call starts the reading and answers `reading`; repeat the same call until `done` (the reading takes seconds for a short file and a few minutes for a long deck). `failure.code` is `SURVEY_RESULTS_NOT_FOUND` for a questionnaire without results, `SURVEY_NOT_FOUND` when no survey questions were found, or `SURVEY_FILES_UNREADABLE`; null when the files can be validated against. A validation started with the same files reuses the reading. `data` is null when files cannot be checked ahead; the validation then reads them itself. Nothing is spent.
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      parameters:
      - in: path
