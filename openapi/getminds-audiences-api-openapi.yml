      - Audiences
      security:
      - ApiKeyAuth: []
    post:
      parameters:
      - name: x-minds-idempotency-key
        in: header
        required: false
        description: Reuse for retries of the same creation. Blank keys and keys longer than 128 characters are ignored.
        schema:
          type: string
          maxLength: 128
      responses:
        '200':
          description: Idempotent replay of the saved Audience.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedAudienceResponse'
        '201':
          description: The newly created saved Audience.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedAudienceResponse'
        '400':
          description: Invalid name or retired request fields.
        '401':
          description: Authentication required.
        '403':
          description: The account cannot create this Audience under its current plan or access permissions.
        '404':
          description: One or more requested Minds are missing or inaccessible.
      operationId: createAudience
      summary: Create an Audience from existing Minds
      description: Creates a private saved Audience by default. An optional per-creation idempotency key replays the same Audience with status 200; a new Audience returns 201.
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  minLength: 1
                  description: Non-blank Audience name; surrounding whitespace is trimmed.
                mindIds:
                  type: array
                  items:
                    type: string
                  default: []
                  description: Accessible existing Mind IDs. Duplicate IDs are deduplicated. Use mindIds, not the retired mindIds field.
                isLinkSharingEnabled:
                  type: boolean
                  default: false
                  description: Enable only after explicit approval to share a public link.
  /api/v1/audiences/library:
    get:
      parameters:
      - in: query
        name: mode
        description: Opt into bounded pages; omitted preserves the legacy projection.
        schema:
          type: string
          enum:
          - summary
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 60
      - in: query
        name: after
        description: Opaque nextCursor from the previous page with the same search and sort.
        schema:
          type: string
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - name
          - createdAt
          - updatedAt
          default: updatedAt
      - in: query
        name: direction
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      - in: query
        name: search
        description: Search all visible records, including unloaded pages.
        schema:
          type: string
          maxLength: 200
      - in: query
        name: ids
        description: Comma-separated UUIDs; at most 100.
        schema:
          type: string
      - in: query
        name: fresh
        required: false
        description: Set to 1 after an access change to bypass the short-lived library cache.
        schema:
          type: string
          enum:
          - '1'
      responses:
        '200':
          description: Summary mode returns data with mindCount and membersLoaded=false, plus pageInfo.nextCursor. Membership arrays are partial.
        '401':
          description: Missing or invalid authentication.
      operationId: listAudienceLibrary
      summary: List the first-party Audience library projection
      description: Returns owned, followed, directly shared, and team-shared Audiences with caller-specific access fields.
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
  /api/v1/audiences/lifecycle/stream:
    get:
      parameters: []
      responses:
        '200':
          description: Server-sent connected, invalidation, and heartbeat events.
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE frames whose invalidation payload includes durable-state domains to re-read.
      operationId: streamAudienceLifecycle
      summary: Stream Audience lifecycle invalidations
      description: User-scoped SSE wakeups for Audience draft, Audience, and Mind revalidation. Events are hints; clients must re-read durable state.
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
  /api/v1/audiences/limits:
    get:
      parameters: []
      responses:
        '200':
          description: Effective Audience creation limits.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
        '401':
          description: Missing or invalid authentication.
      operationId: getAudienceLimits
      summary: Audience creation limits for the authenticated account
      description: 'Return the Audience size ceilings that apply to this account: the per-Audience plan cap (including a configured team override), the absolute system limit, the custom-size maximum, and per-creation-mode ceilings. scope identifies the authenticated user and entitlement team; allowance identifies the plan default, team override or legacy unlimited conversion; checkedAt is the observation time. These are per-Audience sizes, not a total workspace allowance or remaining credits. Match scope to the intended account before attributing these limits to it. Call this before creating an Audience to learn the real limits rather than discovering them from a 403. Mode ceilings come in two kinds and they are not interchangeable: `automaticSizingCeiling` bounds the size the server picks when no memberCount is given, while `explicitCountCeiling` bounds a size you state — only "balanced" enforces one, as 403 MODE_CAP.'
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
  /api/v1/audiences/source-import:
    post:
      parameters: []
      responses:
        '200':
          description: Imported files and optional reviewed grounding snapshot.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
        '400':
          description: Invalid text, grounding, source reference or foreign file.
        '401':
          description: Authentication required.
        '413':
          description: Import is too large.
        '502':
          description: Source storage unavailable; retrying the same import is safe.
      operationId: importAudienceSources
      summary: Import supplied UTF-8 audience research sources
      tags:
      - Audiences
      description: Store up to 20 caller-supplied text, Markdown, CSV or JSON files (5 MB each, 12 MB total) as durable account-owned uploads. Optional groundingJson binds explicit supplied chart percentages to these files and returns a normalized snapshot/checksum for groundingPreview and creation. No research, Minds, or Audience is created. Identical file imports replay the same content-addressed URLs.
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                files:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    required:
                    - name
                    - content
                    properties:
                      name:
                        type: string
                        maxLength: 200
                      content:
                        type: string
                        maxLength: 5242880
                existingFiles:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    required:
                    - name
                    - url
                    properties:
                      name:
                        type: string
                      url:
                        type: string
                groundingJson:
                  type: string
                  maxLength: 2000000
components:
  schemas:
    PlanLimitEnvelope:
      type: object
      required:
      - code
      - limitType
      - currentPlan
      - limit
      properties:
        code:
          type: string
          enum:
          - PLAN_LIMIT
        limitType:
          type: string
          description: Which cap was hit, e.g. `audienceMembers` or `minds` (legacy responses may say `audienceMembers`).
        currentPlan:
          type: string
        limit:
          type: integer
        current:
          type: integer
          description: Consumption against the cap.
        requested:
          type: integer
          description: How many units this request asked for.
        itemsToCreate:
          type: integer
          description: Bulk-create size that pushed the request over the cap.
        periodEnd:
          type: string
          format: date-time
          description: End of the metering window when the cap is periodic.
        context:
          type: string
        reason:
          type: string
        audienceId:
          type: string
          format: uuid
        isTrialing:
          type: boolean
    AudienceDetail:
      type: object
      required:
      - id
      - name
      - mindCount
      - minds
      - createdAt
      - updatedAt
      - isPublic
      - currentMemberRole
      - sources
      - calibration
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        marketplaceSubtitle:
          type:
          - string
          - 'null'
          description: Short subtitle shown in the public marketplace listing.
        marketplaceDescription:
          type:
          - string
          - 'null'
          description: Longer description shown in the public marketplace listing.
        mindCount:
          type: integer
          minimum: 0
        membersLoaded:
          type: boolean
          description: Present in preview mode. False means the member array is incomplete; mindCount remains authoritative.
        minds:
          type: array
          description: Member Minds ordered by name.
          items:
            $ref: '#/components/schemas/AudienceDetailMember'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        isPublic:
          type: boolean
          description: Anyone signed in can open the Audience and its Minds (marketplace listing).
        currentMemberRole:
          type: string
          enum:
          - owner
          - admin
          - member
          - team_member
          - public_viewer
          description: The caller's relationship to this Audience. `public_viewer` also covers read-only access inherited from a containing Study.
        isSharedWithTeam:
          type: boolean
          description: Collaborators only. Every member of the owner's team can open the Audience and read and chat with every Mind in it; no edit rights on the Minds.
        isLinkSharingEnabled:
          type: boolean
          description: Collaborators only. Anyone with the public link can open the Audience.
        publicShareId:
          type:
          - string
          - 'null'
          description: Collaborators only. Token of the public share link, when link sharing has been enabled.
        grounding:
          allOf:
          - $ref: '#/components/schemas/AudienceDetailGrounding'
          description: Stored research grounding. Absent when the Audience was never grounded.
        sources:
          type: array
          description: 'The Audience''s source bundle in creation order: the original brief, later recalibration adjustments, keywords, links and uploaded files. Uploaded-file URLs are signed and are redacted for public and Study-cascade viewers.'
          items:
            $ref: '#/components/schemas/AudienceSourceRecord'
        derivedDistributions:
          type: array
          description: Baseline demographics derived from what the members actually are, for dimensions the research did not cover. Present only when the member count is within the derivation cap and at least one dimension could be derived. Not research evidence and never used for cohort allocation.
          items:
            $ref: '#/components/schemas/GroundingDistribution'
        calibration:
          $ref: '#/components/schemas/AudienceCalibrationState'
    AudienceCalibrationState:
      type: object
      required:
      - active
      - startedAt
      properties:
        active:
          type: boolean
          description: True while a recalibration run is in flight for this Audience.
        startedAt:
          type:
          - string
          - 'null'
          format: date-time
    PlanLimitError:
      type: object
      description: Error body of a plan-limit refusal (HTTP 403).
      properties:
        statusCode:
          type: integer
          enum:
          - 403
        statusMessage:
          type: string
          description: Human-readable message naming the plan and the limit.
        data:
          $ref: '#/components/schemas/PlanLimitEnvelope'
    FormationHypothesis:
      type: object
      description: A proposed split of the Audience into 2 to 15 subgroups.
      required:
      - intent
      - subgroups
      properties:
        intent:
          type: string
          minLength: 1
          description: One line restating the split, e.g. "Audience by gender".
        subgroups:
          type: array
          minItems: 2
          maxItems: 15
          items:
            type: object
            required:
            - id
            - label
            - definition
            properties:
              id:
                type: string
                minLength: 1
                description: Stable lowercase slug, e.g. `female` or `age-25-34`.
              label:
                type: string
                minLength: 1
                description: Short human-facing name.
              definition:
                type: string
                minLength: 1
                description: One-sentence decision rule for membership in this subgroup.
    FormationSummary:
      type: object
      required:
      - id
      - name
      - status
      - source
      - dimensionKey
      - visibility
      - createdAt
      - updatedAt
      - createdByUserId
      - subgroups
      - canMutate
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum:
          - building
          - ready
          - failed
          description: Build state. Subgroup memberships are only populated once `ready`.
        source:
          type: string
          enum:
          - auto
          - manual
        dimensionKey:
          type:
          - string
          - 'null'
          description: Set on auto-seeded Formations (e.g. `age`, `gender`, or `grounding:<axis>` for grounding-derived splits); null for user-created ones.
        visibility:
          type: string
          enum:
          - shared
          - viewer_private
          description: '`shared` Formations are visible to every Audience viewer; `viewer_private` ones only to their creator.'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdByUserId:
          type: string
          format: uuid
        canMutate:
          type: boolean
          description: Whether the caller may recompute or delete this Formation.
        subgroups:
          type: array
          items:
            type: object
            required:
            - id
            - label
            - isAuxiliary
            - position
            - _count
            properties:
              id:
                type: string
                format: uuid
              label:
                type: string
              isAuxiliary:
                type: boolean
                description: True for the catch-all bucket (e.g. Other or Unanswered).
              position:
                type: integer
                minimum: 0
              _count:
                type: object
                required:
                - memberships
                properties:
                  memberships:
                    type: integer
                    minimum: 0
                    description: Number of Minds in this subgroup.
    AudienceMindSummary:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        discipline:
          type:
          - string
          - 'null'
        profileImageUrl:
          type:
          - string
          - 'null'
    AudienceDetailMember:
      type: object
      required:
      - id
      - name
      - discipline
      - profileImageUrl
      - createdAt
      - cohortProfile
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        discipline:
          type:
          - string
          - 'null'
        profileImageUrl:
          type:
          - string
          - 'null'
          format: uri
          description: Absolute avatar URL, or null while the portrait is still being generated.
        createdAt:
          type: string
          format: date-time
        cohortProfile:
          oneOf:
          - $ref: '#/components/schemas/CohortMemberProfile'
          - type: 'null'
          description: The segment of every grounded distribution this member represents. Null for Minds that were never allocated.
    Formation:
      type: object
      description: A persisted segmentation of one Audience into subgroups.
      required:
      - id
      - name
      - status
      - source
      - visibility
      - canMutate
      - createdAt
      - updatedAt
      - createdByUserId
      - subgroups
      - hypothesis
      - progress
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum:
          - building
          - ready
          - failed
        source:
          type: string
          enum:
          - auto
          - manual
        visibility:
          type: string
          enum:
          - shared
          - viewer_private
        canMutate:
          type: boolean
          description: Whether the caller may recompute or delete this Formation.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdByUserId:
          type: string
          format: uuid
        subgroups:
          type: array
          description: Materialised subgroups in display order. Empty until the build is `ready`.
          items:
            $ref: '#/components/schemas/FormationSubgroup'
        hypothesis:
          allOf:
          - $ref: '#/components/schemas/FormationHypothesis'
          description: The stored proposal the Formation was built from. May be an empty object for legacy auto-seeded rows.
        progress:
          oneOf:
          - $ref: '#/components/schemas/FormationBuildProgress'
          - type: 'null'
          description: Live build progress while `building`, the failure reason when `failed`, null once `ready`.
    GroundingHardConstraints:
      type: object
      description: Inclusion rules resolved from the Audience specification. Values outside these bounds are excluded from allocation.
      required:
      - gender
      - age
      - country
      - categoricalMemberships
      properties:
        gender:
          type:
          - string
          - 'null'
          enum:
          - feminine
          - masculine
          - androgynous
        age:
          oneOf:
          - type: object
            required:
            - min
            - max
            properties:
              min:
                type: integer
              max:
                type: integer
          - type: 'null'
        country:
          type:
          - string
          - 'null'
        categoricalMemberships:
          type: array
          items:
            type: object
            required:
            - axisTerms
            - allowedValueTerms
            properties:
              axisTerms:
                type: array
                items:
                  type: string
              allowedValueTerms:
                type: array
                items:
                  type: string
    AudienceFromBriefResult:
      type: object
      required:
      - id
      - name
      - mindCount
      - minds
      - createdAt
      - updatedAt
      - isPublic
      - isSharedWithTeam
      - isLinkSharingEnabled
      - currentMemberRole
      - grounding
      - audienceCreationMode
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        mindCount:
          type: integer
        minds:
          type: array
          items:
            $ref: '#/components/schemas/AudienceMindSummary'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        isPublic:
          type: boolean
        isSharedWithTeam:
          type: boolean
        isLinkSharingEnabled:
          type: boolean
        publicShareId:
          type:
          - string
          - 'null'
        currentMemberRole:
          type: string
          enum:
          - owner
        grounding:
          oneOf:
          - $ref: '#/components/schemas/AudienceGrounding'
          - type: 'null'
        audienceCreationMode:
          type: string
          enum:
          - balanced
          - segment_coverage
          - benchmark_depth
          description: The EFFECTIVE creation mode applied by the server (after the plan gate — may differ from the requested mode on non-Team plans).
        replayed:
          type: boolean
          description: 'Present and true only on an idempotent replay (200): the audience was created by an earlier request with the same idempotency key.'
        datasetSegmentation:
          oneOf:
          - type: object
            properties:
              selectedVariableCount:
                type: integer
              observedProfileCount:
                type: integer
              recommendedMindCount:
                type: integer
              createdMindCount:
                type: integer
          - type: 'null'
        memberTraining:
          oneOf:
          - type: object
            required:
            - enqueued
            - queuedMemberCount
            - pollUrlTemplate
            description: Per-Mind background training enqueued for this creation. Every creation path trains every member; `queuedMemberCount` reports what actually reached the queue, so a value below `mindCount` means some members were not queued and must be retrained. Null on idempotent replays (training bookkeeping is not persisted).
            properties:
              enqueued:
                type: boolean
              queuedMemberCount:
                type: integer
              pollUrlTemplate:
                type:
                - string
                - 'null'
                description: Substitute each member id to poll its training progress, e.g. /api/v1/minds/{mindId}/training.
          - type: 'null'
        cohortAllocation:
          oneOf:
          - type: object
            required:
            - config
            - audit
            properties:
              config:
                type: object
              audit:
                type: object
              profiles:
                type: array
                items:
                  type: object
          - type: 'null'
        cohortAllocationCoverage:
          type: object
          description: Which members the deterministic cohort allocation actually covered. Members flagged as real people are excluded individually (they cannot be given an invented demographic profile); `skipReason` explains a null `cohortAllocation`.
          required:
          - memberCount
          - allocatedMemberCount
          - excludedRealPersonCount
          - skipReason
          properties:
            memberCount:
              type: integer
            allocatedMemberCount:
              type: integer
            excludedRealPersonCount:
              type: integer
            excludedRealPersonNames:
              type: array
              items:
                type: string
            skipReason:
              type:
              - string
              - 'null'
              enum:
              - no_grounded_distributions
              - all_members_flagged_real_person
    FormationSubgroup:
      type: object
      required:
      - id
      - label
      - definition
      - isAuxiliary
      - position
      - memberships
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        definition:
          type:
          - string
          - 'null'
          description: Natural-language membership rule.
        isAuxiliary:
          type: boolean
          description: True for the catch-all bucket (e.g. Other or Unanswered).
        position:
          type: integer
          minimum: 0
        memberships:
          type: array
          description: Minds assigned to this subgroup. A Mind may appear in several subgroups when overlap is allowed.
          items:
            type: object
            required:
            - mindId
            - confidence
            properties:
              mindId:
                type: string
                format: uuid
              confidence:
                type:
                - number
                - 'null'
                minimum: 0
                maximum: 1
    AudienceSourceRecord:
      type: object
      required:
      - id
      - kind
      - text
      - url
      - filename
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - brief
          - adjustment
          - keyword
          - link
          - file
        text:
          type:
          - string
          - 'null'
          description: Brief, adjustment or keyword text. Null for link and file rows.
        url:
          type:
          - string
          - 'null'
          description: Link URL or uploaded-file URL. Null for text rows; redacted for viewers without collaborator access.
        filename:
          type:
          - string
          - 'null'
          description: Original file name for file rows.
        createdAt:
          type: string
          format: date-time
    GroundingSource:
      type: object
      required:
      - url
      - title
      - snippet
      - domain
      - confidence
      properties:
        url:
          type: string
        title:
          type: string
        snippet:
          type: string
        domain:
          type: string
        publishedDate:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        tier:
          type: string
          enum:
          - target
          - broader
          - general
          - global
        isUserProvided:
          type: boolean
    AudienceGrounding:
      type: object
      required:
      - distributions
      - sources
      - summary
      - confidence
      properties:
        distributions:
          type: array
          items:
            $ref: '#/components/schemas/GroundingDistribution'
        reviewDistributions:
          type: array
          description: Complete source-identified distribution universe, including screener-excluded, conditional, and unweighted options that were not allocated.
          items:
            $ref: '#/components/schemas/GroundingDistribution'
        researchStudyAnalysis:
          type:
          - object
          - 'null'
          description: Canonical content-based classification of uploaded research files and their audience, quota, routing, and evidence contracts.
        research:
          type:
          - object
          - 'null'
          description: 'Research coverage and axisReconciliation audit. An unavailable or budget_exceeded axis review is not a successful semantic validation; failureReason explains unusable model output or infrastructure failure. `dimensionCoverage.dimensions` lists the standard dimensions covered for this population — the fixed core pool every audience of people carries (age, gender identity, representation, geography, education, employment status, income, household size) plus any the planner judged relevant — each with a reason and a status: `sourced`, `proxy` (wider area or population), `assumed` (model-proposed shares, never used for sizing) or `missing`.'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/GroundingSource'
        summary:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        suggestedMinAudienceSize:
          type: integer
          minimum: 3
          maximum: 50
        flaggedDistributions:
          type: array
          description: Axes demoted to supplementary context because they measure the Study outcome itself (`audienceContext.reason = study_outcome`). Never used for cohort allocation.
          items:
            type: object
            required:
            - name
            - reason
            properties:
              name:
                type: string
              reason:
                type: string
                enum:
                - study_outcome
              category:
                type: string
                enum:
                - demographic
                - geographic
                - psychographic
                - behavioral
                - firmographic
              tier:
                type: string
                enum:
                - target
                - broader
                - general
                - global
    SavedAudienceResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - id
          - name
          - mindCount
          - mindIds
          - minds
          - isLinkSharingEnabled
          - currentMemberRole
          properties:
            id:
              type: string
            name:
              type: string
            mindCount:
              type: integer
              minimum: 0
            mindIds:
              type: array
              items:
                type: string
            minds:
              type: array
              items:
                type: object
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            isPublic:
              type: boolean
            isSharedWithTeam:
              type: boolean
            isLinkSharingEnabled:
              type: boolean
            publicShareId:
              type:
              - string
              - 'null'
            currentMemberRole:
              type: string
              enum:
              - owner
    GroundingDistribution:
      type: object
      required:
      - name
      - distribution
      properties:
        name:
          type: string
        distribution:
          type: array
          items:
            type: object
            required:
            - label
            - pct
            - sourceIdx
            properties:
              label:
                type: string
              pct:
                type: number
                minimum: 0
                maximum: 100
              sourceIdx:
                type: integer
                minimum: 0
              review:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - included
                    - excluded_by_source
                    - conditional
                    - unweighted
                  evidence:
                    type: string
                    enum:
                    - target
                    - observed
                    - candidate
                  reason:
                    type: string
                  sourceFile:
                    type: string
        tier:
          type: string
          enum:
          - target
          - broader
          - general
          - global
        segmentRelations:
          type: array
          nullable: true
          description: 'Evidence-backed relations from one of this distribution''s segments to segments of another distribution of the same audience. subset: every member in segment is in one of targetSegments. excludes: no member in segment is in any of targetSegments. Enforced by cohort allocation and reported in allocationAudit.segmentRelations.'
          items:
            type: object
            required:
            - type
            - segment
            - targetDistribution
            - targetSegments
            - evidence
            properties:
              type:
                type: string
                enum:
                - subset
                - excludes
              segment:
                type: string
              targetDistribution:
                type: string
              targetSegments:
                type: array
                items:
                  type: string
              evidence:
                type: object
                required:
                - kind
                properties:
                  kind:
                    type: string
                    enum:
                    - source
                    - definitional
                  sourceIdx:
                    type: integer
                    minimum: 0
                  quote:
                    type: string
                  justification:
                    type: string
    AudienceDetailGrounding:
      type: object
      required:
      - snapshotId
      - distributions
      - reviewDistributions
      - sources
      - summary
      - confidence
      - appliedToPersonas
      - createdAt
      properties:
        snapshotId:
          type:
          - string
          - 'null'
          description: Identifier of the grounding snapshot currently applied.
        distributions:
          type: array
          description: Active distributions that drive cohort allocation, bounded to the Audience definition.
          items:
            $ref: '#/components/schemas/GroundingDistribution'
        reviewDistributions:
          type: array
          description: Complete source-identified distribution universe, including options that are not allocated.
          items:
            $ref: '#/components/schemas/GroundingDistribution'
        studyUse:
          type: object
          description: Collaborators only. Disclosed new-research or reconstruction mode, matching the reviewed preview.
        sourceFindings:
          type: array
          items:
            type: object
          description: Collaborators only. Original observed and historical findings retained separately from the active composition.
        researchStudyAnalysis:
          type:
          - object
          - 'null'
          description: Classification of uploaded research files and their audience, quota, routing and evidence contracts.
        sources:
          type: array
          items:
            $ref: '#/components/schemas/GroundingSource'
        summary:
          type:
          - string
          - 'null'
        confidence:
          type: number
          minimum: 0
          maximum: 1
        appliedToPersonas:
          type: boolean
          description: True when deterministic cohort allocation assigned the members to the distributions.
        allocationConfig:
          type:
          - object
          - 'null'
          description: Deterministic cohort allocation controls used for the current member profiles.
        hardConstraints:
          oneOf:
          - $ref: '#/components/schemas/GroundingHardConstraints'
          - type: 'null'
        allocationAudit:
          type:
          - object
          - 'null'
          description: Per-distribution audit of target versus achieved segment counts.
        createdAt:
          type: string
          format: date-time
    CohortMemberProfile:
      type: object
      required:
      - memberIndex
      - assignments
      properties:
        memberIndex:
          type: integer
          minimum: 0
        assignments:
          type: array
          items:
            type: object
            required:
            - distribution
            - segment
            - sourceIdx
            properties:
              distribution:
                type: string
                description: Name of the grounded distribution.
              segment:
                type: string
                description: Label of the assigned segment.
              sourceIdx:
                type: integer
                description: Index into the grounding sources; -1 for assumed or derived segments.
              dimension:
                type: string
                enum:
                - age
                - gender
                - income
                - life_stage
                - representation
                - education
                - employment_status
                - geography
                - none
              canonical:
                type: string
                description: Language-independent segment concept, e.g. `feminine` or an age band such as `65+`.
    FormationBuildProgress:
      type: object
      required:
      - phase
      - done
      - total
      properties:
        phase:
          type: string
          enum:
          - classify
          - reconcile
          - ask
        done:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        failureReason:
          type: string
          description: Present when the build failed.
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: 'Personal API key. Format: `Bearer minds_…_key`. Create one at https://getminds.ai/settings/api-keys.'
