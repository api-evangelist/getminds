        '403':
          description: 'Plan limit reached (`code: PLAN_LIMIT`): a stated count above the per-Audience allowance. A count within the allowance is never refused: above the 20-Mind Balanced ceiling it moves to a deeper creation mode when the plan includes one, and otherwise is built at that ceiling with a note in the allocation warnings.'
        '409':
          description: An idempotency key is already in progress or was reused with a different explicit member count, or the reviewed grounding checksum does not match.
        '422':
          description: 'No personas could be derived from the brief; required composition targets cannot be mapped (`code: AUDIENCE_REQUIREMENTS_UNMAPPED`); or (`code: AUDIENCE_SOURCE_FILE_ACCESS_DENIED` / `AUDIENCE_SOURCE_FILE_UNAVAILABLE`, `files`) a supplied file could not be opened from this account or fetched. Review the input; no Audience was created.'
        '500':
          description: Internal server error.
        '503':
          description: 'A service the build depends on is temporarily unavailable. Retry the same operation with its original idempotency key. Durable builds retain private recovery progress. An unavailable consistency reader is not a 503: members it could not read are written from their facts and read again when their Minds are trained. A draft edit whose reading did not come back within its hold returns `AUDIENCE_EDIT_UNREAD`: nothing changed; send the same edit again.'
      operationId: createAudienceFromBrief
      summary: Create a grounded audience from a brief
      description: Create one Audience from a free-text brief. Attached research files use the same extended screener/questionnaire analysis as the in-app New Audience flow, including Study roles, screening and quota rules, review distributions, and grounding provenance. Public bearer-authenticated V1 requests return `202 Accepted`; poll the returned status URL until the durable processor operation completes.
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
        description: 'Retry-safety key, max 200 chars (also accepted as the `idempotencyKey` body field; the header wins). Creation can exceed typical client timeouts — retrying with the same key within 6 hours returns the audience the original request created (200, `replayed: true`) instead of creating a duplicate.'
      - name: Prefer
        in: header
        required: false
        schema:
          type: string
          enum:
          - respond-async
        description: Return 202 after durable admission and run the complete build on the processor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - text
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 200000
                  description: Free-text brief describing the audience or population to represent.
                name:
                  type: string
                  description: Optional audience name override. When omitted, the server names the audience from the brief or detected personas.
                files:
                  type: array
                  description: Already-uploaded research files analyzed through the same extended Audience study-ingestion path as the in-app New Audience uploader.
                  items:
                    type: object
                    required:
                    - name
                    - url
                    properties:
                      name:
                        type: string
                      url:
                        type: string
                links:
                  type: array
                  description: URLs to scrape for additional context.
                  items:
                    type: string
                keywords:
                  type: array
                  description: Search keywords used as extra context and research seeds.
                  items:
                    type: string
                includeWebSearch:
                  type: boolean
                  default: true
                  description: When false, skips Exa search/extraction completely and grounds only on the supplied brief, files, links, keywords, and structurally parsed respondent data. A study report, questionnaire, screener or respondent dataset still grounds the Audience but is withheld from the members' own knowledge (see `withheldFromMemberKnowledge`), so it is not evidence they can answer from; when nothing survives that filter the Audience is still created from the brief and its charts, and its grounding notes that the members carry no readable evidence.
                isLinkSharingEnabled:
                  type: boolean
                  description: Enable public link sharing for the created audience.
                generateImages:
                  type: boolean
                  default: true
                  description: Generate AI profile images and an audience cover asynchronously for members the approved persona-image catalog could not serve. Catalog portraits are assigned either way — that is asset selection, not generation — so `false` avoids every image-model call for this creation while members still receive real portraits wherever the catalog matches; only unmatched members keep the initials fallback.
                trainMembers:
                  type: boolean
                  default: true
                  deprecated: true
                  description: 'Deprecated; omit it. Every member of every Audience is individually trained in the background, including large reviewed-dataset cohorts (> 40 Minds), through the same per-member pipeline the in-app flow uses, keeping each Mind''s deterministic cohort profile and the request locale. `true` is accepted as a no-op; `false` is rejected with 400 `TRAIN_MEMBERS_OPT_OUT_REMOVED` (it used to create untrained Minds with an empty system prompt that reported ready). Cost and time: each member consumes one Mind training (research, knowledge and prompt generation); a 100-Mind cohort typically finishes over tens of minutes to a few hours, staggered per Audience. The response returns as soon as the Audience exists; poll GET /api/v1/minds/{mindId}/training per member (or the Audience progress endpoint) and wait for every member to report readyToChat before running a Study — Study runs refuse Audiences with untrained members.'
                idempotencyKey:
                  type: string
                  maxLength: 200
                  description: Retry-safety key (same semantics as the `Idempotency-Key` header, which wins when both are sent). Reusing the key within 6 hours replays the audience it created instead of duplicating it.
                async:
                  type: boolean
                  description: Optional async hint for internal cookie-authenticated callers. Public bearer-authenticated V1 requests are always enqueued and return a pollable 202 operation.
                draftPreview:
                  type: boolean
                  description: 'Generate the same durable draft as the webapp: streamed research, distributions, and proposed Minds. Always returns a 202 operation; its completed result contains draft.id and draft.sha256. No Audience or Minds are materialized until acceptance.'
                reviewedDraftId:
                  type: string
                  format: uuid
                  description: Owned draft.id returned by the native draft preview. Pass with reviewedDraftSha256 to rework or accept that roster.
                reviewedDraftSha256:
                  type: string
                  pattern: ^[a-fA-F0-9]{64}$
                  description: Exact draft checksum from the latest review. Stale reviews fail before materialization.
                draftRework:
                  type: string
                  maxLength: 200000
                  description: 'Refinement instruction, with draftPreview:true and the reviewed draft pair. The original brief and earlier revisions remain in context. When the instruction cannot be placed on one of the draft''s charts, the draft is returned unchanged with `clarification`: a question to ask the user before reworking again.'
                groundingPreview:
                  type: boolean
                  default: false
                  description: 'Review the quota axes before any Mind exists. When true the request runs research grounding plus a deterministic allocation preview and returns the reviewed grounding, checksum, effective cohortAllocation audit, flags, and size without creating an Audience or Minds or consuming generation allowance. Fresh public previews always return a durable 202 operation, including when `async` is omitted or false. Saved-snapshot previews may return inline; send `async: true` or `Prefer: respond-async` to queue those too. Poll its status URL for the same preview result. Explicit allocation targets that cannot match the grounded axes are set aside and listed in `cohortAllocation.audit.warnings` (or as a `target_unapplied` notice on the grounding), never refused, just like creation. If research did not finish, the preview says so (`research_unavailable`) and creating from it researches the Audience in the background. Axes that measure the Study outcome itself are demoted to supplementary context and listed in `flaggedDistributions`.'
                reviewedGroundingJson:
                  type: string
                  maxLength: 2000000
                  description: Exact reviewed grounding snapshot returned by a prior preview. Send it unchanged with reviewedGroundingSha256 to re-preview revised exclusions/allocation options against the same evidence, or to create from the latest accepted preview without rerunning grounding research.
                reviewedGroundingSha256:
                  type: string
                  pattern: ^[0-9a-fA-F]{64}$
                  description: SHA-256 returned with reviewedGroundingJson. Both fields are required together; creation fails before materialisation when the checksum does not match.
                excludeDistributions:
                  type: array
                  maxItems: 200
                  items:
                    type: string
                  description: Exact axis names whose composition quotas should be removed. Age remains as one eligibility range without within-range shares; explicit gender membership remains enforced. Include required eligibility axes in cohortAllocation.distributionNames. Original evidence stays in reviewDistributions.
                memberCount:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  description: Exact number of Minds to create. Wins over any count parsed from `text` and over grounding suggestions, while remaining subject to the effective plan and creation-mode caps.
                audienceCreationMode:
                  type: string
                  enum:
                  - balanced
                  - segment_coverage
                  - benchmark_depth
                  deprecated: true
                  description: Deprecated alias for `audienceCreationMode`. If both fields are supplied, their values must match.
                datasetSegmentation:
                  type: object
                  description: 'Reviewed research-variable roles, distributions, privacy-safe pairwise relationships, and deterministic dependencies (recodes and questionnaire routing filters) returned by the segmentation-preview endpoint. Pass `functionalDependencies` and `dependencyDiscovery` through unchanged: the first are hard constraints, so a synthetic respondent never breaks a recode and a filtered question stays unanswered at the source rate; the second reports which discovery bounds applied and is echoed into `cohortAllocation.audit.jointConsistency`. Omitting it does not disable enforcement, but the audit will say the bounds are unknown. Requires Team plus `benchmark_depth`. Structural variables shape a representative cohort; outcomes remain held out and observed joint combinations remain audit evidence rather than respondent-like Minds.'
                cohortAllocation:
                  type: object
                  description: Deterministic allocation controls. Grounded marginals are converted into exact integer quotas server-side; the LLM does not decide proportions. Omit for deterministic defaults.
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    seed:
                      type: string
                      maxLength: 200
                    distributionNames:
                      type: array
                      maxItems: 500
                      items:
                        type: string
                    maxDistributions:
                      type: integer
                      minimum: 1
                      maximum: 500
                      default: 500
                    minSegmentCount:
                      type: integer
                      minimum: 0
                      maximum: 20
                      default: 0
                    targetOverrides:
                      type: array
                      maxItems: 500
                      description: Partial or full target-percentage overrides. Unspecified segments keep their source percentages; the audit preserves sourcePct and normalizedTargetPct separately.
                      items:
                        type: object
                        required:
                        - distribution
                        - segments
                        properties:
                          distribution:
                            type: string
                          segments:
                            type: array
                            items:
                              type: object
                              required:
                              - label
                              - pct
                              properties:
                                label:
                                  type: string
                                pct:
                                  type: number
                                  minimum: 0
                                  maximum: 100
                    jointStrategy:
                      type: string
                      enum:
                      - independent
                      - aligned
                      - observed
                      default: independent
                    includeProfilesInResponse:
                      type: boolean
                      default: false
            examples:
              demographicAudience:
                summary: Create an Audience
                value:
                  text: Berlin Spati customers who buy late-night snacks
                  name: Berlin Spati Customers
                  links:
                  - https://example.com/customer-research
                  keywords:
                  - Berlin convenience store demographics
  /api/v1/audiences/from-brief/jobs/{jobId}:
    get:
      responses:
        '200':
          description: Current operation state and, when terminal, its result or error.
        '401':
          description: Missing or invalid API key.
        '404':
          description: Operation not found or not owned by the caller.
      operationId: getAudienceFromBriefCreationJob
      summary: Get a from-brief Audience preview or creation operation
      description: 'Poll the durable operation returned by an asynchronous from-brief preview or creation request. A running operation reports `progress` (0-100) and its `stage` (`phase`: researching, drafting, building or training, plus the research `step` while researching); research usually takes several minutes. A completed preview returns its reviewed grounding and checksum without creating an Audience or Minds.'
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
  /api/v1/audiences/from-brief/jobs/{jobId}/progress:
    get:
      responses:
        '200':
          description: Creation snapshot and a five-minute read-only stream grant.
        '401':
          description: Unauthorized.
        '404':
          description: Operation not found.
      operationId: getAudienceCreationProgress
      summary: Read Audience creation progress and open a scoped live subscription
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
      - in: query
        name: portraits
        required: false
        schema:
          type: string
          enum:
          - inline
        description: 'inline adds `portraits`: a small data: thumbnail per signed portrait URL, for embedded views whose host blocks image origins.'
  /api/v1/audiences/from-brief/segmentation-preview:
    post:
      responses:
        '200':
          description: Complete variable distribution review.
        '400':
          description: Malformed JSON, invalid preview input, or unsupported, empty, or invalid spreadsheet.
        '401':
          description: Missing or invalid authentication.
        '403':
          description: Pro plan required or upload access denied.
        '413':
          description: JSON request exceeds 256 KiB or dataset exceeds the explicit review limit; no partial preview is returned.
        '422':
          description: 'SPREADSHEET_EVIDENCE_UNRESOLVED or DATASET_INTERPRETATION_UNRESOLVED: respondent structure, column meaning or coding could not be verified. Retry the reading or clarify the source.'
        '500':
          description: Internal server error. All responses are private and non-cacheable.
        '503':
          description: Entitlement lookup temporarily unavailable.
      operationId: previewAudienceDatasetSegmentation
      summary: Preview spreadsheet segmentation distributions
      description: Enterprise review step for grounded audience creation. Classifies respondent-level XLS/XLSX/CSV/SPSS-SAV fields by research role, selects population and segmentation variables while holding outcomes and drivers out, and discovers privacy-safe pairwise relationships. Questionnaire/programming grids are rejected as design evidence instead of being misrepresented as completed respondents. Joint profiles are counted for audit only; rows are never silently sampled. An SPSS .sav is read with its codebook, so value labels, not codes, are reported and declared missing codes count as non-response.
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: object
                  required:
                  - name
                  - url
                  properties:
                    name:
                      type: string
                    url:
                      type: string
                segmentationColumns:
                  type: array
                  items:
                    type: string
                  description: Column keys returned by an earlier preview. Omit to use the default population and segmentation variables; outcomes and other holdout roles remain excluded.
      parameters: []
  /api/v1/audiences:
    get:
      responses:
        '200':
          description: Visible Audiences with member readiness and pagination.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - pagination
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - name
                      - mindCount
                      - minds
                      - currentMemberRole
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        mindCount:
                          type: integer
                          minimum: 0
                        minds:
                          type: array
                          items:
                            type: object
                            properties:
                              readyToChat:
                                type: boolean
                                description: The Mind can answer.
                              trainingStatus:
                                type: string
                                enum:
                                - queued
                                - running
                                - completed
                                - failed
                                description: 'A failed training attempt reports `queued`: it is retried automatically. `failed` is reported only for a Mind without a system prompt.'
                              learningInBackground:
                                type: boolean
                                description: The Mind can answer and is still learning from its sources in the background.
                              fullyTrained:
                                type: boolean
                                description: The Mind can answer and its background knowledge step has settled.
                              beingRepaired:
                                type: boolean
                                description: 'Present and true while the Mind cannot answer yet because its last training attempt failed and it is retrained automatically. It reports `trainingStatus: queued`; a Study runs without it when enough others answer.'
                        readiness:
                          type: object
                          description: 'Member rollup. `isReady` is true when every Mind can chat. `startsNow` is true when a Study started now runs at once: nothing is training, and the Minds still being prepared after a failed training attempt are either few enough to leave out (at least one Mind and at least half of the members still answer) or can no longer be retrained automatically; it runs without `leftOut` of them. `learning` counts ready Minds still learning from their sources in the background, and `fullyTrained` is true once every Mind can chat and none is learning.'
                          properties:
                            total:
                              type: integer
                            ready:
                              type: integer
                            training:
                              type: integer
                            failed:
                              type: integer
                              description: 'Always 0: a member whose last training attempt failed is being prepared again and counts in `training`. Kept for existing clients.'
                            isReady:
                              type: boolean
                            startsNow:
                              type: boolean
                            leftOut:
                              type: integer
                            learning:
                              type: integer
                            fullyTrained:
                              type: boolean
                        currentMemberRole:
                          type: string
                          enum:
                          - owner
                          - admin
                          - member
                          - team_member
                          - public_viewer
                        addOnRequired:
                          type: object
                          description: 'Present only on a paid Marketplace Audience the caller has not subscribed to: asking it or starting a Study with it is refused with 402 `MARKETPLACE_ADDON_REQUIRED` until the add-on is active.'
                          properties:
                            priceLabel:
                              type: string
                              nullable: true
                              description: Monthly add-on price for this caller, e.g. `EUR 49/seat/month`.
                  pagination:
                    type: object
                    required:
                    - total
                    - limit
                    - offset
                    properties:
                      total:
                        type: integer
                        minimum: 0
                      limit:
                        type: integer
                        minimum: 1
                        maximum: 100
                      offset:
                        type: integer
                        minimum: 0
        '400':
          description: Invalid `search`, `limit` or `offset`.
        '401':
          description: Authentication required.
      operationId: listAudiences
      summary: List visible Audiences
      description: Lists owned, public, directly shared, and team-shared Audiences, most recently updated first. `search` (alias `searchQuery`) filters by name within that visibility. Sharing fields are returned only when the caller has collaborator access.
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      parameters:
      - name: search
        in: query
        required: false
        description: Case-insensitive substring match against the Audience name (trimmed, at most 200 characters). `pagination.total` counts the matches.
        schema:
          type: string
          maxLength: 200
      - name: searchQuery
        in: query
        required: false
        description: Alias of `search`, matching the `list_audiences` MCP tool. Sent together with `search`, both must be equal.
        schema:
          type: string
          maxLength: 200
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
    post:
      responses:
        '200':
          description: Idempotent replay of the saved Audience.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedAudienceResponse'
        '201':
          description: The newly created saved Audience.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedAudienceResponse'
        '400':
          description: Invalid name or retired request fields.
        '401':
          description: Authentication required.
        '403':
          description: The account cannot create this Audience under its current plan or access permissions.
        '404':
          description: One or more requested Minds are missing or inaccessible.
      operationId: createAudience
      summary: Create an Audience from existing Minds
      description: Creates a private saved Audience by default. An optional per-creation idempotency key replays the same Audience with status 200; a new Audience returns 201.
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      parameters:
      - name: x-minds-idempotency-key
        in: header
        required: false
        description: Reuse for retries of the same creation. Blank keys and keys longer than 128 characters are ignored.
        schema:
          type: string
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  minLength: 1
                  description: Non-blank Audience name; surrounding whitespace is trimmed.
                mindIds:
                  type: array
                  items:
                    type: string
                  default: []
                  description: Accessible existing Mind IDs. Duplicate IDs are deduplicated. Use mindIds, not the retired mindIds field.
                isLinkSharingEnabled:
                  type: boolean
                  default: false
                  description: Enable only after explicit approval to share a public link.
