openapi: 3.2.0
info:
  title: Minds Public Audiences API
  version: v1
  description: 'OpenAPI 3.1.0 spec for the Minds public API (https://getminds.ai/api/v1 / https://api.getminds.ai/v1). Generate a typed TypeScript client by running an OpenAPI generator (e.g. `openapi-typescript`) against `/_openapi.json`. Auth: send `Authorization: Bearer minds_…_key`; create keys in Settings → API Keys.'
servers:
- url: https://api.getminds.ai
  description: Production (api subdomain)
- url: https://getminds.ai
  description: Production (apex)
security:
- ApiKeyAuth: []
tags:
- name: Audiences
paths:
  /api/v1/audiences/{audienceId}:
    delete:
      parameters:
      - name: audienceId
        in: path
        required: true
        description: Audience ID (UUID).
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: The Audience and its orphan-only member Minds were deleted.
        '401':
          description: Missing or invalid API key (`Unauthorized`).
        '404':
          description: '`Audience not found`: the Audience does not exist or the caller is not its owner.'
      operationId: deleteAudience
      summary: Delete an Audience
      description: Permanently deletes an Audience. Owner only; collaborators and viewers receive 404. The deletion cascades to member Minds that the caller owns and that belong to no other Audience, so those Minds (with their training data and Study links) are removed too. Minds owned by other users, and Minds that are also members of another Audience, are kept. Remove Minds you want to keep with `DELETE /audiences/{audienceId}/members/{mindId}` first, or add them to another Audience.
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
    get:
      parameters:
      - in: query
        name: members
        description: Use preview for bounded display profiles without reviewed-field metadata; omitted preserves the complete legacy detail response.
        schema:
          type: string
          enum:
          - preview
      - name: audienceId
        in: path
        required: true
        description: Audience ID (UUID).
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The Audience detail.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AudienceDetail'
        '400':
          description: '`Audience ID is required` or `Invalid audience ID format` (the path parameter is not a UUID).'
        '401':
          description: Missing or invalid API key (`Unauthorized`).
        '404':
          description: '`Audience not found`: the Audience does not exist or the caller cannot view it.'
      operationId: getAudience
      summary: Get an Audience
      description: 'Returns one Audience with its member Minds (each with its cohort profile), the caller''s role, the stored grounding, the source bundle (brief, adjustments, keywords, links, files), member-derived baseline distributions, and the transient recalibration state. Use it to inspect an Audience before attaching it to a Study, to poll `calibration.active` after `POST /audiences/{audienceId}/recalibrate`, or to watch member `profileImageUrl` values arrive after `regenerate-images`. Formations are not embedded; list them with `GET /audiences/{audienceId}/formations`. Readable by the owner, direct members, members of the owner''s team when the Audience is team-shared, any authenticated caller when the Audience is public, and members of a Study that contains the Audience. Setting `isSharedWithTeam: true` lets every member of the owner''s team open the Audience and read and chat with every Mind in it, even when those Minds are not shared individually; it grants no edit rights on the Minds. Explicit Audience members get the same read access. Only collaborators (owner, direct member, team member) receive the sharing fields `isSharedWithTeam`, `isLinkSharingEnabled` and `publicShareId`; public and Study-cascade viewers get `currentMemberRole: public_viewer`, and uploaded-file URLs in `sources` and `grounding.sources` are redacted for them.'
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
    put:
      parameters:
      - name: audienceId
        in: path
        required: true
        description: Audience ID (UUID).
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The updated Audience.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - id
                    - name
                    - mindCount
                    - minds
                    - createdAt
                    - updatedAt
                    - isPublic
                    - isSharedWithTeam
                    - isLinkSharingEnabled
                    - publicShareId
                    - currentMemberRole
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      mindCount:
                        type: integer
                        minimum: 0
                      minds:
                        type: array
                        items:
                          $ref: '#/components/schemas/AudienceMindSummary'
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                      isPublic:
                        type: boolean
                      isSharedWithTeam:
                        type: boolean
                      isLinkSharingEnabled:
                        type: boolean
                      publicShareId:
                        type:
                        - string
                        - 'null'
                      currentMemberRole:
                        type: string
                        enum:
                        - owner
                        - admin
                        - member
                        - team_member
        '400':
          description: '`name is required` (missing or blank name), `Audience ID is required`, or `Invalid audience ID format`.'
        '401':
          description: Missing or invalid API key (`Unauthorized`).
        '404':
          description: '`Audience not found`: the Audience does not exist or the caller has no edit access (public and Study-link viewers included).'
      operationId: updateAudience
      summary: Update an Audience name and sharing settings
      description: 'Renames an Audience and optionally changes its visibility. `name` is required on every call; `isPublic` and `isSharedWithTeam` are applied only when sent as booleans and left unchanged otherwise. `isLinkSharingEnabled` cannot be changed here (it is echoed in the response). Allowed for collaborators: the owner, direct members, and members of the owner''s team when the Audience is team-shared. Public and Study-link viewers receive 404. Setting `isSharedWithTeam: true` lets every member of the owner''s team open the Audience and read and chat with every Mind in it, even when those Minds are not shared individually; it grants no edit rights on the Minds. Explicit Audience members get the same read access. Setting `isPublic: true` lists the Audience in the marketplace and queues a cover image for it.'
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  minLength: 1
                  description: New Audience name; surrounding whitespace is trimmed. Required even when only sharing flags change.
                isPublic:
                  type: boolean
                  description: List the Audience publicly. Anyone signed in can then open it and its Minds.
                isSharedWithTeam:
                  type: boolean
                  description: Share with every member of the owner's team. Grants read-and-chat access to all member Minds; no edit rights on the Minds.
            examples:
              rename:
                value:
                  name: German SaaS buyers (2026)
              shareWithTeam:
                value:
                  name: German SaaS buyers
                  isSharedWithTeam: true
  /api/v1/audiences/{audienceId}/export-download:
    get:
      parameters:
      - in: path
        name: audienceId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Audience export artifact.
      operationId: downloadAudienceExport
      summary: Download an Audience export
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
  /api/v1/audiences/{audienceId}/export-status:
    get:
      parameters:
      - in: path
        name: audienceId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Audience export status.
      operationId: getAudienceExportStatus
      summary: Get Audience export status
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
  /api/v1/audiences/{audienceId}/export:
    post:
      parameters:
      - in: path
        name: audienceId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Cached artifact or queued export job.
      operationId: exportAudienceBrief
      summary: Export an Audience brief
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
  /api/v1/audiences/{audienceId}/follow:
    delete:
      parameters:
      - name: audienceId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Audience unfollowed.
        '401':
          description: Unauthorized.
      operationId: unfollowAudience
      summary: Unfollow a public Audience
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
    post:
      parameters:
      - name: audienceId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Audience followed.
        '401':
          description: Unauthorized.
        '404':
          description: Public Audience not found.
      operationId: followAudience
      summary: Follow a public Audience
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
  /api/v1/audiences/{audienceId}/formations/{formationId}:
    delete:
      parameters:
      - name: audienceId
        in: path
        required: true
        description: Audience ID (UUID).
        schema:
          type: string
          format: uuid
      - name: formationId
        in: path
        required: true
        description: Formation ID (UUID).
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: The Formation was deleted.
        '400':
          description: '`Audience ID is required`, `Invalid audience ID format`, `Formation ID is required`, or `Invalid formation ID format`.'
        '401':
          description: Missing or invalid API key (`Unauthorized`).
        '404':
          description: '`Formation not found`: the Audience is not viewable, or the Formation does not exist, is already deleted, or is not mutable by the caller.'
      operationId: deleteFormation
      summary: Delete a Formation
      description: Soft-deletes a Formation so it disappears from listings while Study messages that referenced it keep rendering. Collaborators may delete shared Formations and their own private ones; other viewers may delete only Formations they created privately. A Formation the caller cannot mutate yields 404.
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
    get:
      parameters:
      - name: audienceId
        in: path
        required: true
        description: Audience ID (UUID).
        schema:
          type: string
          format: uuid
      - name: formationId
        in: path
        required: true
        description: Formation ID (UUID).
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The Formation detail.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Formation'
        '400':
          description: '`Audience ID is required`, `Invalid audience ID format`, `Formation ID is required`, or `Invalid formation ID format`.'
        '401':
          description: Missing or invalid API key (`Unauthorized`).
        '404':
          description: '`Formation not found`: the Audience is not viewable, or the Formation does not exist, was deleted, or is private to another viewer.'
      operationId: getFormation
      summary: Get a Formation with its subgroups and members
      description: 'Returns one Formation: build status, live build progress, the stored hypothesis, and the real subgroups with their member assignments and confidences. Poll this after `POST /formations`, `POST /formations/preview` acceptance, or `recompute` until `status` is `ready` or `failed`; while `building`, `subgroups` may be empty and `hypothesis.subgroups` describes the proposed buckets. Visible to any Audience viewer for shared Formations and to the creator for private ones.'
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
  /api/v1/audiences/{audienceId}/formations/{formationId}/recompute:
    post:
      parameters:
      - name: audienceId
        in: path
        required: true
        description: Audience ID (UUID).
        schema:
          type: string
          format: uuid
      - name: formationId
        in: path
        required: true
        description: Formation ID (UUID).
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The rebuild was queued.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - id
                    - status
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum:
                        - building
                        - ready
                        - failed
                        description: Usually `building`; already terminal when the build ran inline.
        '400':
          description: '`Audience ID is required`, `Invalid audience ID format`, `Formation ID is required`, or `Invalid formation ID format`.'
        '401':
          description: Missing or invalid API key (`Unauthorized`).
        '404':
          description: '`Formation not found`: the Audience is not viewable, or the Formation does not exist, is deleted, or is not mutable by the caller.'
      operationId: recomputeFormation
      summary: Re-sort the current members into an existing Formation
      description: 'Re-classifies the Audience''s current members against the Formation''s stored hypothesis and swaps the subgroups in place, without a new preview. Use it after members were added or recalibrated, or to recover a Formation stuck in `building` or `failed`. Flips `status` to `building` and returns immediately; poll `GET /audiences/{audienceId}/formations/{formationId}`. Same mutability rules as delete: collaborators for shared Formations, creators for private ones.'
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
  /api/v1/audiences/{audienceId}/formations:
    get:
      parameters:
      - name: audienceId
        in: path
        required: true
        description: Audience ID (UUID).
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Visible Formations.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FormationSummary'
        '400':
          description: '`Audience ID is required` or `Invalid audience ID format`.'
        '401':
          description: Missing or invalid API key (`Unauthorized`).
        '404':
          description: '`Formation not found`: the Audience does not exist or the caller cannot view it (the message deliberately does not reveal which).'
      operationId: listFormations
      summary: List the Formations of an Audience
      description: 'Lists the Formations (persisted segmentations) visible to the caller on an Audience: shared Formations plus the caller''s own private ones, newest first, each with its subgroups and membership counts. Soft-deleted Formations are excluded. Anyone who can view the Audience may call this. Opening the list also seeds the canonical default and grounding-derived Formations for collaborators and re-queues stalled builds, so rows may come back with `status: building`; poll `GET /audiences/{audienceId}/formations/{formationId}` until they are `ready` or `failed`. Only one row per auto dimension is returned (ready preferred over building over failed).'
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
    post:
      parameters:
      - name: audienceId
        in: path
        required: true
        description: Audience ID (UUID).
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The Formation was created and its build queued.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - id
                    - name
                    - status
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      status:
                        type: string
                        enum:
                        - building
                        - ready
                        - failed
        '400':
          description: '`Invalid hypothesis` (needs `intent` and 2 to 15 subgroups with `id`, `label`, `definition`), `Audience has no members to categorize`, `FORMATION_CAP` (more than 1000 members), `Audience ID is required`, or `Invalid audience ID format`.'
        '401':
          description: Missing or invalid API key (`Unauthorized`).
        '404':
          description: '`Formation not found`: the Audience does not exist or the caller cannot view it.'
      operationId: createFormation
      summary: Create a Formation from an accepted hypothesis
      description: 'Creates a Formation from a hypothesis (the subgroup proposal returned by `POST /audiences/{audienceId}/formations/preview`, optionally edited) and starts sorting the Audience''s members into its subgroups. Returns immediately with `status: building`; poll `GET /audiences/{audienceId}/formations/{formationId}` until `ready` or `failed`. When the build runs inline the returned status may already be terminal. Any Audience viewer may create a Formation: collaborators create `shared` Formations, other viewers create ones private to themselves. The Audience must have at least one member and at most 1000.'
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - hypothesis
              properties:
                hypothesis:
                  $ref: '#/components/schemas/FormationHypothesis'
                name:
                  type: string
                  description: Optional display name. Defaults to a compact form of `hypothesis.intent`.
            examples:
              byGender:
                value:
                  name: By gender
                  hypothesis:
                    intent: Audience by gender
                    subgroups:
                    - id: female
                      label: Female
                      definition: Members who identify as women.
                    - id: male
                      label: Male
                      definition: Members who identify as men.
  /api/v1/audiences/{audienceId}/formations/preview:
    post:
      parameters:
      - name: audienceId
        in: path
        required: true
        description: Audience ID (UUID).
        schema:
          type: string
          format: uuid
      - name: Accept
        in: header
        required: false
        description: Include `application/json` to get a single JSON response instead of the NDJSON stream.
        schema:
          type: string
          enum:
          - application/json
          - application/x-ndjson
      responses:
        '200':
          description: The proposed hypothesis, either as one JSON document or as an NDJSON event stream.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    required:
                    - memberCount
                    - softWarn
                    - hardCapExceeded
                    - phase
                    - hypothesis
                    properties:
                      memberCount:
                        type: integer
                        minimum: 0
                      softWarn:
                        type: boolean
                        description: 'True from 50 members: builds take noticeably longer.'
                      hardCapExceeded:
                        type: boolean
                        description: 'True above 1000 members: `POST /formations` will refuse with `FORMATION_CAP`.'
                      phase:
                        type: string
                        enum:
                        - hypothesizing
                      hypothesis:
                        $ref: '#/components/schemas/FormationHypothesis'
            application/x-ndjson:
              schema:
                type: object
                description: One event per line.
                required:
                - type
                properties:
                  type:
                    type: string
                    enum:
                    - meta
                    - status
                    - subgroups
                    - error
                    - done
                  data:
                    description: '`meta`: `{ memberCount, softWarn, hardCapExceeded }`; `status`: `{ phase: "hypothesizing" }`; `subgroups`: a FormationHypothesis. Absent on `error` and `done`.'
                    oneOf:
                    - type: object
                      required:
                      - memberCount
                      - softWarn
                      - hardCapExceeded
                      properties:
                        memberCount:
                          type: integer
                        softWarn:
                          type: boolean
                        hardCapExceeded:
                          type: boolean
                    - type: object
                      required:
                      - phase
                      properties:
                        phase:
                          type: string
                          enum:
                          - hypothesizing
                    - $ref: '#/components/schemas/FormationHypothesis'
                  error:
                    type: string
                    description: Failure message; only on `error` events.
        '400':
          description: '`Audience ID is required` or `Invalid audience ID format`.'
        '401':
          description: Missing or invalid API key (`Unauthorized`).
        '404':
          description: '`Formation not found`: the Audience does not exist or the caller cannot view it.'
        '500':
          description: 'JSON mode only: the model could not propose subgroups (`Failed to propose subgroups` or the underlying error message). In NDJSON mode the same failure arrives as an in-band `error` event with HTTP 200.'
      operationId: previewFormation
      summary: Propose Formation subgroups without creating anything
      description: 'Asks the model to propose a subgroup hypothesis for this Audience from a free-text request (e.g. "split by purchase frequency"). Nothing is persisted; pass the returned hypothesis (edited if you like) to `POST /audiences/{audienceId}/formations` to build it, or re-post with `priorHypothesis` set to the previous proposal to request a rework. Any Audience viewer may call this. Send `Accept: application/json` to receive one JSON document; otherwise the response is a newline-delimited JSON stream (`application/x-ndjson`) of `{ type, data }` events in the order `meta`, `status`, `subgroups`, `done`, with failures reported in-band as `{ type: "error", error }` followed by `done`.'
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                userInput:
                  type: string
                  description: What to split by. Defaults to "Split this audience into meaningful subgroups."
                priorHypothesis:
                  allOf:
                  - $ref: '#/components/schemas/FormationHypothesis'
                  description: The previous proposal when asking for a rework; invalid values are ignored.
            examples:
              first:
                value:
                  userInput: Split by how often they buy online
  /api/v1/audiences/{audienceId}/members:
    post:
      parameters:
      - name: audienceId
        in: path
        required: true
        description: Audience ID (UUID).
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The Minds were added (or were already members).
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - added
                    properties:
                      added:
                        type: integer
                        minimum: 1
                        description: Number of distinct Mind IDs in the request.
        '400':
          description: '`mindId or mindIds is required`, `At least one Mind ID is required` (empty array), a retired field name (rejected with a message naming its replacement), `Audience ID is required`, or `Invalid audience ID format`.'
        '401':
          description: Missing or invalid API key (`Unauthorized`).
        '403':
          description: Adding these Minds would exceed the plan's Audience member cap. `statusMessage` names the plan and the limit; `data` carries the plan-limit envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanLimitError'
        '404':
          description: '`Audience not found` (missing, or the caller is not the owner), or `One or more Minds not found or not accessible` (a Mind is neither owned by the caller nor public). Nothing is added in either case.'
      operationId: addAudienceMembers
      summary: Add Minds to an Audience
      description: Adds one Mind (`mindId`) or several Minds (`mindIds`) to an Audience. Owner only; collaborators and viewers receive 404. Every Mind must be owned by the caller or public, otherwise nothing is added. Minds that are already members are ignored, so the call is idempotent; `added` reports the number of distinct IDs in the request, not the number of new memberships. Newly added Minds are sorted into the Audience's ready Formations in the background, and default Formations are seeded if the Audience had none. Use `mindIds` rather than the retired `mindId`/`mindIds` fields.
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Send either `mindId` or `mindIds`. When both are present `mindId` wins.
              properties:
                mindId:
                  type: string
                  format: uuid
                  description: A single Mind to add.
                mindIds:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: uuid
                  description: Several Minds to add. Duplicate IDs are deduplicated.
            examples:
              single:
                value:
                  mindId: 6f1d2c3a-1111-4222-8333-444455556666
              bulk:
                value:
                  mindIds:
                  - 6f1d2c3a-1111-4222-8333-444455556666
                  - 0a9b8c7d-2222-4333-8444-555566667777
  /api/v1/audiences/{audienceId}/members/{mindId}:
    delete:
      parameters:
      - name: audienceId
        in: path
        required: true
        description: Audience ID (UUID).
        schema:
          type: string
          format: uuid
      - name: mindId
        in: path
        required: true
        description: Mind ID (UUID).
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: The Mind is no longer a member of the Audience.
        '400':
          description: '`Audience ID is required`, `Invalid audience ID format`, `Mind ID is required`, or `Invalid mind ID format`.'
        '401':
          description: Missing or invalid API key (`Unauthorized`).
        '404':
          description: '`Audience not found`: the Audience does not exist or the caller is not its owner.'
      operationId: removeAudienceMember
      summary: Remove a Mind from an Audience
      description: Removes one Mind from an Audience and from every Formation subgroup on that Audience. The Mind itself is not deleted. Owner only; collaborators and viewers receive 404. Removing a Mind that is not a member is a no-op that still returns 204.
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
  /api/v1/audiences/{audienceId}/progress:
    get:
      parameters:
      - name: audienceId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Current member progress snapshot.
        '401':
          description: Unauthorized.
        '404':
          description: Audience not found.
      operationId: getAudienceProgress
      summary: Get the current creation progress for an Audience
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
  /api/v1/audiences/{audienceId}/recalibrate:
    post:
      parameters:
      - name: audienceId
        in: path
        required: true
        description: Audience ID (UUID).
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Grounding and member profiles were updated. Member retraining and new-member training continue in the background.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - grounding
                    - refreshedMembers
                    - evolvedMembers
                    - retrainingMembers
                    - addedMembers
                    properties:
                      grounding:
                        type: object
                        required:
                        - distributions
                        - sources
                        - summary
                        - confidence
                        - appliedToPersonas
                        - allocationConfig
                        - allocationAudit
                        properties:
                          distributions:
                            type: array
                            items:
                              $ref: '#/components/schemas/GroundingDistribution'
                          reviewDistributions:
                            type: array
                            items:
                              $ref: '#/components/schemas/GroundingDistribution'
                          sources:
                            type: array
                            items:
                              $ref: '#/components/schemas/GroundingSource'
                          summary:
                            type:
                            - string
                            - 'null'
                          confidence:
                            type: number
                            minimum: 0
                            maximum: 1
                          suggestedMinAudienceSize:
                            type: integer
                          appliedToPersonas:
                            type: boolean
                          allocationConfig:
                            type:
                            - object
                            - 'null'
                          allocationAudit:
                            type:
                            - object
                            - 'null'
                          hardConstraints:
                            oneOf:
                            - $ref: '#/components/schemas/GroundingHardConstraints'
                            - type: 'null'
                      refreshedMembers:
                        type: integer
                        minimum: 0
                        description: Members rebuilt in place with a new persona and portrait because their new segment contradicted their identity.
                      evolvedMembers:
                        type: integer
                        minimum: 0
                        description: Members that kept name and portrait but received a new role and description (non-visual axis change).
                      retrainingMembers:
                        type: integer
                        minimum: 0
                        description: Rebuilt plus evolved members whose knowledge is being retrained in the background.
                      addedMembers:
                        type: integer
                        minimum: 0
                        description: New members created by an additive instruction; their training is queued.
        '400':
          description: '`Invalid recalibrate payload` (schema violation), `Invalid distributions payload` (selection mode produced no usable distributions), `Audience ID is required`, or `Invalid audience ID format`.'
        '401':
          description: Missing or invalid API key (`Unauthorized`).
        '403':
          description: An additive instruction with an explicit count exceeds the plan's Audience member cap, the Audience is already at the cap, or the plan's overall Mind quota would be exceeded. `data` carries the plan-limit envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanLimitError'
        '404':
          description: '`Audience not found`: the Audience does not exist or the caller is not its owner.'
        '409':
          description: '`A recalibration is already running for this audience. Wait for it to finish and try again.`, or a refusal with `data.code: AUDIENCE_MINDS_SHARED` listing the members that also belong to other Audiences (retry with `allowSharedMinds: true` or remove them first).'
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    enum:
                    - 409
                  statusMessage:
                    type: string
                  data:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                        - AUDIENCE_MINDS_SHARED
                      sharedMinds:
                        type: array
                        items:
                          type: object
                          required:
                          - mindId
                          - mindName
                          - otherAudiences
                          properties:
                            mindId:
                              type: string
                              format: uuid
                            mindName:
                              type: string
                            otherAudiences:
                              type: array
                              items:
                                type: object
                                required:
                                - id
                                - name
                                properties:
                                  id:
                                    type: string
                                    format: uuid
                                  name:
                                    type: string
        '422':
          description: 'Research mode: `Could not find sufficient scientific data to ground this audience. Try a more specific description.` or `The requested distribution could not be added.`; selection mode on an Audience without stored grounding: `This audience has no grounding to recalibrate. Run a research recalibration first.`'
        '500':
          description: The run failed after it started; the calibration marker is cleared so a retry is possible.
      operationId: recalibrateAudience
      summary: Recalibrate an Audience's grounding and members
      description: 'Refreshes the stored grounding of a saved Audience and re-allocates its members to the resulting distributions. Owner only. Two modes: research mode (default) re-runs deep research from the persisted brief, every earlier adjustment and the optional `instruction`, `sources` and `requestedDistribution`, or from `query` as a full override; selection mode (`distributions` present) skips research and only replaces the active distribution set, keeping the stored sources and review universe. In research mode the instruction is classified first: an adjustment ("make men 40%", "now they are all vegan", "only 50 to 60 years old") re-allocates the existing roster and rebuilds or evolves the members whose new segment contradicts who they are, while an additive instruction ("and now add 10 African consumers") keeps the existing members untouched and creates new ones within the plan''s member cap. The request is synchronous for the grounding and the roster change; member retraining continues in the background. Poll `GET /audiences/{audienceId}/progress` for per-member training and `GET /audiences/{audienceId}` for `calibration.active`. Only one recalibration may run per Audience at a time. Because recalibration rewrites the members'' profiles and knowledge globally, it is refused with 409 `AUDIENCE_MINDS_SHARED` when members also belong to other Audiences unless `allowSharedMinds: true` is sent (additive runs are exempt).'
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  maxLength: 4000
                  description: Research mode. Full override of the research query; the persisted brief and adjustments are ignored and nothing is persisted for replay.
                instruction:
                  type: string
                  maxLength: 4000
                  description: Research mode. Adjustment appended to the replayed brief, e.g. "add an income distribution" or "skew younger". Persisted so later recalibrations replay it (additive instructions are stored declaratively).
                requestedDistribution:
                  type: string
                  minLength: 1
                  maxLength: 120
                  description: Research mode. Topic of exactly one distribution to add. Guaranteed to materialise (as an assumed-evidence axis when research finds no data); the existing axes and targets are preserved.
                sources:
                  type:
                  - object
                  - 'null'
                  description: Research mode. Extra user sources, persisted to the Audience's source bundle and cited by the research run. Each list holds at most 20 entries.
                  properties:
                    files:
                      type: array
                      maxItems: 20
                      items:
                        type: object
                        required:
                        - name
                        - url
                        properties:
                          name:
                            type: string
                            maxLength: 300
                          url:
                            type: string
                            maxLength: 2000
                            description: URL of an already uploaded file.
                    links:
                      type: array
                      maxItems: 20
                      items:
                        type: string
                        maxLength: 2000
                    keywords:
                      type: array
                      maxItems: 20
                      items:
                        type: string
                        maxLength: 200
                distributions:
                  type: array
                  description: Selection mode. The complete active distribution set after a select/deselect edit of the saved review universe. Presence of this field (even empty) selects selection mode.
                  items:
                    $ref: '#/components/schemas/GroundingDistribution'
                allowSharedMinds:
                  type: boolean
                  description: Accept that members shared with other Audiences are rewritten there too. Required to proceed when the 409 `AUDIENCE_MINDS_SHARED` refusal was returned.
            examples:
              adjust:
                value:
                  instruction: Make it 60% women and skew younger
              addDistribution:
                value:
                  requestedDistribution: Preferred furniture materials
              grow:
                value:
                  instruction: And now add 10 consumers from Nigeria
              selection:
                value:
                  distributions:
                  - name: Gender
                    distribution:
                    - label: Female
                      pct: 60
                      sourceIdx: 0
                    - label: Male
                      pct: 40
                      sourceIdx: 0
  /api/v1/audiences/{audienceId}/regenerate-images:
    post:
      parameters:
      - name: audienceId
        in: path
        required: true
        description: Audience ID (UUID).
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Summary of what was queued.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - audienceId
                    - totalMembers
                    - candidates
                    - enqueued
                    - skipped
                    - errors
                    - dry
                    - sample
                    properties:
                      audienceId:
                        type: string
                        format: uuid
                      totalMembers:
                        type: integer
                        minimum: 0
                      candidates:
                        type: integer
                        minimum: 0
                        description: Members matching the filter (missing portrait, or all when `force`), after `limit`.
                      enqueued:
                        type: integer
                        minimum: 0
                        description: Jobs actually queued; 0 on a dry run.
                      skipped:
                        type: integer
                        minimum: 0
                        description: Members left alone because they already have a portrait.
                      errors:
                        type: integer
                        minimum: 0
                        description: Members whose job could not be queued.
                      dry:
                        type: boolean
                      sample:
                        type: array
                        maxItems: 10
                        description: The first up to 10 queued (or, on a dry run, candidate) Minds.
                        items:
                          type: object
                          required:
                          - id
                          - name
                          properties:
                            id:
                              type: string
                              format: uuid
                            name:
                              type: string
        '400':
          description: '`Audience ID is required` or `Invalid audience ID format`.'
        '401':
          description: Missing or invalid API key (`Unauthorized`).
        '404':
          description: '`Audience not found`: the Audience does not exist or the caller is not its owner.'
      operationId: regenerateAudienceImages
      summary: Queue profile-image generation for the Minds in an Audience
      description: 'Bulk-enqueues portrait generation for the member Minds of an Audience. Owner only. By default only members without a `profileImageUrl` are queued; `force: true` clears and regenerates existing portraits too. Fire-and-forget: the response returns as soon as the jobs are queued, and images arrive asynchronously; poll `GET /audiences/{audienceId}` (member `profileImageUrl`) or `GET /minds/{mindId}`. Use `dry: true` to see what would be queued without queuing anything.'
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  default: false
                  description: Regenerate even for Minds that already have a portrait (their current URL is cleared first).
                limit:
                  type: integer
                  minimum: 1
                  description: Cap the number of Minds queued in this call (oldest members first). No cap by default.
                dry:
                  type: boolean
                  default: false
                  description: Report the candidates without enqueueing.
            examples:
              missingOnly:
                value: {}
              forceFirstTen:
                value:
                  force: true
                  limit: 10
