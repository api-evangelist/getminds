                  data:
                    type: object
        '401':
          description: Missing, invalid, or blocked authentication.
        '503':
          description: Entitlement lookup unavailable. No allowance is returned.
      operationId: getAudienceLimits
      summary: Audience creation limits for the authenticated account
      description: 'Return the Audience size ceilings that apply to this account: the per-Audience plan cap (including a configured team override), the absolute system limit, the custom-size maximum, and per-creation-mode ceilings. scope identifies the authenticated user and entitlement team; allowance identifies the plan default, team override or legacy unlimited conversion; checkedAt is the observation time. These are per-Audience sizes, not a total workspace allowance or remaining credits: the synthetic responses left this month and the included validations left are returned as `responses` and `included` by `GET /audiences/{audienceId}/validations` (and `POST` on the same path). Match scope to the intended account before attributing these limits to it. Call this before creating an Audience to learn the real limits rather than discovering them from a 403. Mode ceilings come in two kinds and they are not interchangeable: `automaticSizingCeiling` bounds the size the server picks when no memberCount is given, while `explicitCountCeiling` bounds a size you state — only "balanced" has one: a stated size above it moves to a deeper mode the plan includes, or is built at the ceiling with a note; it is never refused.'
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      parameters: []
