        '401':
          description: Unauthorized.
        '404':
          description: Audience not found or not editable by the caller.
      operationId: listAudienceValidations
      summary: List an Audience's survey validations
      description: 'Everything this Audience has been checked against. `batches` lists each validation request, newest first, with its status, progress while it runs, its scored surveys (`score` = 100 − the mean absolute error in percentage points, averaged over every option of every question, with a 95% `range`; 88 means the Minds'' shares were 12 points off per option on average, not that 88% of answers matched; and `people`: how far the Audience''s composition could be checked against the survey''s respondents) and the combined result across its surveys. `overall` is how close the Audience is to real surveys across all of them: each survey counts once, by its latest scored check, weighted by questions scored. `combined` and `overall` carry `basis`: `kind: audience` when the score rests on surveys of the Audience''s own people, or `kind: wider_population` with `confidence: lower` when no check held enough of them and the score is a comparison with the wider population they belong to (`comparedWith` names who those surveys asked; `audienceQuestions` 0 means no survey of these people was found). The two are never mixed: while any check of the Audience''s own people exists, `overall` rests on those checks alone. `included` is the plan''s validations that cost no responses this month (`plan` identifies the tier; `perMonth` −1 = unlimited, 0 = none included; further validations are billed in responses). `responses` is the synthetic responses the caller has left this month, which validations beyond the included ones are billed from like any Study (`remaining` −1 = unlimited; null when the plan could not be read). `minds` is how many of the Audience''s Minds can answer now (`ready`) and the `minimum` a validation needs (10); below it a validation is refused with `AUDIENCE_TOO_SMALL`. `minds.ready` ≥ `minds.minimum` is when a validation can start; a score of the finished Audience waits for `readiness.fullyTrained` and for `research.phase` to leave `researching` on `GET /audiences/{audienceId}/progress`, which is what automatic validation waits for (it then starts within about 15 minutes). This and the start response are the API''s reads of the synthetic-response balance (`responses`); a validation beyond the included ones costs one response per ready Mind per question asked. Each survey of a batch carries `relation`: who it asked relative to the people who define the Audience (`same`, `part`, `neighbouring`, or `wider` for the broad population they belong to), and surveys are listed in that order. It also carries `fieldPeriod`, when the survey was in the field as its source states it, or null where the source states no date. `outcome.search` on an automatic validation says how many sources the web search read, how many surveys it found, and what each source came to. `data` lists the individual validations without per-question detail, and `summary.verdict` is the latest settled one: `validated`, `approximate`, `not_comparable`, or `not_validated`. `identity` on batches and `overallIdentity` report whether survey identity was verified. With `needs_review`, individual results remain visible, combined/overall scores and distinct-survey counts are null, and `reason` identifies the unresolved reading. Reading never starts or scores anything. Surveys tested on a subset carry `respondentScope`: population, selected and total Audience members, confirmed/supported matches, unknowns and excluded members. Their match percentages describe only that subset; they contribute to `combined` or `overall` only on a `subgroups` basis (too few questions were put to the whole Audience, so surveys of parts of it, each answered only by the matching Minds, carry the score), and each survey''s `inCombined` says whether the combined score rests on it.'
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      parameters:
      - in: path
        name: audienceId
        required: true
        schema:
          type: string
          format: uuid
    post:
      responses:
        '202':
          description: Validation accepted and queued. `data` is the batch; `included` is what the plan includes and whether this run is one of them; `responses` is the synthetic responses left this month (`remaining` −1 = unlimited).
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    additionalProperties: true
                  included:
                    type: object
                    additionalProperties: true
                  responses:
                    type: object
                    nullable: true
                    description: 'Synthetic responses left this month for the caller: `remaining`, `perMonth` (both −1 = unlimited) and `renewsAt`. Null when the plan could not be read.'
                    properties:
                      remaining:
                        type: integer
                      perMonth:
                        type: integer
                      renewsAt:
                        type: string
                        format: date-time
        '400':
          description: Invalid request, unknown benchmarkId, or an unreadable dataset.
        '401':
          description: Unauthorized.
        '403':
          description: 'No included validation is left and the synthetic responses left cannot pay for the smallest run (8 questions for every ready Mind): the standard plan-limit error, before anything is queued; or a respondent dataset on a plan other than Pro (`ENTERPRISE_DATASET_SEGMENTATION_REQUIRED`); or the Audience exceeds the plan size limit (`limitType: audienceMembers`). Nothing is queued or spent.'
        '404':
          description: Audience not found or not editable by the caller.
        '409':
          description: The request key was already used for a different Audience.
        '413':
          description: Dataset exceeds the review limit.
        '422':
          description: '`AUDIENCE_TOO_SMALL`: the Audience has fewer ready Minds than a validation needs (`data.minds`, `data.minimum`). `SPREADSHEET_EVIDENCE_UNRESOLVED`: a spreadsheet role could not be verified; retry the reading or review the table structure. Nothing is queued or spent.'
        '503':
          description: The subscription could not be verified; retry.
      operationId: createAudienceValidation
      summary: Validate an Audience against real surveys
      description: 'Checks the Audience against a real survey (the benchmark) and returns at once: the work runs in the background and the response is the validation batch to poll. Give the survey in one of these ways: a listed survey (`benchmarkId`: `study:`, a public survey the evidence pool holds, `discovered:` found by a web search, or `saved:`, a survey you supplied in an earlier validation; `GET /audiences/validation-benchmarks?audienceId=` ranks them), one or more listed surveys (`benchmarkIds`, 1 to 5: asked together in one run, with results per survey), a respondent-level dataset (`dataset`: a spreadsheet already attached to the Audience via `sourceId`, or any uploaded XLS/XLSX/CSV/SPSS-SAV `file`; Pro plan), survey files (`files`: questionnaire and results in PDF, XLS/XLSX/CSV/SPSS-SAV, DOC/DOCX, TXT, PowerPoint or ZIP; questions and response formats are read as custom Study mode reads an uploaded questionnaire, and published shares are kept only when a verbatim passage of the files, or a chart read from a PDF page layout or native PowerPoint chart, supports each one; a single respondent-level spreadsheet is treated as a `dataset`), or aggregated results you supply (`benchmark`). Listed surveys may be combined with `files`, which count as one additional survey toward the limit of five. To review public surveys before starting, search and list the benchmarks first, then send the selected `benchmarkIds`; no further surveys are discovered or substituted. Plans include validations that cost no synthetic responses, set per plan in billing: by default five runs per seat each billing month on Pro (pooled across the team), two on Starter, none on Free, and a contract number on Enterprise; earlier subscriptions keep the number their price was sold with. One run is one request, whether it asks one study or five, and a run that ends without a score or any included answers spent gives its slot back (`included` reports `plan`, `perMonth` −1 for unlimited, `used`, `remaining`, `renewsAt`, and `thisRun`). Scoring an existing run never takes an included validation and costs nothing. When no included validation is left a validation still starts and is billed like any Study, one synthetic response per ready Mind per question asked (50 ready Minds × 29 questions = 1,450 responses; a survey asked only of a matching part of the Audience counts only those Minds), checked for the whole validation before anything is asked and reported as `outcome.responsesNeeded` on the batch; `responses` (`remaining`, `perMonth`, both −1 when unlimited, and `renewsAt`) shows what is left, here and on `GET /audiences/{audienceId}/validations`, the only API reads of the synthetic-response balance: studies chosen for you are fitted to the responses left, best fit first (`outcome.fitted`); when the responses left cannot pay for 8 questions for every ready Mind the request is refused with the standard responses plan-limit error before anything is read or queued, and a batch that runs short later ends `failed` with `NOT_ENOUGH_RESPONSES` with nothing spent. Studies chosen for you are checked question by question before anything is asked: a question is left out when the Audience''s people cannot answer it, when its published answers are no fair target for this Audience (who answered differs in a way that changes the answer; a question published by age or region is narrowed to the Audience''s own mix first), or when a better-fitting study asks it already (`outcome.questionSelection`, every question left out with its reason). A validation needs at least 8 such questions after every step; below that it ends `failed` with `NOT_ENOUGH_QUESTIONS` and nothing is spent (surveys you upload are asked as given). When to validate: a request is accepted as soon as at least 10 of the Audience''s Minds can answer (`minds.ready` ≥ `minds.minimum` on `GET /audiences/{audienceId}/validations`); the Minds that are ready answer.'
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      parameters:
      - in: path
        name: audienceId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                benchmarkId:
                  type: string
                  description: A survey id from GET /audiences/validation-benchmarks.
                benchmarkIds:
                  type: array
                  minItems: 1
                  maxItems: 5
                  uniqueItems: true
                  items:
                    type: string
                  description: Validate against exactly these reviewed surveys. May be combined with files; uploaded files count as one additional survey toward the limit of five. The selected surveys are asked together in one run. No additional surveys are discovered or substituted.
                findSurveys:
                  type: boolean
                  description: 'Let the best-fitting surveys be chosen instead of naming one. `true` searches for published surveys whose respondents are the people who define this Audience (a web search from the last day is reused), then of a neighbouring audience, then of the wider population they belong to, keeps only the questions whose published answers fit this Audience (`outcome.questionSelection`), and asks up to 60 of them in that order from as many studies as hold them (at most twelve, reading up to twice as many ranked studies so a study emptied by that check is replaced by the next-best one): every study keeps a share and the best-fitting are filled first (`outcome.questionsCapped`), after any `files` you upload; the modules of one study count as one survey, each survey carries `relation`, and `outcome.search` lists every source read with what it came to; `false` with `files` validates against your files only. Cannot be combined with the other ways of giving a survey. `outcome.phase` on the batch says whether it is `reading` your files or `finding` surveys.'
                population:
                  type: string
                  description: Which population the uploaded files report to validate against, as they name it ("Detroit"). Defaults to the one with the most questions (usually the whole sample); `fileExtraction.populations` lists the others.
                files:
                  type: array
                  maxItems: 20
                  description: Survey files uploaded with the request (workspace upload or public URLs). `fileExtraction` in the response lists the questions found, the ones scored, and why others were left out.
                  items:
                    type: object
                    required:
                    - name
                    - url
                    properties:
                      name:
                        type: string
                      url:
                        type: string
                dataset:
                  type: object
                  description: Respondent-level survey data. Pass `sourceId` (a spreadsheet source of this Audience) or `file`. Coded headers such as "Q5" need respondent-visible wording in `questionText` (keyed by the variable key returned in `datasetExclusions`). Columns that describe who answered (screener and population variables) become the population composition and are scored only when `variables` names them.
                  properties:
                    sourceId:
                      type: string
                      format: uuid
                    file:
                      type: object
                      required:
                      - name
                      - url
                      properties:
                        name:
                          type: string
                        url:
                          type: string
                    name:
                      type: string
                      description: Display name for the benchmark.
                    population:
                      type: string
                      maxLength: 2000
                      description: Who was surveyed, as respondents would recognise it ("Owners of small businesses in Germany"). Each Mind is checked against it before answering. Defaults to the respondent count and the composition of the columns that describe who answered.
                    questionText:
                      type: object
                      additionalProperties:
                        type: string
                    variables:
                      type: array
                      items:
                        type: string
                      description: Only replay these variables (population variables included when named).
                benchmark:
                  type: object
                  additionalProperties: false
                  required:
                  - name
                  - population
                  - questions
                  description: 'Your own survey results, as aggregated shares. Every object is closed: an unknown field is an error. Shares are fractions from 0 to 1. Option labels must match exactly between `response` and `targets`.'
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 300
                    source:
                      type: object
                      additionalProperties: false
                      description: 'Defaults to `{ kind: "uploaded" }`: your own survey, private to you.'
                      properties:
                        kind:
                          type: string
                          enum:
                          - uploaded
                          - public
                          default: uploaded
                        publisher:
                          type: string
                          maxLength: 300
                        url:
                          type: string
                          format: uri
                        licence:
                          type: string
                          maxLength: 500
                        fieldPeriod:
                          type: string
                          maxLength: 1000
                          description: When the survey was in the field, as the source states it.
                        fieldPeriodKind:
                          type: string
                          enum:
                          - fieldwork
                          - publication
                        notes:
                          type: array
                          maxItems: 20
                          items:
                            type: string
                            maxLength: 500
                          description: How the results were derived (weighting, exclusions); shown with the result.
                    population:
                      type: object
                      additionalProperties: false
                      required:
                      - description
                      properties:
                        description:
                          type: string
                          minLength: 1
                          maxLength: 2000
                          description: Who was surveyed, as respondents would recognise it. It is compared with the Audience before anything is asked; a survey of different people is reported under `notComparable`.
                        sampleSize:
                          type:
                          - integer
                          - 'null'
                          minimum: 1
                          default: null
                          description: Respondents in the whole survey. When null, every question needs its own `n`.
                        composition:
                          type: array
                          maxItems: 30
                          default: []
                          description: Who answered, by attribute. Used to check the Audience against the survey and to re-weight `bySegment` targets to the Audience's own mix.
                          items:
                            type: object
                            additionalProperties: false
                            required:
                            - name
                            - segments
                            properties:
                              name:
                                type: string
                                minLength: 1
                                maxLength: 500
                                description: Your name for the attribute ("Age audience"); `bySegment.composition` refers to it.
                              dimension:
                                type: string
                                enum:
                                - age
                                - gender_identity
                                - income
                                - household_income
                                - education
                                - employment_status
                                - occupation
                                - industry
                                - marital_status
                                - household_size
                                - life_stage
                                - representation
                                - nationality
                                - geography
                                - source_sex
                                description: 'Optional: the standard attribute this is, so it can be matched with the Audience''s. Only these values; omit it for anything else (the composition is then kept by its name only). Case, spaces and hyphens are ignored, and older names are read as their standard one: `gender` as `gender_identity`, `sex` as `source_sex` (a survey that recorded sex rather than asking gender identity), `ethnicity` as `representation`, `employment` as `employment_status`.'
                              segments:
                                type: array
                                minItems: 1
                                maxItems: 100
                                items:
                                  type: object
                                  additionalProperties: false
                                  required:
                                  - label
                                  - share
                                  properties:
                                    label:
                                      type: string
                                      minLength: 1
                                      maxLength: 500
                                    share:
                                      type: number
                                      minimum: 0
                                      maximum: 1
                    questions:
                      type: array
                      minItems: 1
                      maxItems: 200
                      description: At most 60 are asked. Each question needs at least two answer options; open-ended (`qualitative`) questions cannot be scored and are rejected.
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - id
                        - text
                        - response
                        - targets
                        properties:
                          id:
                            type: string
                            minLength: 1
                            maxLength: 80
                            description: Unique within the benchmark.
                          text:
                            type: string
                            minLength: 1
                            maxLength: 2000
                            description: The question exactly as respondents saw it; the Minds are asked this wording.
                          module:
                            type: string
                            maxLength: 200
                          response:
                            type: object
                            additionalProperties: false
                            required:
                            - type
                            description: The answer format, an object (not a string). `categorical` (single choice), `multiselect` and `ranking` list `categoricalOptions` (2 to 100 distinct labels); `scale` lists `scalePoints` (every point with its label and numeric value; `scaleRange` [min, max] optional). Minds see the options in the order given. `ranking` is scored on first places, so its targets are first-place shares.
                            properties:
                              type:
                                type: string
                                enum:
                                - categorical
                                - multiselect
                                - ranking
                                - scale
                              categoricalOptions:
                                type: array
                                minItems: 2
                                maxItems: 100
                                items:
                                  type: string
                              scalePoints:
                                type: array
                                minItems: 2
                                maxItems: 100
                                items:
                                  type: object
                                  additionalProperties: false
                                  required:
                                  - label
                                  - value
                                  properties:
                                    label:
                                      type: string
                                    value:
                                      type: number
                              scaleRange:
                                type: array
                                minItems: 2
                                maxItems: 2
                                items:
                                  type: number
                                description: '[minimum, maximum]; every scale point value must lie within it.'
                              maxSelections:
                                type: integer
                                minimum: 1
                                maximum: 100
                                description: '`multiselect` only.'
                          ordinal:
                            type: boolean
                            description: 'The options are ordered (a frequency or agreement scale written as categories); adds the ordinal Wasserstein distance. List `categoricalOptions` in scale order (lowest to highest or the reverse), never by popularity: the distance is computed in the order given, and the order is not checked. `scale` questions are always ordinal and ordered by point value.'
                          exclusiveOptions:
                            type: array
                            maxItems: 20
                            items:
                              type: string
                            description: '`multiselect` options that must be chosen alone ("None of these"); an answer combining one with others counts as invalid.'
                          targets:
                            type: array
                            minItems: 2
                            description: 'The human result: one entry per offered option, each exactly once (scale points by their `label`); a missing option is an error, not zero. Single-choice and scale shares sum to 1 (±0.02 for rounding); `multiselect` shares are each option''s selection rate.'
                            items:
                              type: object
                              additionalProperties: false
                              required:
                              - option
                              - share
                              properties:
                                option:
                                  type: string
                                share:
                                  type: number
                                  minimum: 0
                                  maximum: 1
                          n:
                            type: integer
                            minimum: 1
                            description: Respondents who answered this question. Required when `population.sampleSize` is null.
                          bySegment:
                            type: array
                            maxItems: 10
                            description: Results by population segment, to re-weight the targets to the Audience's own mix.
                            items:
                              type: object
                              additionalProperties: false
                              required:
                              - composition
                              - segments
                              properties:
                                composition:
                                  type: string
                                  description: The `name` of a `population.composition` entry.
                                segments:
                                  type: array
                                  minItems: 2
                                  maxItems: 100
                                  items:
                                    type: object
                                    additionalProperties: false
                                    required:
                                    - label
                                    - targets
                                    properties:
                                      label:
                                        type: string
                                      targets:
                                        type: array
                                        items:
                                          type: object
                                          additionalProperties: false
                                          required:
                                          - option
                                          - share
                                          properties:
                                            option:
                                              type: string
                                            share:
                                              type: number
                                              minimum: 0
                                              maximum: 1
                                      n:
                                        type: integer
                                        minimum: 1
                  example:
                    name: UK grocery shoppers 2026
                    source:
                      kind: uploaded
                      publisher: Example Research
                      fieldPeriod: March 2026
                      fieldPeriodKind: fieldwork
                    population:
