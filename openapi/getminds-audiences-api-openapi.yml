      operationId: listValidationBenchmarks
      summary: Find surveys to validate an Audience against (experimental)
      description: 'Experimental. Without `audienceId`: every public survey the evidence pool holds whole (published statistics tables, surveys computed from published microdata, any imported survey), as `kind: public` with a `study:` id. With `audienceId`: the candidates for that Audience, best first. A candidate’s `population.sampleSize` is `null` when the source gives no survey-wide respondent count; question bases are retained independently. Each candidate carries `comparability.populationMatch`: how far the Audience is from the surveyed population (0–100 per variable and overall, weighted by how much each variable moves the survey''s answers; `afterReweightingScore` once answers are narrowed to the Audience''s mix where the survey reports by that variable; `checkedShare`, the part of that answer-relevant variation the check could cover). Respondent datasets attached to the Audience come first (`kind: audience_dataset`, use its `id` as `dataset.sourceId`). Surveys you supplied in earlier validations (uploaded files, datasets or your own shares) come back as `kind: saved`, visible only to you. Published surveys (`kind: public`, with `sourceUrl`), whether the evidence pool holds them whole (`study:` ids) or a web search read them (`discovered:` ids; use the `id` as `benchmarkId`; ids handed out earlier, such as a survey''s bare id, still resolve) follow, ranked by how well the survey population matches the Audience (`direct`, then `proxy`, `not_comparable` last) and then by topic similarity to the Audience''s name and brief. Within a tier, surveys whose geography could be checked come first. `summary.recommended` is the first own dataset or the first fitting survey with checked geography; `summary.state` is `available`, `unverified_only` (surveys fit but none could be placed geographically: the Minds carry no place and the brief names none, so the caller chooses) or `no_comparable_survey`; a survey of a different population is never recommended. A survey is offered as a fit only once a model has compared who it asked with the Audience; until then it is `not_comparable` with that reason. A survey whose questions clearly do not bear on what the Audience is about is `not_comparable` too, unless it asked exactly the Audience''s people (`same`), whose answers are evidence whatever they were asked. The web search (`POST /audiences/validation-benchmarks/search`) makes that comparison for every survey on offer, so fitting candidates appear while it runs. A survey is offered only when a validation could score it for this Audience, by the same gate the validation applies before it asks: at least 10 Minds answer it and it publishes answers to at least one question. Short surveys pool: a validation needs 8 questions in all, not per survey. A survey of part of the Audience (`relation.kind: part`) is asked only of the Minds whose profile shows they belong to the people it asked: it carries `respondents` once the search has read them (`selected` of `audienceMembers` Minds, and `caveats`, survey criteria the Minds do not state, which are not checked), and until then, or when fewer than 10 fit, it is `not_comparable` with that reason. Every candidate carries `scoring`: `scorable`, `eligibleMinds` (null while unread), `audienceMinds`, `scorableQuestions` and `expectedEvidence` (eligible Minds × scorable questions × how much a question of that relation counts). Offered surveys are ranked with evidence about the Audience''s own people (`same`, `part`) first, then by `expectedEvidence`, then by the keys above. `summary.search` is the Audience''s latest web search (`POST /audiences/validation-benchmarks/search`), so a caller can poll it and read verified candidates while the search runs.'
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      parameters:
      - in: query
        name: audienceId
        required: false
        schema:
          type: string
          format: uuid
      - in: query
        name: searchOnly
        required: false
        schema:
          type: boolean
        description: Requires audienceId. Read only summary.search without loading members or ranking candidates; data is empty. Omit this parameter to receive verified candidates progressively while discovery runs.
  /api/v1/audiences/validation-benchmarks/search:
    post:
      responses:
        '202':
          description: Search queued or reused.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '401':
          description: Unauthorized.
        '403':
          description: 'No included validation is left and the synthetic responses left cannot pay for the smallest run: the standard plan-limit error.'
        '404':
          description: Audience not found or not editable by the caller.
      operationId: searchValidationBenchmarks
      summary: Search the web for surveys to validate an Audience against (experimental)
      description: 'Experimental. Needs an included validation left this month, or synthetic responses for the smallest validation run (8 questions for every ready Mind). Starts a background search for published survey results that match the Audience: queries are planned from its name, brief and member composition, the web and the public source bank are searched, and each source is read once. A source becomes a benchmark only when every kept share is backed by a verbatim passage of the source, the question wording appears in it, single-choice shares add up, and a base is stated. Results are cached per source text and shared with later searches from any Audience. Returns 202 with the search; poll `GET /audiences/validation-benchmarks?audienceId=` (its `summary.search`) and the found surveys appear as `kind: public` candidates with `discovered:` ids. The search also judges, for every survey on offer, who it asked and whether its questions bear on the Audience. A search already running, or completed within the last day with every offered survey judged, is returned instead of starting another unless `force` is true.'
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - audienceId
              properties:
                audienceId:
                  type: string
                  format: uuid
                force:
                  type: boolean
      parameters: []
components:
  schemas:
    FormationHypothesis:
      type: object
      description: A proposed split of the Audience into 2 to 15 subgroups.
      required:
      - intent
      - subgroups
      properties:
        intent:
          type: string
          minLength: 1
          description: One line restating the split, e.g. "Audience by gender".
        subgroups:
          type: array
          minItems: 2
          maxItems: 15
          items:
            type: object
            required:
            - id
            - label
            - definition
            properties:
              id:
                type: string
                minLength: 1
                description: Stable lowercase slug, e.g. `woman` or `25-34`.
              label:
                type: string
                minLength: 1
                description: Short human-facing name.
              definition:
                type: string
                minLength: 1
                description: One-sentence decision rule for membership in this subgroup.
    Formation:
      type: object
      description: A persisted segmentation of one Audience into subgroups.
      required:
      - id
      - name
      - status
      - source
      - visibility
      - canMutate
      - createdAt
      - updatedAt
      - createdByUserId
      - subgroups
      - hypothesis
      - progress
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum:
          - building
          - ready
          - failed
        source:
          type: string
          enum:
          - auto
          - manual
        visibility:
          type: string
          enum:
          - shared
          - viewer_private
        canMutate:
          type: boolean
          description: Whether the caller may recompute or delete this Formation.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdByUserId:
          type: string
          format: uuid
        subgroups:
          type: array
          description: Materialised subgroups in display order. A first build may have none; recompute retains the previous completed buckets until replacement succeeds.
          items:
            $ref: '#/components/schemas/FormationSubgroup'
        hypothesis:
          oneOf:
          - $ref: '#/components/schemas/StoredFormationHypothesis'
          - type: object
            maxProperties: 0
          description: Only proposal fields are returned; legacy empty or invalid proposals become an empty object.
        progress:
          oneOf:
          - $ref: '#/components/schemas/FormationBuildProgress'
          - type: 'null'
          description: Live build progress while `building`, the failure reason when `failed`, null once `ready`.
    AudienceDetailGrounding:
      type: object
      required:
      - snapshotId
      - distributions
      - reviewDistributions
      - sources
      - summary
      - confidence
      - appliedToPersonas
      - createdAt
      properties:
        snapshotId:
          type:
          - string
          - 'null'
          description: Identifier of the grounding snapshot currently applied.
        distributions:
          type: array
          description: Active distributions that drive cohort allocation, bounded to the Audience definition.
          items:
            $ref: '#/components/schemas/GroundingDistribution'
        reviewDistributions:
          type: array
          description: Complete source-identified distribution universe, including options that are not allocated.
          items:
            $ref: '#/components/schemas/GroundingDistribution'
        studyUse:
          type: object
          description: Collaborators only. Disclosed new-research or reconstruction mode, matching the reviewed preview.
        sourceFindings:
          type: array
          items:
            type: object
          description: Collaborators only. Original observed and historical findings retained separately from the active composition.
        researchStudyAnalysis:
          type:
          - object
          - 'null'
          description: Classification of uploaded research files and their audience, quota, routing and evidence contracts.
        screeningAdvisories:
          type: array
          items:
            type: object
          description: 'Collaborators only. Screening rules that read answers the Study collects: advisory, not applied to the members, kept with the Audience for the Study (same entries as the from-brief grounding).'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/GroundingSource'
        summary:
          type:
          - string
          - 'null'
        confidence:
          type: number
          minimum: 0
          maximum: 1
        appliedToPersonas:
          type: boolean
          description: True when deterministic cohort allocation assigned the members to the distributions.
        allocationConfig:
          type:
          - object
          - 'null'
          description: Deterministic cohort allocation controls used for the current member profiles.
        hardConstraints:
          oneOf:
          - $ref: '#/components/schemas/GroundingHardConstraints'
          - type: 'null'
        allocationAudit:
          type:
          - object
          - 'null'
          description: Per-distribution audit of target versus achieved segment counts.
        coverage:
          type:
          - object
          - 'null'
          description: 'How each relevant standard dimension is covered: `sourced` (evidence for these people), `proxy` (a wider or related population), `assumed` (the model''s stated assumption, replaced when research finds evidence) or `missing`.'
          properties:
            dimensions:
              type: array
              items:
                type: object
                properties:
                  dimension:
                    type: string
                  status:
                    type: string
                    enum:
                    - sourced
                    - proxy
                    - assumed
                    - missing
                  distribution:
                    type: string
            counts:
              type: object
              properties:
                sourced:
                  type: integer
                proxy:
                  type: integer
                assumed:
                  type: integer
                missing:
                  type: integer
        createdAt:
          type: string
          format: date-time
    PlanLimitEnvelope:
      type: object
      required:
      - code
      - limitType
      - currentPlan
      - limit
      properties:
        code:
          type: string
          enum:
          - PLAN_LIMIT
        limitType:
          type: string
          description: Which cap was hit, e.g. `audienceMembers` or `minds` (legacy responses may say `audienceMembers`).
        currentPlan:
          type: string
        limit:
          type: integer
        current:
          type: integer
          description: Consumption against the cap.
        requested:
          type: integer
          description: How many units this request asked for.
        itemsToCreate:
          type: integer
          description: Bulk-create size that pushed the request over the cap.
        periodEnd:
          type: string
          format: date-time
          description: End of the metering window when the cap is periodic.
        context:
          type: string
        reason:
          type: string
        audienceId:
          type: string
          format: uuid
        isTrialing:
          type: boolean
    AudienceDetailMember:
      type: object
      required:
      - id
      - name
      - discipline
      - profileImageUrl
      - createdAt
      - cohortProfile
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        discipline:
          type:
          - string
          - 'null'
        profileImageUrl:
          type:
          - string
          - 'null'
          format: uri
          description: Absolute avatar URL, or null while the portrait is still being generated.
        createdAt:
          type: string
          format: date-time
        readyToChat:
          type: boolean
          description: The member can answer, as `GET /minds/{mindId}/training` reports it. A Study waits for members still training; members that failed training for good are left out when at least one Mind and at least half of the members can answer, and retrained automatically where possible.
        cohortProfile:
          oneOf:
          - $ref: '#/components/schemas/CohortMemberProfile'
          - type: 'null'
          description: The segment of every grounded distribution this member represents. Null for Minds that were never allocated.
    AudienceGrounding:
      type: object
      required:
      - distributions
      - sources
      - summary
      - confidence
      properties:
        distributions:
          type: array
          items:
            $ref: '#/components/schemas/GroundingDistribution'
        reviewDistributions:
          type: array
          description: Complete source-identified distribution universe, including screener-excluded, conditional, and unweighted options that were not allocated.
          items:
            $ref: '#/components/schemas/GroundingDistribution'
        researchStudyAnalysis:
          type:
          - object
          - 'null'
          description: Canonical content-based classification of uploaded research files and their audience, quota, routing, and evidence contracts.
        research:
          type:
          - object
          - 'null'
          description: 'Research coverage and axisReconciliation audit. An unavailable or budget_exceeded axis review is not a successful semantic validation; failureReason explains unusable model output or infrastructure failure. `dimensionCoverage.dimensions` lists the standard dimensions covered for this population — the fixed core pool every audience of people carries (age, gender identity, representation, geography, education, employment status, income, household size) plus any the planner judged relevant — each with a reason and a status: `sourced`, `proxy` (wider area or population), `assumed` (model-proposed shares, never used for sizing) or `missing`.'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/GroundingSource'
        summary:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        suggestedMinAudienceSize:
          type: integer
          minimum: 3
          maximum: 50
        screeningAdvisories:
          type: array
          description: 'Screening rules that read answers the Study collects (for example a screen-out on willingness to pay combined with income). Minds do not carry Study answers as profile attributes, so these rules are advisory: the Audience is created, the rule is not applied to its members, and it stays in `researchStudyAnalysis.allocationRules` (disposition `advisory`, `studyAnswers`) for the Study. Rules on profile attributes are enforced and never listed here.'
          items:
            type: object
            required:
            - ruleId
            - disposition
            - appliesTo
            - studyQuestions
            - reason
            - notice
            properties:
              ruleId:
                type: string
              disposition:
                type: string
                enum:
                - advisory
              appliesTo:
                type: string
                enum:
                - study_answers
              studyQuestions:
                type: array
                items:
                  type: string
              reason:
                type: string
              notice:
                type: string
        flaggedDistributions:
          type: array
          description: Axes demoted to supplementary context because they measure the Study outcome itself (`audienceContext.reason = study_outcome`). Never used for cohort allocation.
          items:
            type: object
            required:
            - name
            - reason
            properties:
              name:
                type: string
              reason:
                type: string
                enum:
                - study_outcome
              category:
                type: string
                enum:
                - demographic
                - geographic
                - psychographic
                - behavioral
                - firmographic
              tier:
                type: string
                enum:
                - target
                - broader
                - general
                - global
    FormationSubgroup:
      type: object
      required:
      - id
      - label
      - definition
      - isAuxiliary
      - position
      - memberships
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        definition:
          type:
          - string
          - 'null'
          description: Natural-language membership rule.
        isAuxiliary:
          type: boolean
          description: True for the catch-all bucket (e.g. Other or Unanswered).
        position:
          type: integer
          minimum: 0
        memberships:
          type: array
          description: Minds assigned to this subgroup. A Mind may appear in several subgroups when overlap is allowed.
          items:
            type: object
            required:
            - mindId
            - confidence
            properties:
              mindId:
                type: string
                format: uuid
              confidence:
                type:
                - number
                - 'null'
                minimum: 0
                maximum: 1
    GroundingHardConstraints:
      type: object
      description: Inclusion rules resolved from the Audience specification. Values outside these bounds are excluded from allocation.
      required:
      - gender
      - age
      - country
      - categoricalMemberships
      properties:
        gender:
          type:
          - string
          - 'null'
          enum:
          - feminine
          - masculine
          - androgynous
          - null
        age:
          oneOf:
          - type: object
            required:
            - min
            - max
            properties:
              min:
                type: integer
              max:
                type: integer
          - type: 'null'
        country:
          type:
          - string
          - 'null'
        categoricalMemberships:
          type: array
          items:
            type: object
            required:
            - axisTerms
            - allowedValueTerms
            properties:
              axisTerms:
                type: array
                items:
                  type: string
              allowedValueTerms:
                type: array
                items:
                  type: string
    AudienceCalibrationState:
      type: object
      required:
      - active
      - startedAt
      properties:
        active:
          type: boolean
          description: True while a recalibration run is in flight for this Audience.
        startedAt:
          type:
          - string
          - 'null'
          format: date-time
        operation:
          type:
          - object
          - 'null'
          description: 'Owner-only latest durable recalibration: receipt, status, result.grounding and member counts, or safe terminal error.'
    FormationSummary:
      type: object
      required:
      - id
      - name
      - status
      - source
      - dimensionKey
      - visibility
      - createdAt
      - updatedAt
      - createdByUserId
      - subgroups
      - canMutate
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum:
          - building
          - ready
          - failed
          description: Build state. Subgroup memberships are only populated once `ready`.
        source:
          type: string
          enum:
          - auto
          - manual
        dimensionKey:
          type:
          - string
          - 'null'
          description: Set on auto-seeded Formations (e.g. `age`, `gender`, or `grounding:<axis>` for grounding-derived splits); null for user-created ones.
        visibility:
          type: string
          enum:
          - shared
          - viewer_private
          description: '`shared` Formations are visible to every Audience viewer; `viewer_private` ones only to their creator.'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdByUserId:
          type: string
          format: uuid
        canMutate:
          type: boolean
          description: Whether the caller may recompute or delete this Formation.
        subgroups:
          type: array
          items:
            type: object
            required:
            - id
            - label
            - isAuxiliary
            - position
            - _count
            properties:
              id:
                type: string
                format: uuid
              label:
                type: string
              isAuxiliary:
                type: boolean
                description: True for the catch-all bucket (e.g. Other or Unanswered).
              position:
                type: integer
                minimum: 0
              _count:
                type: object
                required:
                - memberships
                properties:
                  memberships:
                    type: integer
                    minimum: 0
                    description: Number of Minds in this subgroup.
    AudienceSourceRecord:
      type: object
      required:
      - id
      - kind
      - text
      - url
      - filename
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - brief
          - adjustment
          - keyword
          - link
          - file
        text:
          type:
          - string
          - 'null'
          description: Brief, adjustment or keyword text. Null for link and file rows.
        url:
          type:
          - string
          - 'null'
          description: Link URL or uploaded-file URL. Null for text rows; redacted for viewers without collaborator access.
        filename:
          type:
          - string
          - 'null'
          description: Original file name for file rows.
        createdAt:
          type: string
          format: date-time
    GroundingDistribution:
      type: object
      required:
      - name
      - distribution
      properties:
        name:
          type: string
        translations:
          type: object
          description: 'Read-only presentation, attached on read for the caller''s locale (`x-locale` header or `aox-locale` cookie; default `en`): `{ [locale]: { name?, displayHeading?, segments?: { [originalLabel]: string } } }` with the friendly label a profile shows (a survey question as the attribute it measures, e.g. "Openness to new cuisines"; an awkward answer as a profile value). Only wording that differs from the original is present. `name` and each segment `label` stay the identity; never send this back.'
          additionalProperties:
            type: object
        dimension:
          type: string
          enum:
          - age
          - gender
          - income
          - life_stage
          - representation
          - education
          - employment_status
          - marital_status
          - household_size
          - household_income
          - geography
          - occupation
          - industry
          - gender_identity
          - source_sex
          - nationality
          - visual_presentation
          - duration_years
          - none
          description: Language-independent personal dimension the distribution measures. Allocation reads it, with each segment's canonical, to keep every member's combination plausible.
        userEdit:
          type: object
          description: 'Read-only record of what the Audience''s owner changed on this chart, layered on its evidence (which stays as research found it): `kind` is `shares` (target shares set via `cohortAllocation.targetOverrides` or a rework instruction), `excluded_segment` (values removed; they stay in `reviewDistributions` with their evidence), `excluded_chart` (the chart was removed) or `user_defined` (the owner made the chart). `userShares` are the shares the owner set, `evidenceShares` the chart''s evidence shares, `excludedSegments` the removed values; `instruction`, `revision` and `editedAt` say where and when. Members whose value an edit decided carry profile basis `user_target`, with the evidence share in the reason.'
          required:
          - kind
          - evidenceShares
          properties:
            kind:
              type: string
              enum:
              - shares
              - excluded_segment
              - excluded_chart
              - user_defined
            userShares:
              type: array
              items:
                type: object
                properties:
                  label:
                    type: string
                  pct:
                    type: number
            evidenceShares:
              type: array
              items:
                type: object
                properties:
                  label:
                    type: string
                  pct:
                    type: number
            excludedSegments:
              type: array
              items:
                type: string
            instruction:
              type: string
            revision:
              type: integer
            editedAt:
              type: string
              format: date-time
        durationStart:
          type: object
          nullable: true
          description: 'duration_years only: the earliest age at which the counted time can begin for this audience, with its evidence. No member is given more years than its age minus this allows.'
          required:
          - minimumAge
          - evidence
          properties:
            minimumAge:
              type: integer
              minimum: 0
              maximum: 80
            evidence:
              type: object
              required:
              - kind
              properties:
                kind:
                  type: string
                  enum:
                  - source
                  - definitional
                sourceIdx:
                  type: integer
                  minimum: 0
                quote:
                  type: string
                justification:
                  type: string
        segmentAgeBounds:
          type: array
          nullable: true
          description: Ages outside which no member of this audience can be in a segment (e.g. the earliest age an occupation's training allows), with evidence. Allocation keeps every member inside its segments' ages without moving a share.
          items:
            type: object
            required:
            - segment
            - evidence
            properties:
              segment:
                type: string
              minAge:
                type: integer
                minimum: 0
                maximum: 110
              maxAge:
                type: integer
                minimum: 0
                maximum: 110
              evidence:
                type: object
                required:
                - kind
                properties:
                  kind:
                    type: string
                    enum:
                    - source
                    - definitional
                  sourceIdx:
                    type: integer
                    minimum: 0
                  quote:
                    type: string
                  justification:
                    type: string
        distribution:
          type: array
          items:
            type: object
            required:
            - label
            - pct
            - sourceIdx
            properties:
              label:
                type: string
              pct:
                type: number
                minimum: 0
                maximum: 100
              sourceIdx:
                type: integer
                minimum: 0
              canonical:
                type: string
                description: Language-independent value for the dimension, e.g. "employment_full_time", "18-24", or for duration_years a whole-year range like "6-10", "<5", "30+".
              review:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - included
                    - excluded_by_source
                    - conditional
                    - unweighted
                  evidence:
                    type: string
                    enum:
                    - target
                    - observed
                    - candidate
                  reason:
                    type: string
                  sourceFile:
                    type: string
        tier:
          type: string
          enum:
          - target
          - broader
          - general
          - global
        segmentRelations:
          type: array
          nullable: true
          description: 'Evidence-backed relations from one of this distribution''s segments to segments of another distribution of the same audience. subset: every member in segment is in one of targetSegments. excludes: no member in segment is in any of targetSegments. Enforced by cohort allocation and reported in allocationAudit.segmentRelations.'
          items:
            type: object
            required:
            - type
            - segment
            - targetDistribution
            - targetSegments
            - evidence
            properties:
              type:
                type: string
                enum:
                - subset
                - excludes
              segment:
                type: string
              targetDistribution:
                type: string
              targetSegments:
                type: array
                items:
                  type: string
              evidence:
                type: object
                required:
                - kind
                properties:
                  kind:
                    type: string
                    enum:
                    - source
                    - definitional
                  sourceIdx:
                    type: integer
                    minimum: 0
                  quote:
                    type: string
                  justification:
                    type: string
    StoredFormationHypothesis:
      type: object
      required:
      - intent
      - subgroups
      properties:
        intent:
          type: string
          minLength: 1
        subgroups:
          type: array
          minItems: 1
          maxItems: 15
          items:
            type: object
            required:
            - id
            - label
            - definition
            properties:
              id:
                type: string
                minLength: 1
              label:
                type: string
                minLength: 1
              definition:
                type: string
                minLength: 1
    FormationBuildProgress:
      type: object
      required:
      - phase
      - done
      - total
      properties:
        phase:
          type: string
          enum:
          - classify
          - reconcile
          - ask
        done:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        failureReason:
          type: string
          description: Safe public explanation when failed; raw diagnostics are never returned.
    PlanLimitError:
      type: object
      description: Error body of a plan-limit refusal (HTTP 403).
      properties:
        statusCode:
          type: integer
          enum:
          - 403
        statusMessage:
          type: string
          description: Human-readable message naming the plan and the limit.
        data:
          $ref: '#/components/schemas/PlanLimitEnvelope'
    SavedAudienceResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - id
          - name
          - mindCount
          - mindIds
          - minds
          - isLinkSharingEnabled
          - currentMemberRole
          properties:
            id:
              type: string
            name:
              type: string
            mindCount:
              type: integer
              minimum: 0
            mindIds:
              type: array
              items:
                type: string
            minds:
              type: array
              items:
                type: object
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            isPublic:
              type: boolean
            isSharedWithTeam:
              type: boolean
            isLinkSharingEnabled:
              type: boolean
            publicShareId:
              type:
              - string
              - 'null'
            currentMemberRole:
              type: string
              enum:
              - owner
    AudienceFromBriefResult:
      type: object
      required:
      - id
      - name
      - mindCount
      - minds
      - createdAt
      - updatedAt
      - isPublic
      - isSharedWithTeam
      - isLinkSharingEnabled
      - currentMemberRole
      - grounding
      - audienceCreationMode
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        mindCount:
          type: integer
        minds:
          type: array
          items:
            $ref: '#/components/schemas/AudienceMindSummary'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        isPublic:
          type: boolean
        isSharedWithTeam:
          type: boolean
        isLinkSharingEnabled:
          type: boolean
        publicShareId:
          type:
          - string
          - 'null'
        currentMemberRole:
          type: string
          enum:
          - owner
        research:
          type: object
          description: 'Where the Audience''s research stands. `researching`: it is usable now and its web research continues in the background (follow `research` on `GET /audiences/{audienceId}/progress`); `researched`: research finished with the creation.'
          properties:
            phase:
              type: string
              enum:
              - usable
              - researching
              - researched
            status:
              type:
              - string
              - 'null'
              enum:
              - queued
              - running
              - completed
              - failed
              - null
            stage:
              type:
              - string
              - 'null'
              enum:
              - researching
              - waiting_for_runs
              - recalibrating
              - done
              - null
            progress:
              type: integer
              minimum: 0
              maximum: 100
        grounding:
          oneOf:
          - $ref: '#/components/schemas/AudienceGrounding'
          - type: 'null'
        audienceCreationMode:
          type: string
          enum:
          - balanced
          - segment_coverage
          - benchmark_depth
          description: The EFFECTIVE creation mode applied by the server (after the plan gate — may differ from the requested mode on plans below Pro).
        replayed:
          type: boolean
          description: 'Present and true only on an idempotent replay (200): the audience was created by an earlier request with the same idempotency key.'
        datasetSegmentation:
          oneOf:
          - type: object
            properties:
              selectedVariableCount:
                type: integer
              observedProfileCount:
                type: integer
              recommendedMindCount:
                type: integer
              createdMindCount:
                type: integer
          - type: 'null'
        withheldFromMemberKnowledge:
          type:
          - array
          - 'null'
          description: 'Supplied sources that shaped grounding and study design but were deliberately kept out of the member Minds'' knowledge, so they cannot leak the study''s own outcomes or raw respondent rows into the predictions. Empty when everything supplied reached member knowledge; null on an idempotent replay, which means unknown rather than nothing. A non-empty list with `includeWebSearch: true` is normal; with `includeWebSearch: false` and nothing else surviving, the Audience is still created from the brief and its charts, its summary says the members carry no readable evidence, and each Mind''s knowledge state says so.'
          items:
            type: object
            required:
            - title
            - reason
            properties:
              title:
                type: string
                description: File name, link title or keyword as supplied.
              reason:
                type: string
                enum:
                - respondent_dataset
                - study_report
                - questionnaire
                - screener
                - distribution_source
                - tabular
                - unclassified
                description: 'Why it was kept out. A file reaches member knowledge only when the reading of the supplied material classifies it as supporting material (background the members may read) and it is not a spreadsheet. `respondent_dataset`: raw respondent rows. `study_report`: a report with the study''s own results. `questionnaire` / `screener`: the study''s instrument or screening rules. `distribution_source`: a distribution the Audience was built from was read from it. `tabular`: a CSV/XLS/XLSX/ODS file classified as supporting material (records are never read into Minds'' knowledge as text). `unclassified`: the reading did not classify it as supporting material: it was unreadable, the reading passed its time limit and fell back to the brief alone, or the file was not covered by the reading. In every case the file was still read for the grounding: it is listed among the grounding''s sources, and the distributions, quota and screening rules found in it shape the Audience. It is not in the member Minds'' knowledge and not in the material their profiles are drafted from.'
        memberTraining:
          oneOf:
          - type: object
            required:
            - enqueued
            - queuedMemberCount
            - pollUrlTemplate
            description: 'Per-Mind background training enqueued for this creation. Every creation path trains every member: training is committed with the Audience and resumes on its own if the build is interrupted, so `queuedMemberCount` equals `mindCount`. Null on idempotent replays (training bookkeeping is not persisted).'
            properties:
              enqueued:
                type: boolean
              queuedMemberCount:
                type: integer
              pollUrlTemplate:
                type:
                - string
                - 'null'
                description: Substitute each member id to poll its training progress, e.g. /api/v1/minds/{mindId}/training.
          - type: 'null'
        cohortAllocation:
          oneOf:
          - type: object
            required:
            - config
            - audit
            properties:
              config:
                type: object
              audit:
                type: object
              profiles:
                type: array
                items:
                  type: object
          - type: 'null'
        cohortAllocationCoverage:
          type: object
          description: Which members the deterministic cohort allocation actually covered. Members flagged as real people are excluded individually (they cannot be given an invented demographic profile); `skipReason` explains a null `cohortAllocation`.
          required:
          - memberCount
          - allocatedMemberCount
          - excludedRealPersonCount
          - skipReason
          properties:
            memberCount:
              type: integer
            allocatedMemberCount:
              type: integer
            excludedRealPersonCount:
              type: integer
            excludedRealPersonNames:
              type: array
              items:
                type: string
            skipReason:
              type:
              - string
              - 'null'
              enum:
              - no_grounded_distributions
              - all_members_flagged_real_person
              - null
    AudienceDetail:
      type: object
      required:
      - id
      - name
      - mindCount
      - minds
      - createdAt
      - updatedAt
      - isPublic
      - currentMemberRole
      - sources
      - calibration
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        marketplaceSubtitle:
          type:
          - string
          - 'null'
          description: Short subtitle shown in the public marketplace listing.
        marketplaceDescription:
          type:
          - string
          - 'null'
          description: Longer description shown in the public marketplace listing.
        mindCount:
          type: integer
          minimum: 0
        membersLoaded:
          type: boolean
          description: Present in preview mode. False means the member array is incomplete; mindCount remains authoritative.
        minds:
          type: array
          description: Member Minds ordered by name.
          items:
            $ref: '#/components/schemas/AudienceDetailMember'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        isPublic:
          type: boolean
          description: Anyone signed in can open the Audience and its Minds (marketplace listing).
        currentMemberRole:
          type: string
          enum:
          - owner
          - admin
          - member
          - team_member
          - public_viewer
          description: The caller's relationship to this Audience. `public_viewer` also covers read-only access inherited from a containing Study.
        isSharedWithTeam:
          type: boolean
          description: Collaborators only. Every member of the owner's team can open the Audience and read and chat with every Mind in it; no edit rights on the Minds.
        isLinkSharingEnabled:
          type: boolean
          description: Collaborators only. Anyone with the public link can open the Audience.
        publicShareId:
          type:
          - string
          - 'null'
          description: Collaborators only. Token of the public share link, when link sharing has been enabled.
        grounding:
          allOf:
          - $ref: '#/components/schemas/AudienceDetailGrounding'
          description: Stored research grounding. Absent when the Audience was never grounded.
        sources:
          type: array
          description: 'The Audience''s source bundle in creation order: the original brief, later recalibration adjustments, keywords, links and uploaded files. Uploaded-file URLs are signed and are redacted for public and Study-cascade viewers.'
          items:
            $ref: '#/components/schemas/AudienceSourceRecord'
        derivedDistributions:
          type: array
          description: 'Baseline demographics derived from what the members actually are, for dimensions the research did not cover. Present only when the member count is within the derivation cap and at least one dimension could be derived. A `grounding` chart that holds one value every member shares (an age range, "Region: United States and Europe", "1-20 staff") is a membership constraint, marked `kind: ''eligibility''` and shown as "All members: …", never as a 100% chart; where the Minds carry finer values for that dimension and no quota chart already shows them, an entry here gives the members'' own breakdown (ages in standard bands), with the constraint in its `interpretation`. Absent, too, while the stored `grounding` charts predate the dimension stamp (an older Audience no editor has opened since): an editor''s open stamps them, and the next read includes this field. Not research evidence and never used for cohort allocation.'
          items:
            $ref: '#/components/schemas/GroundingDistribution'
        calibration:
          $ref: '#/components/schemas/AudienceCalibrationState'
        research:
          type: object
          description: 'Where the Audience''s research stands (same shape as `research` on `GET /audiences/{audienceId}/progress`). `researching`: the Audience is usable and its background web research is running; `researched`: done; `usable`: it failed and the Audience stays on what was already known.'
          properties:
            phase:
              type: string
              enum:
              - usable
              - researching
              - researched
            status:
              type:
              - string
              - 'null'
              enum:
              - queued
              - running
              - completed
              - failed
              - null
            stage:
              type:
              - string
              - 'null'
              enum:
              - researching
              - waiting_for_runs
              - recalibrating
              - done
              - null
            progress:
              type: integer
              minimum: 0
              maximum: 100
            startedAt:
              type:
              - string
              - 'null'
              format: date-time
            operation:
              type:
              - object
              - 'null'
              description: 'Owner-only latest durable recalibration: receipt, status, result.grounding and member counts, or safe terminal error.'
            completedAt:
              type:
              - string
              - 'null'
              format: date-time
            outcome:
              type:
              - object
              - 'null'
              additionalProperties: true
    AudienceMindSummary:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        discipline:
          type:
          - string
          - 'null'
        profileImageUrl:
          type:
          - string
          - 'null'
    CohortMemberProfile:
      type: object
      required:
      - memberIndex
      - assignments
      properties:
        memberIndex:
          type: integer
          minimum: 0
        assignments:
          type: array
          items:
            type: object
            required:
            - distribution
            - segment
            - sourceIdx
            properties:
              distribution:
                type: string
                description: Name of the grounded distribution.
              segment:
                type: string
                description: Label of the assigned segment.
              sourceIdx:
                type: integer
                description: Index into the grounding sources; -1 for assumed or derived segments.
              dimension:
                type: string
                enum:
                - age
                - gender
                - income
                - life_stage
                - representation
                - education
                - employment_status
                - marital_status
                - household_size
                - household_income
                - geography
                - occupation
                - industry
                - gender_identity
                - source_sex
                - nationality
                - visual_presentation
                - duration_years
                - none
                description: Shared attribute dimension (GROUNDING_DIMENSIONS). gender_identity and source_sex are one gender attribute; gender is appearance.
              canonical:
                type: string
                description: Language-independent segment concept, e.g. `feminine` or an age band such as `65+`.
    GroundingSource:
      type: object
      required:
      - url
      - title
      - snippet
      - domain
      - confidence
      properties:
        url:
          type: string
        title:
          type: string
        snippet:
          type: string
        domain:
          type: string
        publishedDate:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        tier:
          type: string
          enum:
          - target
          - broader
          - general
          - global
        isUserProvided:
          type: boolean
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: 'Personal API key. Format: `Bearer minds_…_key`. Create one at https://getminds.ai/settings/api-keys.'
