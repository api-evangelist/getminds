        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - files
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                    required:
                    - name
                    - url
                    properties:
                      name:
                        type: string
                      url:
                        type: string
                population:
                  type: string
                  description: Which reported audience of respondents to read, as for a validation with `files`.
  /api/v1/audiences/{audienceId}/validations:
    get:
      responses:
        '200':
          description: Validations and the Audience-level summary.
          content:
            application/json:
              schema:
