  /api/v1/audiences/from-brief:
    post:
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
        description: 'Retry-safety key, max 200 chars (also accepted as the `idempotencyKey` body field; the header wins). Creation can exceed typical client timeouts — retrying with the same key within 6 hours returns the audience the original request created (200, `replayed: true`) instead of creating a duplicate.'
      - name: Prefer
        in: header
        required: false
        schema:
          type: string
          enum:
          - respond-async
        description: Return 202 after durable admission and run the complete build on the processor.
      responses:
        '200':
          description: 'Either an idempotent replay (the supplied idempotency key already created an audience within the replay window; returns that audience with `replayed: true`, nothing new is created, no plan allowances are consumed, `datasetSegmentation` is not reconstructed) or a saved-snapshot/internal `groundingPreview` result containing reviewed grounding, checksum, effective cohortAllocation audit, flags, and size with no Audience or Minds created.'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AudienceFromBriefResult'
        '201':
          description: Grounded audience created.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AudienceFromBriefResult'
        '202':
          description: Creation or a fresh public grounding preview accepted by the processor, including when async is omitted or false. Saved-snapshot previews also return 202 when explicitly requested asynchronously. Poll `data.statusUrl` until completed or failed; `data.result` contains the same completed response as a synchronous request.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - jobId
                    - status
                    - progress
                    - statusUrl
                    properties:
                      jobId:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum:
                        - queued
                        - processing
                        - completed
                      progress:
                        type: integer
                        minimum: 0
                        maximum: 100
                      statusUrl:
                        type: string
        '400':
          description: Missing `text`, text too long, or invalid input.
        '401':
          description: Missing or invalid API key.
        '403':
          description: 'Plan limit reached (`code: PLAN_LIMIT`), or an explicit count above the 20-Mind balanced-mode ceiling (`code: MODE_CAP` — use `segment_coverage` or `benchmark_depth`).'
        '409':
          description: An idempotency key is already in progress or was reused with a different explicit member count, or the reviewed grounding checksum does not match.
        '422':
          description: No personas could be derived from the brief.
        '500':
          description: Internal server error.
      operationId: createAudienceFromBrief
      summary: Create a grounded audience from a brief
      description: Create one Audience from a free-text brief. Attached research files use the same extended screener/questionnaire analysis as the in-app New Audience flow, including Study roles, screening and quota rules, review distributions, and grounding provenance. Public bearer-authenticated V1 requests return `202 Accepted`; poll the returned status URL until the durable processor operation completes.
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - text
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 200000
                  description: Free-text brief describing the audience or population to represent.
                name:
                  type: string
                  description: Optional audience name override. When omitted, the server names the audience from the brief or detected personas.
                files:
                  type: array
                  description: Already-uploaded research files analyzed through the same extended Audience study-ingestion path as the in-app New Audience uploader.
                  items:
                    type: object
                    required:
                    - name
                    - url
                    properties:
                      name:
                        type: string
                      url:
                        type: string
                links:
                  type: array
                  description: URLs to scrape for additional context.
                  items:
                    type: string
                keywords:
                  type: array
                  description: Search keywords used as extra context and research seeds.
                  items:
                    type: string
                includeWebSearch:
                  type: boolean
                  default: true
                  description: When false, skips Exa search/extraction completely and grounds only on the supplied brief, files, links, keywords, and structurally parsed respondent data.
                isLinkSharingEnabled:
                  type: boolean
                  description: Enable public link sharing for the created audience.
                generateImages:
                  type: boolean
                  default: true
                  description: Generate AI profile images and an audience cover asynchronously. Pass false to keep fallback visuals and avoid all image-model calls for this creation.
                trainMembers:
                  type: boolean
                  default: true
                  deprecated: true
                  description: 'Deprecated; omit it. Every member of every Audience is individually trained in the background, including large reviewed-dataset cohorts (> 40 Minds), through the same per-member pipeline the in-app flow uses, keeping each Mind''s deterministic cohort profile and the request locale. `true` is accepted as a no-op; `false` is rejected with 400 `TRAIN_MEMBERS_OPT_OUT_REMOVED` (it used to create untrained Minds with an empty system prompt that reported ready). Cost and time: each member consumes one Mind training (research, knowledge and prompt generation); a 100-Mind cohort typically finishes over tens of minutes to a few hours, staggered per Audience. The response returns as soon as the Audience exists; poll GET /api/v1/minds/{mindId}/training per member (or the Audience progress endpoint) and wait for every member to report readyToChat before running a Study — Study runs refuse Audiences with untrained members.'
                idempotencyKey:
                  type: string
                  maxLength: 200
                  description: Retry-safety key (same semantics as the `Idempotency-Key` header, which wins when both are sent). Reusing the key within 6 hours replays the audience it created instead of duplicating it.
                async:
                  type: boolean
                  description: Optional async hint for internal cookie-authenticated callers. Public bearer-authenticated V1 requests are always enqueued and return a pollable 202 operation.
                groundingPreview:
                  type: boolean
                  default: false
                  description: 'Review the quota axes before any Mind exists. When true the request runs research grounding plus a deterministic allocation preview and returns the reviewed grounding, checksum, effective cohortAllocation audit, flags, and size without creating an Audience or Minds or consuming generation allowance. Fresh public previews always return a durable 202 operation, including when `async` is omitted or false. Saved-snapshot previews may return inline; send `async: true` or `Prefer: respond-async` to queue those too. Poll its status URL for the same preview result. Explicit allocation targets that cannot match the grounded axes fail closed with 422, just like creation. Axes that measure the Study outcome itself are demoted to supplementary context and listed in `flaggedDistributions`.'
                reviewedGroundingJson:
                  type: string
                  description: Exact reviewed grounding snapshot returned by a prior preview. Send it unchanged with reviewedGroundingSha256 to re-preview revised exclusions/allocation options against the same evidence, or to create from the latest accepted preview without rerunning grounding research.
                reviewedGroundingSha256:
                  type: string
                  pattern: ^[0-9a-fA-F]{64}$
                  description: SHA-256 returned with reviewedGroundingJson. Both fields are required together; creation fails before materialisation when the checksum does not match.
                excludeDistributions:
                  type: array
                  maxItems: 200
                  items:
                    type: string
                  description: Exact axis names whose composition quotas should be removed. Age remains as one eligibility range without within-range shares; explicit gender membership remains enforced. Include required eligibility axes in cohortAllocation.distributionNames. Original evidence stays in reviewDistributions.
                memberCount:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  description: Exact number of Minds to create. Wins over any count parsed from `text` and over grounding suggestions, while remaining subject to the effective plan and creation-mode caps.
                audienceCreationMode:
                  type: string
                  enum:
                  - balanced
                  - segment_coverage
                  - benchmark_depth
                  deprecated: true
                  description: Deprecated alias for `audienceCreationMode`. If both fields are supplied, their values must match.
                datasetSegmentation:
                  type: object
                  description: 'Reviewed research-variable roles, distributions, privacy-safe pairwise relationships, and deterministic dependencies (recodes and questionnaire routing filters) returned by the segmentation-preview endpoint. Pass `functionalDependencies` and `dependencyDiscovery` through unchanged: the first are hard constraints, so a synthetic respondent never breaks a recode and a filtered question stays unanswered at the source rate; the second reports which discovery bounds applied and is echoed into `cohortAllocation.audit.jointConsistency`. Omitting it does not disable enforcement, but the audit will say the bounds are unknown. Requires Team plus `benchmark_depth`. Structural variables shape a representative cohort; outcomes remain held out and observed joint combinations remain audit evidence rather than respondent-like Minds.'
                cohortAllocation:
                  type: object
                  description: Deterministic allocation controls. Grounded marginals are converted into exact integer quotas server-side; the LLM does not decide proportions. Omit for deterministic defaults.
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    seed:
                      type: string
                      maxLength: 200
                    distributionNames:
                      type: array
                      maxItems: 500
                      items:
                        type: string
                    maxDistributions:
                      type: integer
                      minimum: 1
                      maximum: 500
                      default: 500
                    minSegmentCount:
                      type: integer
                      minimum: 0
                      maximum: 20
                      default: 0
                    targetOverrides:
                      type: array
                      maxItems: 500
                      description: Partial or full target-percentage overrides. Unspecified segments keep their source percentages; the audit preserves sourcePct and normalizedTargetPct separately.
                      items:
                        type: object
                        required:
                        - distribution
                        - segments
                        properties:
                          distribution:
                            type: string
                          segments:
                            type: array
                            items:
                              type: object
                              required:
                              - label
                              - pct
                              properties:
                                label:
                                  type: string
                                pct:
                                  type: number
                                  minimum: 0
                                  maximum: 100
                    jointStrategy:
                      type: string
                      enum:
                      - independent
                      - aligned
                      - observed
                      default: independent
                    includeProfilesInResponse:
                      type: boolean
                      default: false
            examples:
              demographicAudience:
                summary: Create an Audience
                value:
                  text: Berlin Spati customers who buy late-night snacks
                  name: Berlin Spati Customers
                  links:
                  - https://example.com/customer-research
                  keywords:
                  - Berlin convenience store demographics
