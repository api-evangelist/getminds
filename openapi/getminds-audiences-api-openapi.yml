openapi: 3.2.0
info:
  title: Minds Public Audiences API
  version: v1
  description: 'OpenAPI 3.1.0 spec for the Minds public API (https://getminds.ai/api/v1 / https://api.getminds.ai/v1). Generate a typed TypeScript client by running an OpenAPI generator (e.g. `openapi-typescript`) against `/_openapi.json`. Auth: send `Authorization: Bearer minds_…_key`; create keys in Settings → API Keys.'
servers:
- url: https://api.getminds.ai
  description: Production (api subdomain)
- url: https://getminds.ai
  description: Production (apex)
security:
- ApiKeyAuth: []
tags:
- name: Audiences
paths:
  /api/v1/audiences/{audienceId}:
    delete:
      responses:
        '204':
          description: The Audience and its orphan-only member Minds were deleted.
        '401':
          description: Missing or invalid API key (`Unauthorized`).
        '404':
          description: '`Audience not found`: the Audience does not exist or the caller is not its owner.'
      operationId: deleteAudience
      summary: Delete an Audience
      description: Permanently deletes an Audience. Owner only; collaborators and viewers receive 404. The deletion cascades to member Minds that the caller owns and that belong to no other Audience, so those Minds (with their training data and Study links) are removed too. Minds owned by other users, and Minds that are also members of another Audience, are kept. Remove Minds you want to keep with `DELETE /audiences/{audienceId}/members/{mindId}` first, or add them to another Audience.
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      parameters:
      - name: audienceId
        in: path
        required: true
        description: Audience ID (UUID).
        schema:
          type: string
          format: uuid
    get:
      responses:
        '200':
          description: The Audience detail.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AudienceDetail'
        '400':
          description: '`Audience ID is required` or `Invalid audience ID format` (the path parameter is not a UUID).'
        '401':
          description: Missing or invalid API key (`Unauthorized`).
        '404':
          description: '`Audience not found`: the Audience does not exist or the caller cannot view it.'
      operationId: getAudience
      summary: Get an Audience
      description: 'Returns one Audience with its member Minds (each with its cohort profile), the caller''s role, the stored grounding, the source bundle (brief, adjustments, keywords, links, files), member-derived baseline distributions, and the transient recalibration state. Use it to inspect an Audience before attaching it to a Study, to poll `calibration.active` after `POST /audiences/{audienceId}/recalibrate`, or to watch member `profileImageUrl` values arrive after `regenerate-images`. Formations are not embedded; list them with `GET /audiences/{audienceId}/formations`. Readable by the owner, direct members, members of the owner''s team when the Audience is team-shared, any authenticated caller when the Audience is public, and members of a Study that contains the Audience. Setting `isSharedWithTeam: true` lets every member of the owner''s team open the Audience and read and chat with every Mind in it, even when those Minds are not shared individually; it grants no edit rights on the Minds. Explicit Audience members get the same read access. Only collaborators (owner, direct member, team member) receive the sharing fields `isSharedWithTeam`, `isLinkSharingEnabled` and `publicShareId`; public and Study-cascade viewers get `currentMemberRole: public_viewer`, and uploaded-file URLs in `sources` and `grounding.sources` are redacted for them.'
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      parameters:
      - in: query
        name: members
        description: Use preview for bounded display profiles without reviewed-field metadata; omitted preserves the complete legacy detail response.
        schema:
          type: string
          enum:
          - preview
      - name: audienceId
        in: path
        required: true
        description: Audience ID (UUID).
        schema:
          type: string
          format: uuid
    put:
      responses:
        '200':
          description: The updated Audience.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - id
                    - name
                    - mindCount
                    - minds
                    - createdAt
                    - updatedAt
                    - isPublic
                    - isSharedWithTeam
                    - isLinkSharingEnabled
                    - publicShareId
                    - currentMemberRole
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      mindCount:
                        type: integer
                        minimum: 0
                      minds:
                        type: array
                        items:
                          $ref: '#/components/schemas/AudienceMindSummary'
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                      isPublic:
                        type: boolean
                      isSharedWithTeam:
                        type: boolean
                      isLinkSharingEnabled:
                        type: boolean
                      publicShareId:
                        type:
                        - string
                        - 'null'
                      currentMemberRole:
                        type: string
                        enum:
                        - owner
                        - admin
                        - member
                        - team_member
        '400':
          description: '`name is required` (missing or blank name), `Audience ID is required`, or `Invalid audience ID format`.'
        '401':
          description: Missing or invalid API key (`Unauthorized`).
        '404':
          description: '`Audience not found`: the Audience does not exist or the caller has no edit access (public and Study-link viewers included).'
      operationId: updateAudience
      summary: Update an Audience name and sharing settings
      description: 'Renames an Audience and optionally changes its visibility. `name` is required on every call; `isPublic` and `isSharedWithTeam` are applied only when sent as booleans and left unchanged otherwise. `isLinkSharingEnabled` cannot be changed here (it is echoed in the response). Allowed for collaborators: the owner, direct members, and members of the owner''s team when the Audience is team-shared. Only the owner may change `isSharedWithTeam` (403 `TEAM_SHARE_OWNER_ONLY` otherwise), and sharing requires the owner to be in a team (400 `TEAM_REQUIRED`). Public and Study-link viewers receive 404. Setting `isSharedWithTeam: true` lets every member of the owner''s team open the Audience and read and chat with every Mind in it, even when those Minds are not shared individually; it grants no edit rights on the Minds. Explicit Audience members get the same read access. Setting `isPublic: true` lists the Audience in the marketplace and queues a cover image for it.'
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      parameters:
      - name: audienceId
        in: path
        required: true
        description: Audience ID (UUID).
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  minLength: 1
                  description: New Audience name; surrounding whitespace is trimmed. Required even when only sharing flags change.
                isPublic:
                  type: boolean
                  description: List the Audience publicly. Anyone signed in can then open it and its Minds.
                isSharedWithTeam:
                  type: boolean
                  description: Share with every member of the owner's team. Grants read-and-chat access to all member Minds; no edit rights on the Minds.
            examples:
              rename:
                value:
                  name: German SaaS buyers (2026)
              shareWithTeam:
                value:
                  name: German SaaS buyers
                  isSharedWithTeam: true
  /api/v1/audiences/{audienceId}/collaborators/{userId}:
    delete:
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - success
                    properties:
                      success:
                        type: boolean
        '400':
          description: Invalid id, or the user is the owner (`COLLABORATOR_IS_OWNER`).
        '401':
          description: Unauthorized.
        '403':
          description: The caller can see the Audience but does not manage its sharing (`COLLABORATORS_MANAGER_ONLY`).
        '404':
          description: Audience not found or not visible to the caller, or the person is not a collaborator.
        '500':
          description: Internal server error. Responses are private and non-cacheable.
      operationId: removeAudienceCollaborator
      summary: Remove a collaborator from a Audience
      description: Removes the person's membership and revokes their invitations for this Audience in one step, so an old invitation link cannot restore access. Nobody is emailed. Only the Audience owner or a direct Audience admin may call it; the owner cannot be removed.
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      parameters:
      - name: audienceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/audiences/{audienceId}/collaborators:
    get:
      responses:
        '200':
          description: Collaborators of the Audience.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - userId
                      - email
                      - name
                      - role
                      - joinedAt
                      properties:
                        userId:
                          type: string
                          format: uuid
                          description: Pass to DELETE …/collaborators/{userId}.
                        email:
                          type:
                          - string
                          - 'null'
                          format: email
                        name:
                          type:
                          - string
                          - 'null'
                        role:
                          type: string
                          description: Role granted by the accepted invitation.
                        joinedAt:
                          type: string
                          format: date-time
        '400':
          description: Invalid id.
        '401':
          description: Unauthorized.
        '403':
          description: The caller can see the Audience but does not manage its sharing (`COLLABORATORS_MANAGER_ONLY`).
        '404':
          description: Audience not found or not visible to the caller.
        '500':
          description: Internal server error. Responses are private and non-cacheable.
      operationId: listAudienceCollaborators
      summary: List the people who accepted an invitation to a Audience
      description: Returns every collaborator of the Audience (people who accepted an email invitation), oldest first, without the owner. Pending invitations are listed by the invitations endpoints. Only the Audience owner or a direct Audience admin may call it; anyone else who can see the Audience gets 403.
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      parameters:
      - name: audienceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/audiences/{audienceId}/duplicate:
    post:
      responses:
        '200':
          description: Idempotent replay of the copy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedAudienceResponse'
        '201':
          description: The new copy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedAudienceResponse'
        '400':
          description: Invalid Audience id or body.
        '401':
          description: Authentication required.
        '403':
          description: The caller cannot edit this Audience, or the copy would exceed the plan's Mind or member allowance.
        '404':
          description: Audience not found.
      operationId: duplicateAudience
      summary: Duplicate an Audience
      description: 'Creates a private copy of an Audience you can edit: new, independent copies of every member Mind with their profiles, knowledge and embeddings, plus the grounding, sources, formations and finished validation history. Sharing, public links and running jobs are not copied. While the Audience is still being built the copy is its last good state (a member being rewritten is copied as the version it was trained as); copied members without a working version are retrained on their record. An optional idempotency key replays the same copy with status 200; a new copy returns 201.'
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      parameters:
      - in: path
        name: audienceId
        required: true
        schema:
          type: string
          format: uuid
      - name: x-minds-idempotency-key
        in: header
        required: false
        description: Reuse for retries of the same duplication. Blank keys and keys longer than 128 characters are ignored.
        schema:
          type: string
          maxLength: 128
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Name of the copy. Defaults to "<name> (copy)".
  /api/v1/audiences/{audienceId}/export-download:
    get:
      responses:
        '200':
          description: Audience export artifact.
      operationId: downloadAudienceExport
      summary: Download an Audience export
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      parameters:
      - in: path
        name: audienceId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: kind
        required: false
        schema:
          type: string
          enum:
          - brief
          - validation_report
        description: The brief (default) or the validation report.
      - in: query
        name: format
        required: false
        schema:
          type: string
          enum:
          - pdf
          - md
          - docx
          - pptx
          - xlsx
  /api/v1/audiences/{audienceId}/export-status:
    get:
      responses:
        '200':
          description: Audience export status. `unavailable` for a validation report of an Audience with no scored validation.
      operationId: getAudienceExportStatus
      summary: Get Audience export status
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      parameters:
      - in: path
        name: audienceId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: kind
        required: false
        schema:
          type: string
          enum:
          - brief
          - validation_report
        description: The brief (default) or the validation report.
      - in: query
        name: format
        required: false
        schema:
          type: string
          enum:
          - pdf
          - md
          - docx
          - pptx
          - xlsx
  /api/v1/audiences/{audienceId}/export:
    post:
      responses:
        '200':
          description: Cached artifact or queued export job.
        '400':
          description: A format the requested kind does not offer.
        '409':
          description: 'No scored validation to report yet (`kind: validation_report`).'
      operationId: exportAudienceBrief
      summary: Export an Audience brief or validation report
      description: 'Generates the Audience brief (`kind: brief`, default; pdf, md, docx, pptx) or the validation report (`kind: validation_report`; pdf, md, docx, xlsx): every scored validation with the overall score calculation, every KPI with its 95% interval, per-question answer shares, the composition check and provenance. The validation report needs edit access to the Audience and at least one scored validation (409 `VALIDATION_REPORT_UNAVAILABLE` otherwise). A cached artifact returns at once; otherwise the job is queued and polled through export-status.'
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      parameters:
      - in: path
        name: audienceId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                format:
                  type: string
                  enum:
                  - pdf
                  - md
                  - markdown
                  - docx
                  - pptx
                  - xlsx
                kind:
                  type: string
                  enum:
                  - brief
                  - validation_report
                force:
                  type: boolean
  /api/v1/audiences/{audienceId}/filter-attributes:
    get:
      responses:
        '200':
          description: Facets and matching Minds.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - totalMinds
                    - attributedMinds
                    - matchCount
                    - mindIds
                    - facets
                    - truncated
                    properties:
                      totalMinds:
                        type: integer
                        minimum: 0
                        description: Minds in the Audience that were read.
                      attributedMinds:
                        type: integer
                        minimum: 0
                        description: Minds with at least one filter attribute. Zero means the Audience carries no filter attributes.
                      matchCount:
                        type: integer
                        minimum: 0
                      mindIds:
                        type: array
                        items:
                          type: string
                          format: uuid
                        description: Matching Minds, sorted by ID.
                      truncated:
                        type: boolean
                      facets:
                        type: array
                        items:
                          type: object
                          required:
                          - key
                          - values
                          - unknownCount
                          properties:
                            key:
                              type: string
                              enum:
                              - perspective
                              - industry
                              - role
                              - country
                              - companySize
                              - technology
                              - businessModel
                            values:
                              type: array
                              maxItems: 200
                              items:
                                type: object
                                required:
                                - value
                                - count
                                properties:
                                  value:
                                    type: string
                                  count:
                                    type: integer
                                    minimum: 0
                            unknownCount:
                              type: integer
                              minimum: 0
        '400':
          description: Invalid audience ID or `filters` (not JSON, unknown attribute, wrong value type, too long).
        '401':
          description: Missing or invalid API key.
        '404':
          description: '`Audience not found`: it does not exist or the caller cannot view it.'
        '500':
          description: Internal server error.
      operationId: filterAudienceMinds
      summary: Filter an Audience's Minds by their filter attributes
      description: Returns the filter attributes present in an Audience (perspective, industry, role, country as ISO 3166-1 alpha-2, companySize, technology, businessModel) with per-value counts, and the Minds matching `filters`. Values of one attribute are alternatives (OR); attributes combine (AND); `null` selects Minds without a value for that attribute ("not known"). Each facet counts the Minds that match every other attribute's selection, so a count is the number of Minds the result would hold with that value picked. Pass the returned `mindIds` to `POST /audiences` (`mindIds`) to turn the selection into a new Audience. Readable by anyone who can view the Audience; otherwise 404. At most 5,000 Minds are read per request (`truncated` reports a larger Audience). Responses are private and non-cacheable.
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      parameters:
      - name: audienceId
        in: path
        required: true
        description: Audience ID (UUID).
        schema:
          type: string
          format: uuid
      - name: filters
        in: query
        required: false
        description: URL-encoded JSON object mapping attribute keys to arrays of values or null, e.g. `{"industry":["Labels"],"country":["DE",null]}`. At most 8,192 characters and 50 values per attribute. Omit for the unfiltered facets.
        schema:
          type: string
          maxLength: 8192
  /api/v1/audiences/{audienceId}/follow:
    delete:
      responses:
        '200':
          description: Audience unfollowed.
        '401':
          description: Unauthorized.
      operationId: unfollowAudience
      summary: Unfollow a public Audience
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      parameters:
      - name: audienceId
        in: path
        required: true
        schema:
          type: string
    post:
      responses:
        '200':
          description: Audience followed.
        '401':
          description: Unauthorized.
        '404':
          description: Public Audience not found.
      operationId: followAudience
      summary: Follow a public Audience
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      parameters:
      - name: audienceId
        in: path
        required: true
        schema:
          type: string
  /api/v1/audiences/{audienceId}/formations/{formationId}:
    delete:
      responses:
        '204':
          description: The Formation was deleted.
        '400':
          description: '`Audience ID is required`, `Invalid audience ID format`, `Formation ID is required`, or `Invalid formation ID format`.'
        '401':
          description: Missing or invalid API key (`Unauthorized`).
        '404':
          description: '`Formation not found`: the Audience is not viewable, or the Formation does not exist, is already deleted, or is not mutable by the caller.'
        '500':
          description: Internal server error. Responses are private and non-cacheable.
      operationId: deleteFormation
      summary: Delete a Formation
      description: Soft-deletes a Formation so it disappears from listings while Study messages that referenced it keep rendering. Collaborators may delete shared Formations and their own private ones; other viewers may delete only Formations they created privately. A Formation the caller cannot mutate yields 404.
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      parameters:
      - name: audienceId
        in: path
        required: true
        description: Audience ID (UUID).
        schema:
          type: string
          format: uuid
      - name: formationId
        in: path
        required: true
        description: Formation ID (UUID).
        schema:
          type: string
          format: uuid
    get:
      responses:
        '200':
          description: The Formation detail.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Formation'
        '400':
          description: '`Audience ID is required`, `Invalid audience ID format`, `Formation ID is required`, or `Invalid formation ID format`.'
        '401':
          description: Missing or invalid API key (`Unauthorized`).
        '404':
          description: '`Formation not found`: the Audience is not viewable, or the Formation does not exist, was deleted, or is private to another viewer.'
        '500':
          description: Unexpected storage failure or invalid persisted detail; internal details are redacted.
      operationId: getFormation
      summary: Get a Formation with its subgroups and members
      description: 'Returns one Formation: build status, live build progress, the stored hypothesis, and the real subgroups with their member assignments and confidences. Poll this after `POST /formations`, `POST /formations/preview` acceptance, or `recompute` until `status` is `ready` or `failed`; while `building`, `subgroups` may be empty and `hypothesis.subgroups` describes the proposed buckets. Visible to any Audience viewer for shared Formations and to the creator for private ones. Responses are private and non-cacheable. Stored diagnostics are omitted; failed builds expose only safe failure reasons. Invalid legacy proposals become an empty object, malformed building progress becomes null, and ready builds always return null progress.'
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      parameters:
      - name: audienceId
        in: path
        required: true
        description: Audience ID (UUID).
        schema:
          type: string
          format: uuid
      - name: formationId
        in: path
        required: true
        description: Formation ID (UUID).
        schema:
          type: string
          format: uuid
  /api/v1/audiences/{audienceId}/formations/{formationId}/recompute:
    post:
      responses:
        '200':
          description: The rebuild was queued.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - id
                    - status
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum:
                        - building
                        - ready
                        - failed
                        description: Usually `building`; already terminal when the build ran inline.
        '400':
          description: '`Audience ID is required`, `Invalid audience ID format`, `Formation ID is required`, or `Invalid formation ID format`.'
        '401':
          description: Missing or invalid API key (`Unauthorized`).
        '404':
          description: '`Formation not found`: the Audience is not viewable, or the Formation does not exist, is deleted, or is not mutable by the caller.'
        '500':
          description: Internal server error. Responses are private and non-cacheable.
      operationId: recomputeFormation
      summary: Re-sort the current members into an existing Formation
      description: 'Re-classifies the Audience''s current members against the Formation''s stored hypothesis and swaps the subgroups in place, without a new preview. Use it after members were added or recalibrated, or to recover a Formation stuck in `building` or `failed`. Flips `status` to `building` and returns immediately; poll `GET /audiences/{audienceId}/formations/{formationId}`. Same mutability rules as delete: collaborators for shared Formations, creators for private ones.'
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      parameters:
      - name: audienceId
        in: path
        required: true
        description: Audience ID (UUID).
        schema:
          type: string
          format: uuid
      - name: formationId
        in: path
        required: true
        description: Formation ID (UUID).
        schema:
          type: string
          format: uuid
  /api/v1/audiences/{audienceId}/formations:
    get:
      responses:
        '200':
          description: Visible Formations.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - pagination
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/FormationSummary'
                  pagination:
                    type: object
                    required:
                    - total
                    - limit
                    - offset
                    - hasMore
                    - nextOffset
                    properties:
                      total:
                        type: integer
                        minimum: 0
                      limit:
                        type: integer
                        minimum: 1
                        maximum: 100
                      offset:
                        type: integer
                        minimum: 0
                      hasMore:
                        type: boolean
                      nextOffset:
                        type:
                        - integer
                        - 'null'
                        minimum: 0
        '400':
          description: Invalid limit/offset, `Audience ID is required` or `Invalid audience ID format`.
        '401':
          description: Missing or invalid API key (`Unauthorized`).
        '404':
          description: '`Formation not found`: the Audience does not exist or the caller cannot view it (the message deliberately does not reveal which).'
        '500':
          description: Internal server error. Responses are private and non-cacheable.
      operationId: listFormations
      summary: List the Formations of an Audience
      description: 'Lists the Formations (persisted segmentations) visible to the caller on an Audience: shared Formations plus the caller''s own private ones, newest first (ID breaks timestamp ties), each with its subgroups and membership counts. Soft-deleted Formations are excluded. Anyone who can view the Audience may call this. Opening the list also seeds the canonical default and grounding-derived Formations for collaborators and re-queues stalled builds, so rows may come back with `status: building`; poll `GET /audiences/{audienceId}/formations/{formationId}` until they are `ready` or `failed`. Only one row per auto dimension is returned (ready preferred over building over failed). De-duplication precedes pagination: limit defaults to 100 and cannot exceed 100; offset defaults to 0. Follow pagination.nextOffset while hasMore is true. Only offset 0 performs seeding/recovery, attempting at most 100 oldest pending builds. Individual recovery failures do not prevent attempts for other selected builds or a successful list response. Pages are individually consistent; concurrent writes can shift later offsets.'
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      parameters:
      - name: audienceId
        in: path
        required: true
        description: Audience ID (UUID).
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          default: 0
    post:
      responses:
        '200':
          description: The Formation was created and its build queued.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - id
                    - name
                    - status
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      status:
                        type: string
                        enum:
                        - building
                        - ready
                        - failed
        '400':
          description: '`Invalid JSON body` or `Invalid Formation input` (needs non-empty `intent` and 2 to 15 uniquely identified and labelled subgroups with non-empty `id`, `label`, `definition`; optional `name` must be a string), `Audience has no members to categorize`, `FORMATION_CAP` (more than 1000 members), `Audience ID is required`, or `Invalid audience ID format`.'
        '401':
          description: Missing or invalid API key (`Unauthorized`).
        '404':
          description: '`Formation not found`: the Audience does not exist, the caller cannot view it, or the created Formation was deleted before acknowledgement.'
        '413':
          description: JSON request body exceeds 64 KiB.
        '500':
          description: Unexpected storage failure; internal details are redacted.
      operationId: createFormation
      summary: Create a Formation from an accepted hypothesis
      description: 'Creates a Formation from a hypothesis (the subgroup proposal returned by `POST /audiences/{audienceId}/formations/preview`, optionally edited) and starts sorting the Audience''s members into its subgroups. Returns immediately with `status: building`; poll `GET /audiences/{audienceId}/formations/{formationId}` until `ready` or `failed`. When the build runs inline the returned status may already be terminal. Any Audience viewer may create a Formation: collaborators create `shared` Formations, other viewers create ones private to themselves. The Audience must have at least one member and at most 1000. JSON bodies are limited to 64 KiB. Hypothesis text fields are trimmed and must be non-empty; subgroup IDs and labels must be unique. Reserved auxiliary IDs (unanswered, __unanswered, __other) cannot be used. User-created Formations require at least two populated primary buckets to become ready. All responses are private and non-cacheable.'
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      parameters:
      - name: audienceId
        in: path
        required: true
        description: Audience ID (UUID).
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - hypothesis
              properties:
                hypothesis:
                  $ref: '#/components/schemas/FormationHypothesis'
                name:
                  type: string
                  description: Optional display name. Defaults to a compact form of `hypothesis.intent`.
            examples:
              byGender:
                value:
                  name: By gender
                  hypothesis:
                    intent: Audience by gender
                    subgroups:
                    - id: woman
                      label: Female
                      definition: Members who identify as women.
                    - id: man
                      label: Male
                      definition: Members who identify as men.
  /api/v1/audiences/{audienceId}/formations/preview:
    post:
      responses:
        '200':
          description: The proposed hypothesis, either as one JSON document or as an NDJSON event stream.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    required:
                    - memberCount
                    - softWarn
                    - hardCapExceeded
                    - phase
                    - hypothesis
                    properties:
                      memberCount:
                        type: integer
                        minimum: 0
                      softWarn:
                        type: boolean
                        description: 'True from 50 members: builds take noticeably longer.'
                      hardCapExceeded:
                        type: boolean
                        description: 'True above 1000 members: `POST /formations` will refuse with `FORMATION_CAP`.'
                      phase:
                        type: string
                        enum:
                        - hypothesizing
                      hypothesis:
                        $ref: '#/components/schemas/FormationHypothesis'
            application/x-ndjson:
              schema:
                type: object
                description: One event per line.
                required:
                - type
                properties:
                  type:
                    type: string
                    enum:
                    - meta
                    - status
                    - subgroups
                    - error
                    - done
                  data:
                    description: '`meta`: `{ memberCount, softWarn, hardCapExceeded }`; `status`: `{ phase: "hypothesizing" }`; `subgroups`: a FormationHypothesis. Absent on `error` and `done`.'
                    oneOf:
                    - type: object
                      required:
                      - memberCount
                      - softWarn
                      - hardCapExceeded
                      properties:
                        memberCount:
                          type: integer
                        softWarn:
                          type: boolean
                        hardCapExceeded:
                          type: boolean
                    - type: object
                      required:
                      - phase
                      properties:
                        phase:
                          type: string
                          enum:
                          - hypothesizing
                    - $ref: '#/components/schemas/FormationHypothesis'
                  error:
                    type: string
                    description: Failure message; only on `error` events.
        '400':
          description: Invalid JSON or preview input, malformed priorHypothesis, missing Audience ID or invalid Audience ID format.
        '401':
          description: Missing or invalid API key (`Unauthorized`).
        '404':
          description: '`Formation not found`: the Audience does not exist or the caller cannot view it.'
        '406':
          description: Accept does not allow either supported UTF-8 JSON or NDJSON representation.
        '413':
          description: JSON request body exceeds 64 KiB.
        '500':
          description: 'Storage/setup failures return a generic HTTP 500 before either response mode starts. Model failures and invalid model proposals return Failed to propose subgroups: HTTP 500 in JSON mode, or an in-band error followed by done with HTTP 200 once NDJSON has started. Internal error details are never returned.'
      operationId: previewFormation
      summary: Propose Formation subgroups without creating anything
      description: 'Asks the model to propose a subgroup hypothesis for this Audience from a free-text request (e.g. "split by purchase frequency"). Nothing is persisted; pass the returned hypothesis (edited if you like) to `POST /audiences/{audienceId}/formations` to build it, or re-post with `priorHypothesis` set to the previous proposal to request a rework. Any Audience viewer may call this. Optional JSON bodies are limited to 64 KiB; userInput is a string of at most 2000 trimmed characters. Invalid supplied priorHypothesis values return 400. Responses, including refusals, are private and non-cacheable. Disconnecting the request or cancelling the stream aborts model generation. Returned proposals satisfy the creation input contract. Send `Accept: application/json` to receive one JSON document. Accept quality weights, wildcards, and media parameters are respected; when neither JSON nor NDJSON is acceptable the route returns 406 before generation. With no Accept preference the response is a newline-delimited JSON stream (`application/x-ndjson`) of `{ type, data }` events in the order `meta`, `status`, `subgroups`, `done`, with failures reported in-band as `{ type: "error", error }` followed by `done`.'
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      parameters:
      - name: audienceId
        in: path
        required: true
        description: Audience ID (UUID).
        schema:
          type: string
          format: uuid
      - name: Accept
        in: header
        required: false
        description: Choose application/json or application/x-ndjson, optionally with quality weights. Both use UTF-8. Missing Accept defaults to NDJSON; no acceptable type returns 406.
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                userInput:
                  type: string
                  maxLength: 2000
                  description: What to split by. Defaults to "Split this audience into meaningful subgroups."
                priorHypothesis:
                  oneOf:
                  - $ref: '#/components/schemas/FormationHypothesis'
                  - type: 'null'
                  description: The previous proposal when asking for a rework. Null or omitted means no prior proposal; malformed values return 400.
            examples:
              first:
                value:
                  userInput: Split by how often they buy online
  /api/v1/audiences/{audienceId}/members:
    post:
      responses:
        '200':
          description: The Minds were added (or were already members).
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - added
                    properties:
                      added:
                        type: integer
                        minimum: 1
                        description: Number of distinct Mind IDs in the request.
        '400':
          description: Invalid JSON/object input, more than 1,000 supplied IDs, invalid Mind UUIDs, `mindId or mindIds is required`, `At least one Mind ID is required` (empty array), a retired field name (rejected with a message naming its replacement), `Audience ID is required`, or `Invalid audience ID format`.
        '401':
          description: Missing or invalid API key (`Unauthorized`).
        '403':
          description: Adding these Minds would exceed the plan's Audience member cap. `statusMessage` names the plan and the limit; `data` carries the plan-limit envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanLimitError'
        '404':
          description: '`Audience not found` (missing, or the caller is not the owner), or `One or more Minds not found or not accessible` (a Mind is neither owned by the caller nor public). Nothing is added in either case.'
        '413':
          description: JSON body exceeds 64 KiB, including ignored fields.
        '500':
          description: Unexpected storage or plan-resolution failure. Internal details are not returned.
      operationId: addAudienceMembers
      summary: Add Minds to an Audience
      description: Adds one Mind (`mindId`) or several Minds (`mindIds`) to an Audience. Requires a JSON object within 64 KiB and at most 1,000 supplied IDs before deduplication. Owner only; collaborators and viewers receive 404. Membership capacity and authorization are rechecked in a single transaction; concurrent additions cannot both consume the last available slot. Responses, including refusals, are private and non-cacheable. Unexpected storage or plan-resolution failures return a generic 500. Every Mind must be owned by the caller or public, otherwise nothing is added. Minds that are already members are ignored, so the call is idempotent; `added` reports the number of distinct IDs in the request, not the number of new memberships. Newly added Minds are sorted into the Audience's ready Formations in the background, and default Formations are seeded if the Audience had none. In the background each added Mind is also placed on the Audience's charts from the facts its own record holds (never invented; its own record is not changed), the Audience's allocation audit is measured again on the current members, and members whose training failed are retrained. Use `mindIds` rather than the retired `mindId`/`mindIds` fields.
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      parameters:
      - name: audienceId
        in: path
        required: true
        description: Audience ID (UUID).
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Send either `mindId` or `mindIds`. When both are present `mindId` wins.
              oneOf:
              - required:
                - mindId
                properties:
                  mindId:
                    type: string
                    format: uuid
                    description: A single Mind to add; mindIds is ignored when this is supplied.
              - required:
                - mindIds
                not:
                  required:
                  - mindId
                properties:
                  mindIds:
                    type: array
                    minItems: 1
                    maxItems: 1000
                    items:
                      type: string
                      format: uuid
                    description: Several Minds to add. Duplicate IDs are deduplicated after the size check.
            examples:
              single:
                value:
                  mindId: 6f1d2c3a-1111-4222-8333-444455556666
              bulk:
                value:
                  mindIds:
                  - 6f1d2c3a-1111-4222-8333-444455556666
                  - 0a9b8c7d-2222-4333-8444-555566667777
  /api/v1/audiences/{audienceId}/members/{mindId}:
    delete:
      responses:
        '204':
          description: The Mind is no longer a member of the Audience.
        '400':
          description: '`Audience ID is required`, `Invalid audience ID format`, `Mind ID is required`, or `Invalid mind ID format`.'
        '401':
          description: Missing or invalid API key (`Unauthorized`).
        '404':
          description: '`Audience not found`: the Audience does not exist or the caller is not its owner.'
        '500':
          description: Unexpected storage failure; internal details are not returned.
      operationId: removeAudienceMember
      summary: Remove a Mind from an Audience
      description: Removes one Mind from an Audience and from every Formation subgroup on that Audience. The Mind itself is not deleted. Owner only; collaborators and viewers receive 404. Ownership is rechecked under a transaction lock; membership and subgroup cleanup commit together. Responses are private and non-cacheable, with generic 500 errors for unexpected storage failures. Removing a Mind that is not a member is a no-op that still returns 204. In the background the Audience's allocation audit is measured again on the remaining members, and members whose training failed are retrained.
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      parameters:
      - name: audienceId
        in: path
        required: true
        description: Audience ID (UUID).
        schema:
          type: string
          format: uuid
      - name: mindId
        in: path
        required: true
        description: Mind ID (UUID).
        schema:
          type: string
          format: uuid
  /api/v1/audiences/{audienceId}/progress:
    get:
      responses:
        '200':
          description: Current member progress snapshot.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required:
                    - audienceId
                    - members
                    - readiness
                    - reconciledAt
                    properties:
                      audienceId:
                        type: string
                        format: uuid
                      members:
                        type: array
                        items:
                          type: object
                          required:
                          - mindId
                          - update
                          properties:
                            mindId:
                              type: string
                              format: uuid
                            update:
                              type: object
                              description: Member progress. `readyToChat`, `trainingStatus`, `trainingError` and `beingRepaired` follow `GET /minds/{mindId}/training`.
                              properties:
                                readyToChat:
                                  type: boolean
                                  description: 'The member can answer: its profile and system prompt exist.'
                                beingRepaired:
                                  type: boolean
                                  description: 'Present and true while the member cannot answer yet because its last training attempt failed and it is retrained automatically (`trainingStatus: queued`).'
                                learningInBackground:
                                  type: boolean
                                  description: The member can answer and is still learning from its sources in the background.
                                fullyTrained:
                                  type: boolean
                                  description: The member can answer and its background knowledge step has settled.
                                trainingStatus:
                                  type: string
                                  enum:
                                  - queued
                                  - running
                                  - completed
                                  - failed
                      readiness:
                        type: object
                        required:
                        - total
                        - ready
                        - training
                        - failed
                        - isReady
                        - learning
                        - fullyTrained
                        properties:
                          total:
                            type: integer
                            description: Members counted.
                          ready:
                            type: integer
                            description: Members that can chat (`readyToChat`).
                          training:
                            type: integer
                            description: Members that cannot chat yet and are still training.
                          failed:
                            type: integer
                            description: 'Always 0: a member whose last training attempt failed is being prepared again and counts in `training` (its member update reports `trainingStatus: queued` and `beingRepaired`). Kept for existing clients.'
                          isReady:
                            type: boolean
                            description: 'Every member can chat: the Audience is ready.'
                          startsNow:
                            type: boolean
                            description: 'A Study started now runs at once: nothing is training, and the members that failed training for good are either few enough to leave out (at least one Mind and at least half of the members still answer) or can no longer be retrained automatically. Otherwise it waits for them to be retrained.'
                          leftOut:
                            type: integer
                            description: Members still being prepared that a Study started now runs without; they join once they are ready.
                          learning:
                            type: integer
                            description: Ready members still learning from their sources in the background.
                          fullyTrained:
                            type: boolean
                            description: Every member can chat and none is still learning.
                      research:
                        type: object
                        description: 'Where the Audience''s research stands. Never a reason to wait: the Audience is usable while it researches.'
                        properties:
                          phase:
                            type: string
                            enum:
                            - usable
                            - researching
                            - researched
                            description: '`researching`: background web research is running (or waiting for a run to end before it updates the members). `researched`: done, or finished at creation. `usable`: it failed; the Audience stays on its first phase.'
                          status:
                            type: string
                            nullable: true
                            enum:
                            - queued
                            - running
                            - completed
                            - failed
                          stage:
                            type: string
                            nullable: true
                            enum:
                            - researching
                            - waiting_for_runs
                            - recalibrating
                            - done
                            description: '`waiting_for_runs`: research is done and waits for a Study run or validation using these Minds to end before the members change.'
                          progress:
                            type: integer
                            minimum: 0
                            maximum: 100
                          startedAt:
                            type: string
                            format: date-time
                            nullable: true
                          completedAt:
                            type: string
                            format: date-time
                            nullable: true
                          outcome:
                            type: object
                            nullable: true
                            description: 'What the research changed: `chartsAdded`, `sourcesAdded`, `dimensionsImproved` ([{ dimension, from, to }]), `membersRecalibrated`, `coverage` counts, `applied`, and for Go deeper `topics` ([{ topic, status: added | already_covered | not_found, chart?, evidence? }]).'
                            additionalProperties: true
                      coverage:
                        type: object
                        nullable: true
                        description: How each relevant standard dimension is covered now.
                        properties:
                          dimensions:
                            type: array
                            items:
                              type: object
                              properties:
                                dimension:
                                  type: string
                                status:
                                  type: string
                                  enum:
                                  - sourced
                                  - proxy
                                  - assumed
                                  - missing
                                distribution:
                                  type: string
                          counts:
                            type: object
                            properties:
                              sourced:
                                type: integer
                              proxy:
                                type: integer
                              assumed:
                                type: integer
                              missing:
                                type: integer
                      reconciledAt:
                        type: integer
                        description: Server time of this snapshot, in epoch milliseconds.
        '401':
          description: Unauthorized.
        '404':
          description: Audience not found.
      operationId: getAudienceProgress
      summary: Get the current creation progress for an Audience
      description: 'One read of every member''s training state plus the Audience rollup. The Audience is ready when `readiness.isReady` is true: every member reports `readyToChat`, so it can be chatted with and a Study can run on it. `readiness.startsNow` says whether a Study started now runs at once even though some members failed training for good: it then runs without `readiness.leftOut` of them. Members keep learning from their sources in the background after that: `readiness.learning` counts the ready members whose knowledge step (a wider source collection, then a system prompt rebuilt from it) is still running, and `readiness.fullyTrained` turns true once none is. The Audience''s own research continues in the background too: a new Audience stands first on what is already known (the evidence pool, your material and stated assumptions), and `research.phase` is `researching` while its web research runs, `researched` once it has been merged and the members recalibrated (between runs, never under one), `usable` if it failed and the Audience stays on its first phase. `coverage` says how each relevant standard dimension is covered: `sourced`, `proxy`, `assumed` or `missing`. Ready to validate: a validation can be started once at least 10 members are `readyToChat` (`readiness.ready` ≥ 10); for a score of the finished Audience wait until `readiness.fullyTrained` is true and `research.phase` is not `researching`. That is the condition automatic validation of a new Audience waits for (it then starts within about 15 minutes, while an included validation is left); nothing else waits for it.'
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      parameters:
      - name: audienceId
        in: path
        required: true
        schema:
          type: string
  /api/v1/audiences/{audienceId}/recalibrate:
    post:
      responses:
        '200':
          description: Replay of a terminal operation. data.operation retains its completed result or failed error; no work is repeated.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - operation
                    properties:
                      operation:
                        type: object
                        description: The retained receipt with status completed or failed, result and error.
        '202':
          description: Accepted durable recalibration (`data.operation`) or Go deeper research (`data.research`). Follow statusUrl or progressUrl.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    oneOf:
                    - required:
                      - operation
                    - required:
                      - research
                      - progressUrl
                    properties:
                      operation:
                        type: object
                        description: 'Durable receipt: id, requestKey, status (queued/running/completed/failed), progress, statusUrl, result and error. Poll statusUrl for the grounding and member counts.'
                      research:
                        type: object
                        required:
                        - jobId
                        - phase
                        - status
                        - stage
                        - progress
                        properties:
                          jobId:
                            type: string
                            format: uuid
                            description: The background research job.
                          phase:
                            type: string
                            enum:
                            - researching
                          status:
                            type: string
                            enum:
                            - queued
                          stage:
                            type: string
                            enum:
                            - researching
                          progress:
                            type: integer
                            minimum: 0
                            maximum: 100
                      progressUrl:
                        type: string
                        description: The Audience progress read (`GET /audiences/{audienceId}/progress`) whose `research` follows this job.
        '400':
          description: '`Invalid recalibrate payload` (schema violation), `Invalid distributions payload` (selection mode produced no usable distributions), `Audience ID is required`, or `Invalid audience ID format`.'
        '401':
          description: Missing or invalid API key (`Unauthorized`).
        '403':
          description: An additive instruction with an explicit count exceeds the plan's Audience member cap, the Audience is already at the cap, or the plan's overall Mind quota would be exceeded. `data` carries the plan-limit envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanLimitError'
        '404':
          description: '`Audience not found`: the Audience does not exist or the caller is not its owner.'
        '409':
          description: 'Ten edits of this Audience are already waiting (`data.code: RECALIBRATION_IN_PROGRESS`).'
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    enum:
                    - 409
                  statusMessage:
                    type: string
                  data:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                        - RECALIBRATION_IN_PROGRESS
        '413':
          description: The recalibration request exceeds 32 MiB.
        '422':
          description: 'Research mode, only for an Audience without saved charts or a full `query` override: `Could not find sufficient scientific data to ground this audience. Try a more specific description.` or, for a `requestedDistribution` no chart can answer for these people, code `AUDIENCE_DISTRIBUTION_NOT_APPLICABLE`. An Audience with saved charts keeps them instead, and a requested chart that cannot be made (it does not divide these people, or the model was unavailable; the latter is researched again in the background) is left out while the rest of the edit applies (`result.requestedTopics[].status: not_found`). A newly attached file whose reading cannot be resolved still fails with its own 422. A requested chart the Audience already has (the topic is measured by an existing chart) is not refused: the run completes with that chart first and `result.requestedTopics[].status: already_covered`; a new chart reports `added`; selection mode on an Audience without stored grounding: `This audience has no grounding to recalibrate. Run a research recalibration first.`'
        '500':
          description: The run failed after it started; the calibration marker is cleared so a retry is possible.
        '502':
          description: 'Only for an Audience without saved charts, or a full `query` override: research is unavailable and no first-party distributions can be used. An edit of an Audience with saved charts never fails on research: the saved charts stand and research runs again in the background after the edit.'
        '503':
          description: Go deeper could not be queued, or its instruction could not be read (`AUDIENCE_EDIT_UNREAD`); nothing changed. Retry shortly.
      operationId: recalibrateAudience
      summary: Recalibrate an Audience's grounding and members
      description: 'Refreshes the stored grounding of a saved Audience and re-allocates its members to the resulting distributions. Owner, or confirmed Minds staff with existing direct Audience admin collaboration or an active owner-issued support grant, for composition amendments only (no growth, new sources, Go deeper or shared-Mind waiver). Support grants are managed under `/audiences/{audienceId}/support`. `deepen` (Go deeper) runs in the background and returns 202 at once with `data.research` (`jobId`, `phase: researching`) and `data.progressUrl`: it researches what the Audience still lacks (every standard dimension its coverage reports missing or assumed, plus `deepen.topics`) with the whole evidence pool and the coverage check, adds it to the saved grounding (every chart the Audience has stays; a chart gives way only to stronger evidence for the same question, or for the dimension it stands for), and recalibrates the members through the same step as any recalibration, between Study runs and validations, never under one (members keep answering with their previous version until their retrain lands). Follow it on `GET /audiences/{audienceId}/progress`: `research.phase` is `researching` until `researched`, `research.stage` moves researching → waiting_for_runs → recalibrating → done, and `research.outcome` reports the charts and sources added, the dimensions improved, the members recalibrated and, per requested topic, whether a chart was `added` (with its evidence tier), `already_covered` or `not_found`. Asked while the Audience''s background research runs, it is queued behind that research and starts when it finishes; an active or waiting edit never blocks it (its job waits for the edit before it changes members) (`data.research.queuedBehindRunningResearch: true`); topics asked again before it starts join it. `sources` and `instruction` sent with it join the Audience''s source bundle first. Two modes otherwise: research mode (default) re-runs deep research from the persisted brief, every earlier adjustment and the optional `instruction`, `sources` and `requestedDistribution`, or from `query` as a full override; selection mode (`distributions` present) skips research and only replaces the active distribution set, keeping the stored sources and review universe. In research mode the instruction is classified first: an adjustment ("make men 40%", "now they are all vegan", "only 50 to 60 years old") re-allocates the existing roster and rebuilds or evolves the members whose new segment contradicts who they are, while an additive instruction ("and now add 10 African consumers") keeps the existing members untouched and creates new ones within the plan''s member cap. Facts the instruction states for the added people ("add a CEO") are held by every one of them: when each is already a segment of the Audience''s charts the members are added on those charts without new research, otherwise research runs first. Those facts are held through every consistency repair of the new member (its other facts are redrawn around them, and a dealt value that contradicts one is dropped), and every chart stating the same fact (a translated copy) is pinned to the same value. The completed result lists them in `addedMinds` (id, name, role, description, the `requested` segments and the segments each `held`), with `requestedMembers` (how many were asked for) and `growthNotes` (what could not be done as asked, e.g. fewer members or a request that could not be read), so a run that adds fewer or no members says so.'
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      parameters:
      - name: audienceId
        in: path
        required: true
        description: Audience ID (UUID).
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: false
        description: Stable retry key; must match requestKey when both are supplied.
        schema:
          type: string
          minLength: 1
          maxLength: 128
      requestBody:
        description: Optional JSON request, up to 32 MiB. Empty input reruns research using saved sources.
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                requestKey:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: Stable retry key. Reuse with identical input to retrieve the same operation.
                query:
                  type: string
                  maxLength: 4000
                  description: Research mode. Full override of the research query; the persisted brief and adjustments are ignored and nothing is persisted for replay.
                instruction:
                  type: string
                  maxLength: 4000
                  description: Research mode. Adjustment appended to the replayed brief, e.g. "add an income distribution" or "skew younger". Persisted so later recalibrations replay it (additive instructions are stored declaratively).
                requestedDistribution:
                  type: string
                  minLength: 1
                  maxLength: 120
                  description: Research mode. Topic of exactly one distribution to add. Guaranteed to materialise (as an assumed-evidence axis when research finds no data); other axes and targets stay. An existing axis that states the same personal fact (for example personal and household income whose brackets cannot be compared) stays as a chart, and the requested one is allocated in its place.
                sources:
                  type:
                  - object
                  - 'null'
                  description: Research mode. Extra user sources, persisted to the Audience's source bundle and cited by the research run. Each list holds at most 20 entries.
                  properties:
                    files:
                      type: array
                      maxItems: 20
                      items:
                        type: object
                        required:
                        - name
                        - url
                        properties:
                          name:
                            type: string
                            maxLength: 300
                          url:
                            type: string
                            maxLength: 2000
                            description: URL of an already uploaded file.
                    links:
                      type: array
                      maxItems: 20
                      items:
                        type: string
                        maxLength: 2000
                    keywords:
                      type: array
                      maxItems: 20
                      items:
                        type: string
                        maxLength: 200
                distributions:
                  type: array
                  maxItems: 500
                  description: 'Selection mode. The complete active distribution set after a select/deselect edit of the saved review universe. Presence of this field (even empty) selects selection mode. Exact shares: to set a chart to e.g. 70% Female / 30% Male, send that chart with those `pct` values. They become the person''s targets (the chart keeps its evidence and reads "Set by you"), the members are re-allocated to them, and no research runs.'
                  items:
                    $ref: '#/components/schemas/GroundingDistribution'
                allowSharedMinds:
                  type: boolean
                  description: Rewrite members shared with other Audiences in place, there too. Without it they are copied into this Audience first and the other Audiences stay unchanged.
                then:
                  type: array
                  maxItems: 4
                  description: More parts of the same Rework, applied in order by this one operation after the first (for example exact chart edits, then an instruction, then "20 more"). Each item takes `query`, `instruction`, `requestedDistribution`, `sources`, `distributions` and `allowSharedMinds` like the top level. A part that fails stops the rest; the failure's `data.failedPart` names it (0-based). Not combinable with `deepen`.
                  items:
                    type: object
                deepen:
                  type: object
                  description: 'Go deeper: research what the Audience still lacks (its missing and assumed standard dimensions) plus `topics`, and add it. Not combinable with `distributions`, `query` or `requestedDistribution`.'
                  properties:
                    topics:
                      type: array
                      maxItems: 8
                      items:
                        type: string
                        maxLength: 120
                      description: More topics or dimensions to research, e.g. "media use" or "income".
            examples:
              adjust:
                value:
                  instruction: Make it 60% women and skew younger
              addDistribution:
                value:
                  requestedDistribution: Preferred furniture materials
              grow:
                value:
                  instruction: And now add 10 consumers from Nigeria
              selection:
                value:
                  distributions:
                  - name: Gender
                    distribution:
                    - label: Female
                      pct: 60
                      sourceIdx: 0
                    - label: Male
                      pct: 40
                      sourceIdx: 0
