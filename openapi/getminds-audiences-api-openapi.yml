  /api/v1/audiences/{audienceId}/regenerate-images:
    post:
      responses:
        '200':
          description: Summary of what was queued.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - audienceId
                    - totalMembers
                    - candidates
                    - enqueued
                    - skipped
                    - errors
                    - dry
                    - sample
                    properties:
                      audienceId:
                        type: string
                        format: uuid
                      totalMembers:
                        type: integer
                        minimum: 0
                      candidates:
                        type: integer
                        minimum: 0
                        description: Members matching the filter (missing portrait, or all when `force`), after `limit`.
                      enqueued:
                        type: integer
                        minimum: 0
                        description: Jobs actually queued; 0 on a dry run.
                      skipped:
                        type: integer
                        minimum: 0
                        description: Members left alone because they already have a portrait or belong to another user.
                      errors:
                        type: integer
                        minimum: 0
                        description: Members whose job could not be queued.
                      dry:
                        type: boolean
                      sample:
                        type: array
                        maxItems: 10
                        description: The first up to 10 queued (or, on a dry run, candidate) Minds.
                        items:
                          type: object
                          required:
                          - id
                          - name
                          properties:
                            id:
                              type: string
                              format: uuid
                            name:
                              type: string
        '400':
          description: '`Audience ID is required` or `Invalid audience ID format`.'
        '401':
          description: Missing or invalid API key (`Unauthorized`).
        '404':
          description: '`Audience not found`: the Audience does not exist or the caller is not its owner.'
      operationId: regenerateAudienceImages
      summary: Queue profile-image generation for the Minds in an Audience
      description: 'Bulk-enqueues portrait generation for the member Minds owned by the caller. Audience owner only; Minds owned by other users are skipped. By default only members without a `profileImageUrl` are queued; `force: true` replaces existing portraits after successful generation. Fire-and-forget: the response returns as soon as the jobs are queued, and images arrive asynchronously; poll `GET /audiences/{audienceId}` (member `profileImageUrl`) or `GET /minds/{mindId}`. Use `dry: true` to see what would be queued without queuing anything.'
      tags:
      - Audiences
      security:
      - ApiKeyAuth: []
      parameters:
      - name: audienceId
        in: path
        required: true
        description: Audience ID (UUID).
        schema:
          type: string
          format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  default: false
                  description: Regenerate even for Minds that already have a portrait (the current portrait stays visible until its replacement is ready).
                limit:
                  type: integer
                  minimum: 1
                  description: Cap the number of Minds queued in this call (oldest members first). No cap by default.
                dry:
                  type: boolean
                  default: false
                  description: Report the candidates without enqueueing.
            examples:
              missingOnly:
                value: {}
              forceFirstTen:
                value:
                  force: true
                  limit: 10
