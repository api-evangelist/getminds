openapi: 3.2.0
info:
  title: Minds Public Research API
  version: v1
  description: 'OpenAPI 3.1.0 spec for the Minds public API (https://getminds.ai/api/v1 / https://api.getminds.ai/v1). Generate a typed TypeScript client by running an OpenAPI generator (e.g. `openapi-typescript`) against `/_openapi.json`. Auth: send `Authorization: Bearer minds_…_key`; create keys in Settings → API Keys.'
servers:
- url: https://api.getminds.ai
  description: Production (api subdomain)
- url: https://getminds.ai
  description: Production (apex)
security:
- ApiKeyAuth: []
tags:
- name: Research
paths:
  /api/v1/research-methods:
    get:
      responses:
        '200':
          description: Versioned research methods.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
        '401':
          description: Missing or invalid authentication.
      operationId: listResearchMethods
      summary: List research methods
      description: Return the versioned research-method catalog, explicit executable state, availability, configuration JSON Schemas, semantic output types, fallback methods, and preparesQuestionsAtExecution (whether method configuration generates the execution questions). Experimental and planned methods are visible for framework compatibility but cannot be executed.
      tags:
      - Research
      security:
      - ApiKeyAuth: []
      parameters: []
  /api/v1/studies/{studyId}/research-plans/preview:
    post:
      responses:
        '200':
          description: Saved plan draft, per-question response contracts, and confirmation questions.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      plan:
                        $ref: '#/components/schemas/ResearchStudyPlan'
                      revisionCreatedAt:
                        type: string
                        format: date-time
                        description: When this draft revision was saved.
                      attachments:
                        type: array
                        description: Files the draft carries. Each file a run reads reports whether Minds can open it, before the run.
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            url:
                              type: string
                            kind:
                              type: string
                              enum:
                              - website
                            reading:
                              type: string
                              enum:
                              - read
                              - unreadable
                              - not_read
                              description: 'unreadable: the file cannot be opened (password-protected or damaged); upload a copy without the password, or a run with it stops before any question. read: opened, nothing wrong found. not_read: not checked (format not checked, or the file could not be fetched).'
        '400':
          description: Invalid request.
        '401':
          description: Unauthorized.
        '403':
          description: Study access denied.
        '404':
          description: Study or draft not found.
        '409':
          description: Draft revision conflict.
      operationId: previewStudyResearchPlan
      summary: Preview or revise a study research plan
      description: 'Let the research-planning model capture intent, main source, all attached assets, questions, optional methods, semantic outputs, missing inputs, confirmation questions, and a proposed response contract for every question. Clients can deterministically edit response formats and assign durable assets to exact questions. Pass `questions` instead of `request` to transcribe a fixed instrument exactly: text, order, ids, and per-item response contracts are stored as given and no planning model runs; a revision of a fixed instrument that sends no `questions`, `request` or `refinement` (for example only `answers`) keeps its saved questions. Pass `methodId` (a Study template''s `configuration.methodId`, or any method list_research_methods reports as executable) to run the first module with that registered method, as the web app does: the planner plans for it, or a fixed instrument keeps its questions as supplementary questions; methods that design their own tasks (Van Westendorp, Gabor-Granger, MaxDiff, conjoint, Kano, NPS, TURF and others) add them at execution from the method configuration. Revisions keep the selected method unless another is named. Fetchable remote files are copied into durable Minds chat storage before the versioned draft is saved. Local file:// paths are not uploads. A draft that research-runs would refuse is never returned as confirmable: a method configuration the planner left empty is filled from the request where possible, and anything still missing (price currency, price basis, method configuration, expected respondent material) is returned as a confirmation question with `startReadiness` and `status: needs_input`; revise with `answers` keyed by question id, using the option id for a choice question. This endpoint never executes research.'
      tags:
      - Research
      security:
      - ApiKeyAuth: []
      parameters:
      - in: path
        name: studyId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                loadLatest:
                  type: boolean
                  description: Read the latest owned draft without planning or saving. Requires draftPlanId; cannot be combined with edits or planner inputs.
                edits:
                  type: object
                  description: Deterministic edits to a saved revision. Preserves methods and enables each Mind’s relevant knowledge; cannot be combined with planner inputs.
                  additionalProperties: false
                  properties:
                    objective:
                      type: string
                      maxLength: 2000
                    promptContent:
                      type: string
                      maxLength: 20000
                    questions:
                      type: array
                      minItems: 1
                      maxItems: 200
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - id
                        - moduleId
                        - text
                        - response
                        properties:
                          id:
                            type: string
                          moduleId:
                            type: string
                          text:
                            type: string
                            maxLength: 2000
                          response:
                            $ref: '#/components/schemas/ResearchQuestionResponse'
                          attachmentIds:
                            type: array
                            items:
                              type: string
                          askIf:
                            $ref: '#/components/schemas/ResearchQuestionCondition'
                request:
                  type: string
                studyLocale:
                  type: string
                  enum:
                  - en
                  - es
                  - fr
                  - de
                  - zh
                  - tr
                  - ar
                  - ja
                  - ko
                  description: Language used for the plan and its eventual study output.
                videoAnalysisStyle:
                  type: string
                  enum:
                  - record
                  - analyst
                  default: record
                  description: Register of the one video summary every Mind of this run reads. record writes down the spoken script, the visible scenes and the on-screen text. analyst deliberately reproduces the pre-2026-09 prompt, which reads tone and intent and raises the study's positive rating bias; use it only to replicate an older run.
                source:
                  type: object
                  description: The main source. Prompt content is exact respondent-visible material and is separate from planner-only request text.
                  properties:
                    kind:
                      type: string
                      enum:
                      - prompt
                      - website
                      - image
                      - video
                      - document
                      - questionnaire
                      - other
                    label:
                      type: string
                    url:
                      type: string
                      format: uri
                    mimeType:
                      type: string
                    content:
                      type: string
                      maxLength: 20000
                attachments:
                  type: array
                  maxItems: 100
                  description: Files and website assets available to the confirmed run (one question block). Multi-asset blocks require complete question assignments and coverage of every asset; each question receives only its own assets. Empty lists explicitly mean no assets. Remote file URLs are durably imported; kind website remains a website.
                  items:
                    type: object
                    properties:
                      kind:
                        type: string
                        enum:
                        - website
                      id:
                        type: string
                      name:
                        type: string
                      url:
                        type: string
                      path:
                        type: string
                      mimeType:
                        type: string
                      type:
                        type: string
                questionAttachments:
                  type: array
                  description: One-based question-to-attachment-id mapping. A question left out receives every asset. An asset placed on no question is shown with every question, including questions mapped to empty attachmentIds. Each question may appear at most once.
                  items:
                    type: object
                    required:
                    - questionNumber
                    - attachmentIds
                    additionalProperties: false
                    properties:
                      questionNumber:
                        type: integer
                        minimum: 1
                      attachmentIds:
                        type: array
                        minItems: 0
                        maxItems: 20
                        uniqueItems: true
                        items:
                          type: string
                suggestQuestionStimuli:
                  type: boolean
                  description: Default true. Lets the planner assign each attached file or website to one or more questions; the ids appear as attachmentIds on those questions. Pass false to keep questions unassigned unless questionAttachments names them.
                draftPlanId:
                  type: string
                  format: uuid
                revision:
                  type: integer
                  minimum: 1
                refinement:
                  type: string
                answers:
                  type: object
                  additionalProperties:
                    type: string
                questionResponses:
                  type: object
                  additionalProperties:
                    $ref: '#/components/schemas/ResearchQuestionResponse'
                  description: Explicit response-format edits keyed by question ID from the current draft.
                questions:
                  $ref: '#/components/schemas/FixedInstrumentQuestions'
                methodId:
                  type: string
                  maxLength: 80
                  description: 'Registered research method for the first module, such as a Study template''s configuration.methodId (van-westendorp, maxdiff, conjoint, nps, turf, …). Must be executable (list_research_methods); an unknown or unavailable method is a 400. Its configuration is filled from the request, questions and answers where they state it, otherwise asked as a confirmation question. Omitted on a new draft: the planner chooses, and a fixed instrument runs as Custom research (guided-research). Omitted on a revision: the method selected earlier is kept. Cannot be combined with edits or loadLatest.'
                idempotencyKey:
                  type: string
                  maxLength: 200
                  description: 'Retry-safety key. A repeated preview with the same key returns the draft revision the first attempt saved (`replayed: true`) instead of planning again. The `Idempotency-Key` header takes precedence.'
  /api/v1/studies/{studyId}/research-runs/{runId}:
    get:
      responses:
        '200':
          description: Durable study status and immutable response contracts.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      plan:
                        $ref: '#/components/schemas/ResearchStudyPlan'
                      executionPlan:
                        $ref: '#/components/schemas/ResearchStudyPlan'
                      status:
                        type: string
                        enum:
                        - queued
                        - running
                        - completed
                        - partial
                        - failed
                        - cancelled
                        - plan_limited
                        description: Partial means settled questions have missing respondent answers or some questions failed. It is terminal collection, not complete evidence.
                      progress:
                        type: object
                        properties:
                          total:
                            type: integer
                          settled:
                            type: integer
                          failed:
                            type: integer
                          partial:
                            type: integer
                            description: Questions with recorded incomplete respondent coverage.
                          skipped:
                            type: integer
                            description: Questions a plan limit kept from running.
                          pct:
                            type: integer
                            description: Settled-question progress, not respondent coverage.
                      planLimit:
                        type: object
                        additionalProperties: true
                        description: 'With status plan_limited: the PLAN_LIMIT envelope that stopped the run (limitType studyAnswers or responses, limit, current, resumeAvailable).'
                      skippedQuestions:
                        type: array
                        items:
                          type: object
                          properties:
                            index:
                              type: integer
                            text:
                              type: string
                        description: 'With status plan_limited: the questions not asked, by zero-based plan index. POST research-runs/{runId}/resume runs them in place once the plan allows it.'
                      memberKnowledge:
                        type: object
                        required:
                        - consulted
                        - sourcePolicy
                        - description
                        description: Whether this run allowed relevant Mind-knowledge retrieval. Ordinary Studies use each Mind’s knowledge alongside the assigned stimulus. Historical and internal evaluation runs retain their recorded policy; show the description to the user.
                        properties:
                          consulted:
                            type: boolean
                            description: True only when at least one Mind could retrieve its own knowledge.
                          sourcePolicy:
                            type: string
                            enum:
                            - auto
                            - request_only
                            - knowledge_only
                            description: The run default, before per-Mind overrides.
                          description:
                            type: string
                            description: One sentence that can be shown verbatim.
                          mindOverrides:
                            type: object
                            description: Present only for a preregistered per-Mind source-policy experiment; the run is then not uniform.
                            properties:
                              count:
                                type: integer
                              consulting:
                                type: integer
                      respondentStimulusDelivery:
                        type: object
                        description: Configured stimulus channel, not proof of delivery. The frozen base Mind profile excludes per-run stimulus.
                        properties:
                          channel:
                            type: string
                            enum:
                            - prompt_evidence
                            - website_analysis
                            - file_analysis
                            - none
                          mindProfileIncludesStimulus:
                            type: boolean
                            enum:
                            - false
                          verification:
                            type: string
                            enum:
                            - configuration_only
                          description:
                            type: string
                      respondentMediaEvidence:
                        type: object
                        description: Per-Mind video evidence audit. Verified means every recorded answer for every video question has matching audiovisual receipts and accepted-call SDK media prompt hashes.
                        properties:
                          version:
                            type: string
                            enum:
                            - respondent-media-evidence-v1
                          status:
                            type: string
                            enum:
                            - not_applicable
                            - verified
                            - incomplete
                          videoQuestionCount:
                            type: integer
                          answerCount:
                            type: integer
                          verifiedAnswerCount:
                            type: integer
                          visualContract:
                            type: string
                            enum:
                            - scene-sampled-frames
                          speechContract:
                            type: string
                            enum:
                            - full-transcript
                          soundtrackContract:
                            type: string
                            enum:
                            - bounded-analysis
                          failures:
                            type: array
                            items:
                              type: object
                              additionalProperties: true
                      questionAttachments:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                      answerConsistency:
                        type: object
                        required:
                        - version
                        - status
                        description: After a completed run, each Mind's answers are checked against each other. Counts of Minds and flags; each flagged response artifact carries answerConsistency.flags. Answers are never changed. A check that could not run at all records only version and status failed.
                        properties:
                          version:
                            type: string
                            enum:
                            - answer-consistency-v1
                          status:
                            type: string
                            enum:
                            - checked
                            - incomplete
                            - failed
                            description: 'incomplete: the time budget or a cancellation stopped the check; unchecked Minds are counted. failed: the check could not run, or no flag could be saved.'
                          checkedMinds:
                            type: integer
                            description: Minds whose answers were checked.
                          flaggedMinds:
                            type: integer
                            description: Checked Minds with at least one flag.
                          flagCount:
                            type: integer
                            description: Contradictions found; each pair of answers counts once.
                          uncheckedMinds:
                            type: integer
                            description: Minds whose check could not run; their answers are unflagged, not cleared.
                          unsavedItems:
                            type: array
                            items:
                              type: integer
                            description: 'Present only when some answer rows could not store their flags: those question indexes. The other rows keep theirs.'
                          usage:
                            type: object
                            description: Model calls and tokens the check used.
                            properties:
                              calls:
                                type: integer
                              inputTokens:
                                type: integer
                              outputTokens:
                                type: integer
                      artifacts:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                          properties:
                            answerConsistency:
                              type: object
                              required:
                              - version
                              - flags
                              description: Present on a response artifact when a Mind's answer to this question contradicts its answer to another question of the run. Flags only; the answer is unchanged.
                              properties:
                                version:
                                  type: string
                                  enum:
                                  - answer-consistency-v1
                                flags:
                                  type: array
                                  items:
                                    type: object
                                    required:
                                    - mindId
                                    - withItem
                                    - reason
                                    properties:
                                      mindId:
                                        type: string
                                        description: The Mind whose answers contradict each other.
                                      withItem:
                                        type: integer
                                        description: Question index of the other answer.
                                      reason:
                                        type: string
                                        description: Why the two answers contradict each other.
                      calculations:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
        '401':
          description: Unauthorized.
        '403':
          description: Study access denied.
        '404':
          description: Study not found.
      operationId: getStudyResearchStudy
      summary: Get research study status
      description: 'Return durable progress, the immutable confirmed plan snapshot with per-question response contracts, response artifacts, deterministic method calculations, and stage readiness for a confirmed multi-question Study run. An item with askIf carries routing on its artifact: askedCount, and the Minds not asked, which are excluded from that item''s responses; an item no Mind was asked is a not_asked artifact. An item gated on an open question''s category also carries gateCoding (per category, how many gate answers were coded into it, and how many into none), with none meaning a verified outside-frame reading. New verified readings include an opaque readingId referencing private source evidence; the evidence itself is not included in public results. Unavailable or unresolved gate readings fail before asking dependent respondents and use the existing retry/error lifecycle. Older artifacts may retain gateCodingUnavailable when a historical worker asked everyone after coding failed.'
      tags:
      - Research
      security:
      - ApiKeyAuth: []
      parameters:
      - in: path
        name: studyId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: runId
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/studies/{studyId}/research-runs/{runId}/resume:
    post:
      responses:
        '200':
          description: The run is queued again, or was already running.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - status
                    - studyId
                    - runId
                    properties:
                      status:
                        type: string
                        enum:
                        - queued
                        - already_running
                      studyId:
                        type: string
                        format: uuid
                      runId:
                        type: string
                        format: uuid
                      jobId:
                        type: string
        '400':
          description: The Study is not a multi-question Study.
        '401':
          description: Unauthorized.
        '403':
          description: Study access denied.
        '404':
          description: Study or run not found.
        '409':
          description: The run is not waiting on a plan limit, cannot be resumed automatically (`STUDY_RESUME_UNAVAILABLE`), or the account has no paid plan yet (`ENTITLEMENT_PENDING`).
      operationId: resumeStudyResearchRun
      summary: Resume a plan-limited multi-question Study run
      description: 'Continue a confirmed multi-question run that stopped at a plan limit (`status: plan_limited`), in place and with its original confirmed questions and answer contracts. Questions that already have answers are not asked again. Requires a paid plan; the worker re-checks every remaining allowance before each question, so a run can stop at a limit again.'
      tags:
      - Research
      security:
      - ApiKeyAuth: []
      parameters:
      - in: path
        name: studyId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: runId
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/studies/{studyId}/research-runs:
    post:
      responses:
        '200':
          description: Study queued with its immutable confirmed response contracts.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      plan:
                        $ref: '#/components/schemas/ResearchStudyPlan'
                      questionCount:
                        type: integer
                        description: Questions accepted into this run.
                      requestedQuestionCount:
                        type: integer
                        description: Questions in the confirmed plan.
                      skippedQuestionCount:
                        type: integer
                        description: Questions left out because the Free plan Study answer allowance could not cover them. The run stops as plan_limited after the accepted questions and can be resumed once the plan allows it.
                      leftOutMinds:
                        type: array
                        description: 'Present when Minds that are still being prepared (their last training attempt failed past the automatic recovery budget) are left out of the run: at least one Mind and at least half of the Minds it asks still answer, and the left-out Minds are retrained automatically.'
                        items:
                          type: object
                          properties:
                            mindId:
                              type: string
                              format: uuid
                            name:
                              type: string
                            audienceId:
                              type: string
                              format: uuid
                      skippedQuestions:
                        type: array
                        items:
                          type: object
                          properties:
                            index:
                              type: integer
                            text:
                              type: string
                        description: 'Present when questions were skipped: their zero-based plan index and text.'
                      planLimit:
                        type: object
                        additionalProperties: true
                        description: 'Present when questions were skipped: the PLAN_LIMIT envelope (limitType, limit, current, remaining, periodEnd).'
                      memberKnowledge:
                        type: object
                        required:
                        - consulted
                        - sourcePolicy
                        - description
                        description: Whether this run allowed relevant Mind-knowledge retrieval. Ordinary Studies use each Mind’s knowledge alongside the assigned stimulus. Historical and internal evaluation runs retain their recorded policy; show the description to the user.
                        properties:
                          consulted:
                            type: boolean
                          sourcePolicy:
                            type: string
                            enum:
                            - auto
                            - request_only
                            - knowledge_only
                          description:
                            type: string
                            description: One sentence that can be shown to the user verbatim.
                          mindOverrides:
                            type: object
                            properties:
                              count:
                                type: integer
                              consulting:
                                type: integer
        '400':
          description: Plan is incomplete, unconfirmed, invalid, unavailable, or not executable.
        '401':
          description: Unauthorized.
        '403':
          description: Study or draft access denied.
        '404':
          description: Study or draft not found.
        '409':
          description: 'Draft already confirmed for another run, or no Mind of the selected Audiences can answer and none can be retrained (legacy code `PANEL_MINDS_NOT_READY`, `data.cause: no_mind_can_answer`, with `data.notReady` naming the Minds). Minds still training never refuse a run: it is queued (`status: preparing`) and starts once they are ready. Minds still being prepared after a failed training attempt are left out when at least one Mind and at least half of the Minds it asks can answer (`leftOutMinds`), and retrained first otherwise; either way they are retrained automatically.'
        '422':
          description: Required respondent-visible image, file, or URL could not be read. The Study is not queued and no quota is used.
      operationId: runStudyQuestions
      summary: Confirm and run a multi-question Study block
      description: 'Execute an exact saved research-plan revision after explicit confirmation, including every confirmed per-question response and attachment contract. The server, not the client or model, marks required capabilities reviewed and enforces advanced-method opt-in, method availability, and durable media resolution. Items are answered in order as one respondent would: every Mind answers an item in parallel and sees only its own earlier answers in this run.'
      tags:
      - Research
      security:
      - ApiKeyAuth: []
      parameters:
      - in: path
        name: studyId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - draftPlanId
              - revision
              - confirmation
              properties:
                draftPlanId:
                  type: string
                  format: uuid
                revision:
                  type: integer
                  minimum: 1
                confirmation:
                  type: object
                  required:
                  - accepted
                  properties:
                    accepted:
                      type: boolean
                      enum:
                      - true
                    advancedMethodOptIn:
                      type: boolean
                audienceIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                idempotencyKey:
                  type: string
                  format: uuid
                modelConnection:
                  type: object
                  additionalProperties: false
                  required:
                  - id
                  - revision
                  properties:
                    id:
                      type: string
                      format: uuid
                    revision:
                      type: integer
                      minimum: 1
                  description: Verified caller-team connection for Mind answers and verbatim rendering. Pinned at confirmation; retries must keep the same selection. Supporting analysis retains platform models.
  /api/v1/studies/{studyId}/summary:
    get:
      responses:
        '200':
          description: Persisted semantic summary.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
        '400':
          description: Study is not in study mode.
        '401':
          description: Unauthorized.
        '403':
          description: Study access denied.
        '404':
          description: Study not found.
      operationId: getStudySemanticSummary
      summary: Get a study semantic summary
      description: 'Return the persisted whole-study summary, semantic output blocks, staleness, message coverage, and `nextSteps`: the suggested follow-up questions from the latest finished run. Renderers are hints; consumers may introduce new UI logic without changing evidence contracts.'
      tags:
      - Research
      security:
      - ApiKeyAuth: []
      parameters:
      - in: path
        name: studyId
        required: true
        schema:
          type: string
          format: uuid
    post:
      responses:
        '200':
          description: Generated semantic summary.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
        '400':
          description: Study is not in study mode, or does not have enough content.
        '401':
          description: Unauthorized.
        '403':
          description: Study access denied.
        '404':
          description: Study not found.
        '409':
          description: A newer generation or deletion superseded this request; reload before retrying.
        '413':
          description: Summary request exceeds 4 KiB.
      operationId: refreshStudySemanticSummary
      summary: Generate or refresh a study semantic summary
      description: Generate and persist a whole-study summary with flexible semantic blocks. Visual-source evidence is represented as heatmaps rather than generic distribution charts.
      tags:
      - Research
      security:
      - ApiKeyAuth: []
      parameters:
      - in: path
        name: studyId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                force:
                  type: boolean
                  default: false
                length:
                  type: string
                  enum:
                  - short
                  - standard
                  - detailed
                  default: standard
components:
  schemas:
    FixedInstrumentQuestions:
      type: array
      minItems: 1
      maxItems: 200
      description: 'Fixed instrument. When present the planner is bypassed: every question is stored verbatim (whitespace collapsed), in this order, with exactly this response contract, except that a question sent as qualitative (or as a choice without options) whose own text lists its answers is stored as the choice question that text states: single choice, multiselect or ranking. Use `edits` on the saved revision to set it back to qualitative. Consecutive questions sharing a module label form one module. Cannot be combined with refinement, answers, questionResponses, or suggestQuestionStimuli. Repeated question texts or colliding ids are rejected.'
      items:
        type: object
        required:
        - text
        - response
        additionalProperties: false
        properties:
          id:
            type: string
            maxLength: 80
            description: Stable item id; lower-cased to a slug. Defaults to q<position>.
          text:
            type: string
            maxLength: 2000
            description: 'Exact respondent-visible question text, including any anchors or labels. Skip and filter instructions ("No -> go to Q12", "only if Q3 = Yes") do not belong in the text either: transcribe each as askIf. A jump from an answer of item G to item N gives every item between G and N answerNotIn [that answer]; a filter gives answerIn. Tell the person about any instruction you cannot map to exact items and options instead of guessing it.'
          module:
            type: string
            maxLength: 200
            description: Optional module (battery) label; consecutive questions with the same label are grouped.
          response:
            oneOf:
            - type: object
              required:
              - type
              additionalProperties: false
              properties:
                type:
                  type: string
                  enum:
                  - qualitative
            - type: object
              required:
              - type
              - categoricalOptions
              additionalProperties: false
              properties:
                type:
                  type: string
                  enum:
                  - categorical
                categoricalOptions:
                  type: array
                  minItems: 2
                  maxItems: 100
                  uniqueItems: true
                  items:
                    type: string
                    minLength: 1
                  description: Predefined answer choices shown to every Mind.
            - type: object
              required:
              - type
              - categoricalOptions
              additionalProperties: false
              properties:
                type:
                  type: string
                  enum:
                  - multiselect
                categoricalOptions:
                  type: array
                  minItems: 2
                  maxItems: 100
                  uniqueItems: true
                  items:
                    type: string
                    minLength: 1
                  description: Predefined answers from which each Mind may select multiple choices.
                maxSelections:
                  type: integer
                  minimum: 1
                  maximum: 100
                  description: Maximum choices each respondent may select.
            - type: object
              required:
              - type
              - categoricalOptions
              additionalProperties: false
              properties:
                type:
                  type: string
                  enum:
                  - ranking
                categoricalOptions:
                  type: array
                  minItems: 2
                  maxItems: 100
                  uniqueItems: true
                  items:
                    type: string
                    minLength: 1
                  description: Predefined answers every Mind puts in order, first to last. Results report first places as the distribution plus each option's mean rank.
            - type: object
              required:
              - type
              additionalProperties: false
              properties:
                type:
                  type: string
                  enum:
                  - scale
                unit:
                  type: object
                  properties:
                    kind:
                      type: string
                      enum:
                      - currency
                      - percentage
                      - duration
                      - length
                      - mass
                      - volume
                      - custom
                    code:
                      type: string
                      minLength: 1
                      maxLength: 80
                      description: ISO 4217 currency code (EUR, USD); % for percentage; singular Intl unit identifier (hour, meter, kilogram, liter) for measurements; or a label of up to 80 characters for custom. Selecting a unit does not convert numbers or impose a range.
                  required:
                  - kind
                  - code
                  additionalProperties: false
                  description: Unit of a numeric (scale) answer. Values stay plain numbers; result surfaces display them in this unit.
                scalePoints:
                  type: array
                  minItems: 2
                  maxItems: 100
                  description: Exhaustive allowed numeric scale answers in authored order. Preserve literal labels and values; do not add intermediate points.
                  items:
                    type: object
                    additionalProperties: false
                    required:
                    - label
                    - value
                    properties:
                      label:
                        type: string
                        minLength: 1
                      value:
                        type: number
                scaleRange:
                  type: array
                  minItems: 2
                  maxItems: 2
                  items:
                    type: number
                  description: Optional inclusive finite numeric response bounds as [minimum, maximum]. Omit when the numeric response has no authored bounds.
            description: Confirmed response contract for a planned question.
          askIf:
            type: object
            additionalProperties: false
            required:
            - questionId
            oneOf:
            - required:
              - answerIn
            - required:
              - answerNotIn
            - required:
              - categoryIn
            - required:
              - categoryNotIn
            description: 'Ask this question only of respondents whose own answer to an earlier question matched. Give exactly one of: answerIn (asked when the respondent chose any of these options) or answerNotIn (asked when it chose none of them) for an earlier categorical or multiselect question, using its option labels exactly; or categoryIn / categoryNotIn for an earlier open (qualitative) question, which codes each respondent''s own answer into one of the categories named for that question (one coding frame per question, at most 12 categories) after it has been answered and before this question runs. An answer that fits none of the categories counts as none of them. Scale and ranking questions cannot gate. Respondents not asked are recorded as not asked and excluded from this question''s results.'
            properties:
              questionId:
                type: string
                minLength: 1
                maxLength: 80
                description: Id of the earlier question whose answer decides.
              answerIn:
                type: array
                minItems: 1
                maxItems: 100
                items:
                  type: string
                  minLength: 1
                  maxLength: 500
              answerNotIn:
                type: array
                minItems: 1
                maxItems: 100
                items:
                  type: string
                  minLength: 1
                  maxLength: 500
              categoryIn:
                type: array
                minItems: 1
                maxItems: 100
                items:
                  type: string
                  minLength: 1
                  maxLength: 500
              categoryNotIn:
                type: array
                minItems: 1
                maxItems: 100
                items:
                  type: string
                  minLength: 1
                  maxLength: 500
