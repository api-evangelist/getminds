name: Minds
aid: getminds
description: >-
  Minds (getminds.ai) is an end-to-end platform for commercial synthetic market
  research. Brand, agency, product and insights teams build reusable AI Audiences
  grounded in their own research and public sources, then run in-depth interviews,
  questionnaires, concept and message tests, MaxDiff/conjoint methods, and segment
  comparisons in a single Study — from audience creation through analysis and
  export. Minds ships a public v1 REST API (OpenAPI 3.1.0, 103 operations), a
  hosted MCP server (23 published tools, OAuth 2.0 / API key), and an agent
  integration guide. Operated by Art of X UG (Berlin, Germany) with EU (Frankfurt/
  Stockholm) data residency and a full GDPR posture.
